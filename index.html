ു ഫോട്ടോയിൽ പശ്ചാത്തലമായി കാണുന്ന ആഡംബര ബോട്ട് - അത് അദ്ദേഹത്തിന്റേതായിരിക്കാം, അല്ലെങ്കിൽ തന്റേതാണെന്ന് മറ്റുള്ളവർ വിശ്വസിക്കണമെന്ന് അദ്ദേഹം ആഗ്രഹിച്ചിരിക്കാം എന്നീ വിവരങ്ങൾ അവൾ കണ്ടെത്തി.", "പക്ഷെ, അവൾ മറ്റൊരു കാര്യം ശ്രദ്ധിച്ചിരുന്നു. 2014 മുതലുള്ള ഓരോ ഫോട്ടോയിലും, അദ്ദേഹത്തിനടുത്ത് എവിടെയോ, നേരത്തെ അവൾ വീഡിയോയിൽ കണ്ട അതേ മനുഷ്യന്റെ സാന്നിധ്യമുണ്ട്.", "അയാളൊരിക്കലും ചിത്രങ്ങളുടെ ഫോക്കസിൽ വരുന്നില്ല. ചിലപ്പോൾ ഫ്രയിമിന്റെ ചില മൂലകളിൽ, ചിലപ്പോൾ ഫ്രയിമിന്റെ ഒരു കാൽ ഭാഗത്ത്. നാല്പതിനും അമ്പതിനും ഇടയ്ക്ക് പ്രായമുള്ള, അതിയാവശ്യം ഉയരവും ശരീരപ്രകൃതിയുമുള്ള ഒരാൾ. ഇടത് കൈത്തണ്ടയിൽ ആ സ്വർണ്ണ നിറമുള്ള വാച്ച്‌ എല്ലാ ചിത്രങ്ങളിലുമുണ്ട്. ചിത്രങ്ങളുടെ ഒപ്പമുള്ള വാർത്തകാലും കുറിപ്പുകളും പരിശോധിക്കുമ്പോൾ അവൾക് ആ പേര് കിട്ടി.", "ദേവ് വർമ്മ, വർമ്മ ക്യാപിറ്റലിന്റെ ചെയർമാൻ.", "അവൾ കോൺഫറൻസ് വീഡിയോയിൽ നിന്നുള്ള സ്ക്രീൻഷോട്ട് തുറന്ന്, 2021-ലെ ഒരു ഓൺലൈൻ മാഗസിനിലുണ്ടായിരുന്ന ഫോട്ടോയ്ക്ക് അരികിലായി വെച്ചു. തോളും, കൺപുരികത്തിനടുത്തുള്ള ഭാഗവും, ആ സ്വർണ്ണ നിറമുള്ള വാച്ചും.", "ഏറ്റവും ആദ്യം കൈയടിക്കാൻ തുടങ്ങിയ ആ മനുഷ്യൻ.", "മൂന്ന് വർഷങ്ങൾക് മുമ്പ് പ്രസിദ്ധീകരിച്ച ആ ആർട്ടിക്കിളിൽ അയാളെ കുറിച്ച് പ്രശംസാപരമായ വിവരങ്ങളായിരുന്നു ഉണ്ടായിരുന്നത്. 'ബാംഗ്ലൂരിൽ നിന്ന് ഗൾഫിലേക്ക്: ക്യാപിറ്റൽ മാർക്കറ്റിലെ നിശബ്ദ ശില്പി' എന്നായിരുന്നു ആ ആർട്ടിക്കിളിന്റെ തലക്കെട്ട്. ആ ലേഖനത്തിൽ ഇങ്ങനെ ഒരു വിവരമുണ്ടായിരുന്നു. 'ബാംഗ്ലൂരിൽ ജനിച്ചുവളർന്ന അദ്ദേഹം, സ്വന്തം നഗരത്തിൽ എക്‌സ്‌പോർട്ട് ഫിനാൻസ് മേഖലയിൽ ഔദ്യോഗിക ജീവിതം ആരംഭിക്കുകയും, പിന്നീട് 2011-ൽ യു.എ.ഇയിലേക്ക് മാറുകയും ചെയ്തു.' അതോടൊപ്പം ദുബായ് ക്രീക്കിന് അഭിമുഖമായുള്ള ഒരു ബാൽക്കണിയിൽ നിൽക്കുന്ന അയാളുടെ ചിത്രവും ഉണ്ടായിരുന്നു. പണം നൽകി വരുതിയിലാക്കാൻ കഴിയാത്ത ആരിൽ നിന്നും ഒരിക്കലും ഒരു 'ഇല്ല' എന്ന മറുപടി കേട്ടിട്ടില്ലാത്ത ഒരാളുടെ പുഞ്ചിരിയായിരുന്നു ആ മുഖത്ത്.", "എന്നാൽ ബംഗളുരുവിൽ അയാൾ ജോലി ചെയ്തിരുന്ന കമ്പനിയെ കുറിച്ച് ഒരു പരാമര്ശമോ സൂചനയോ അതിൽ ഇല്ലായിരുന്നു. അവൾക്കെന്തോ ഒരു ഉൾവിളി ഉണ്ടായ പോലെ തോന്നി. അഞ്ജലി തന്റെ ബാഗിൽ നിന്ന് അച്ഛന്റെ ആ പഴയ ഡയറി പുറത്തെടുത്തു. 2009 ജൂണിലെ പേജുകൾ തുറന്നു. ജൂണിലെ എക്‌സ്‌പോർട്ട് ഇൻവോയ്‌സുകൾ ഷിപ്പിംഗ് ബില്ലുകളുമായി ഒത്തുപോകുന്നില്ല. ഡി-യോട് ചോദിച്ചപ്പോൾ, സമയവ്യത്യാസം മൂലമാണെന്നാണ് അദ്ദേഹം പറയുന്നത്.", "അവൾ ഡയറിയിൽ നിന്നും സ്ക്രീനിലേക്കും, തിരിച്ചും മാറി മാറി നോക്കി.", "ഡി.", "ബാംഗ്ലൂരിലെ പകുതിയോളം പുരുഷന്മാരുടെയും പേരുകൾ തുടങ്ങുന്നത് 'D' എന്ന അക്ഷരത്തിലായിരുന്നു. അതുകൊണ്ട് പ്രത്യേകിച്ച് അർത്ഥമൊന്നുമില്ല. എങ്കിലും, അവൾ അത് തന്റെ നോട്ട്ബുക്കിൽ കുറിച്ചുവെച്ചു. ഒപ്പം, രണ്ട് വരികൾ നിറഞ്ഞുനിൽക്കുന്നത്ര വലുപ്പമുള്ള ഒരു ചോദ്യചിഹ്നവും ഇട്ടു.", "പുറത്ത് ഒരു കാക്ക കരയാൻ തുടങ്ങി. ജനാലയ്ക്കപ്പുറം, ഇരുട്ട് മാറി ചാരനിറം പടർന്നുതുടങ്ങിയിരുന്നു.", "***", "കൊച്ചിയിലെ ഒരു അടുക്കളയിൽ നിന്നാണ് രേഷ്മ തോമസ് വീഡിയോ കോളിന് മറുപടി നൽകിയത്. അവരുടെ പിന്നിൽ പ്രഷർ കുക്കർ അതിന്റെ ശബ്ദം പരമാവധി പുറത്ത് വിടുന്നുണ്ടായിരുന്നു. കൗണ്ടറിൽ ഒരു സ്കൂൾ ബാഗും ഇരിക്കുന്നുണ്ട്. നബീലിന്റെ ഫണ്ടിൽ നാല് വർഷത്തോളം 'ഹെഡ് ഓഫ് ഓപ്പറേഷൻസ്' ആയി അവർ പ്രവർത്തിച്ചിട്ടുണ്ട്. ആറ് മാസം മുമ്പാണ് അവർ ദുബായിൽ നിന്ന് മടങ്ങിയത്. തന്റെ പേര് വെളിപ്പെടുത്തില്ലെന്ന് അഞ്ജലി ഉറപ്പുനൽകിയതിന് ശേഷം മാത്രമാണ് നബീലിനെ പറ്റി സംസാരിക്കാൻ അവർ തയ്യാറായത്. എങ്കിലും, ഇടയ്ക്കിടെ അവർ ജനലിലൂടെ പുറത്തേക്ക് നോക്കുന്നുണ്ടായിരുന്നു.", "\"നബീൽ നല്ലൊരു ബോസായിരുന്നു.\" അവൾ പറഞ്ഞു. \"നല്ല സ്ട്രിക്ടായിരുന്നെങ്കിലും, നല്ലൊരു മനുഷ്യൻ. എന്നാൽ കഴിഞ്ഞ ഒരു വര്ഷം അദ്ദേഹം വല്ലാതെ മാറിപ്പോയി.\"", "\"മാറിപ്പോയി എന്ന് പറഞ്ഞാൽ?\" - അഞ്ജലി ചോദിച്ചു.", "\"ഓഫീസിലുള്ളവരോടുള്ള വിശ്വാസം നഷ്ടപ്പെട്ടു. രണ്ടോ മൂന്നോ മാസത്തിനിടെ മൂന്ന് തവണ ഫോൺ മാറ്റി. മീറ്റിംഗുകളൊന്നും ഓഫീസിൽ വച്ച് നടത്താൻ തയ്യാറായിരുന്നില്ല. മിക്കവാറും കാറിലിരുന്നോ അല്ലെങ്കിൽ ഏതെങ്കിലും ഹോട്ടൽ ലോബിയിലിരുന്നോ ഒക്കെയാണ് അറ്റൻഡ് ചെയ്തിരുന്നത്. ക്ലയന്റുകളെ ഓഫീസിലേക്ക് വരുത്താതിരിക്കാൻ ശ്രമിക്കുന്ന പോലെ തോന്നിയിരുന്നു. ആ, പിന്നെ എന്നോട് കമ്പനി സെർവറിൽ ഉണ്ടായിരുന്ന പല ഡാറ്റകളും അദ്ദേഹം സ്വന്തമായി സൂക്ഷിച്ചിരുന്ന ഡ്രൈവിലേക്ക് മാറ്റിക്കൊടുക്കാൻ പറഞ്ഞു. ഞാൻ അപ്പോൾ കരുതിയത് അദ്ദേഹത്തിന് മറ്റാരുമായോ ബന്ധമുണ്ടെന്നായിരുന്നു. സത്യം പറഞ്ഞാൽ അങ്ങനെത്തന്നെയായിരുന്നു തോന്നിയിരുന്നതും\" - അതവർ മടിച്ചാണ് പറഞ്ഞത്.", "അഞ്ജലി എല്ലാം കേട്ടിരുന്നു - \"അതങ്ങനെ അല്ലായിരുന്നോ?\"", "\"അല്ല\". കുക്കർ വീണ്ടും വിസിൽ മുഴക്കി. രേഷ്മ എഴുന്നേറ്റു പോയി സ്റ്റവ് ഓഫ് ചെയ്തു. അടുക്കളയിൽ നിശബ്ദത പടർന്നു. തിരികെ നടന്നു വരുമ്പോൾ അവർ തുടർന്നു.", "\"ഒരിക്കൽ അദ്ദേഹത്തോടൊപ്പം, ഒരു വൈകുന്നേരം - ആ സമയത്ത് എനിക്ക് ഈ സ്വഭാവമാറ്റം കൊണ്ട് മടുപ്പ് തോന്നിയിരുന്നു - ഞാനന്ന്, സാർ എന്തെങ്കിലും കുഴപ്പത്തിൽ പെട്ടിട്ടുണ്ടോ എന്ന് അദ്ദേഹത്തോട് ചോദിച്ചു. ഒന്ന് ചിരിച്ച് വിചിത്രമായ എന്തോ ഒന്ന് പറഞ്ഞു. 'രേഷ്മാ, അപരിചിതരിൽ നിന്നല്ല അപകടം വരുന്നത്. നിന്റെ സാമ്പത്തിക ഇടപാടുകളെക്കുറിച്ച് അറിയാവുന്ന ഒരാളിൽ നിന്നാണ് അത് വരുന്നത്.’”", "അഞ്ജലി രേഷ്മ പറയുന്നതെല്ലാം തന്റെ നോട്ട്ബുക്കിൽ രേഖപ്പെടുത്തുന്നുണ്ടായിരുന്നു.", "\"ആരെ കുറിച്ചാണ് നബീൽ ഉദ്ദേശിച്ചതെന്ന് രേഷ്മയ്ക്കറിയാമോ?”", "\"എനിക്കൊരു സംശയം മാത്രമേ ഉള്ളൂ.\" രേഷ്‌മ വീണ്ടും ജനലിലൂടെ പുറത്തേക്ക് നോക്കി.", "\"ഞാനഗ്നളുടെ അകൗണ്ടുകളുടെ മുഴുവൻ ഡീറ്റൈൽസും അറിയുന്ന ഒരാളെ ഉള്ളൂ. അയാളുടെ പേര് ഈ കോളിലൂടെ ഞാൻ പറയുന്നില്ല. നിങ്ങൾക്കത് നേരത്തെ തന്നെ അറിയാം. അല്ലെങ്കിൽ പിന്നെ നിങ്ങൾ എന്നെ വിളിക്കില്ലല്ലോ.\"", "അഞ്ജലി നിര്ബന്ധിച്ചില്ല. “എപ്പോഴാണ് അത് തുടങ്ങിയത്? ആ ഭയം.”", "രേഷ്മ ഒന്നാലോചിച്ചു. “ഞാൻ ജോലി റിസൈൻ ചെയ്യുന്നതിന് ഏകദേശം രണ്ടുമാസം മുമ്പ്. ഒരു കത്ത് വന്നു. പോസ്റ്റലിലാണ് വന്നത് - ഇക്കാലത്ത് ആരും അങ്ങനെയൊന്ന് അയക്കാറില്ലല്ലോ. അത് അദ്ദേഹത്തിന്റെ പേരിൽ നേരിട്ട് ഓഫീസിലേക്കാണ് വന്നത്. എനിക്കത് നന്നായി ഓർമ്മയുണ്ട്. കാരണം, അത് പോസ്റ്റ് ബോക്സിൽ നിന്ന് കളക്ട് ചെയ്ത് ഞങ്ങളുടെ സ്റ്റാഫ് എന്റെ കയ്യിലാണ് തന്നത്, മാത്രമല്ല അതിലെ സ്റ്റാമ്പുകളും ഞാനന്ന് ശ്രദ്ധിച്ചിരുന്നു. കാരണം അത്രയും കാലത്തിനിടെ ഒരു ഫിസിക്കൽ ലെറ്റർ പോസ്റ്റിൽ വന്നത് കാണുകയാണല്ലോ.\"", "“സ്റ്റാമ്പുകളോ?”- അഞ്ജലി അത്ഭുതപ്പെട്ടു.", "“അതെ, ഇന്ത്യൻ സ്റ്റാമ്പുകൾ. ബാംഗ്ലൂരിൽ നിന്നായിരുന്നു അത് അയച്ചത്. ആ സീൽ ഞാൻ ശ്രദ്ധിച്ചിട്ടുണ്ടായിരുന്നു.”", "അഞ്ജലി തന്റെ മുഖഭാവം ഒട്ടും മാറാതെ നിർത്തി. “അതിനകത്ത് എന്താണെന്ന് നിങ്ങൾ കണ്ടിരുന്നോ?”", "“ഇല്ല. നബീൽ ക്യാബിനിൽ വെച്ച് അത് തുറന്നു, എന്നോട് പുറത്ത് പൊയ്ക്കൊള്ളാൻ പറഞ്ഞു. എന്നിട്ട് വാതിലടച്ചു. പുറത്തിറങ്ങി വന്നപ്പോൾ അദ്ദേഹത്തെ കണ്ടാൽ...” അവൾ കൃത്യമായ വാക്കിനായി ആലോചിച്ചു. “താനൊരിക്കലും അറിഞ്ഞിട്ടില്ലാത്ത, എന്നാൽ തന്റേതുതന്നെയുള്ള ഒരു ഫോട്ടോ പെട്ടെന്ന് കയ്യിൽ കിട്ടിയ ഒരാളെപ്പോലെയായിരുന്നു അദ്ദേഹത്തിന്റെ ഭാവം.”", "***", "കുക്ക് ടൗണിലെ ആ വീട് ചെറുതും വളരെ വൃത്തിയുള്ളതുമായിരുന്നു. വാതിലിനരികിൽ ചുവരിലെ ഒരു ചെറിയ അറയിൽ കന്യാമറിയത്തിന്റെ പ്ലാസ്റ്റർ രൂപമുണ്ട്. ചുവരിൽ ഒരു പഴയ ചാവി കൊടുത്താൽ പ്രവർത്തിക്കുന്ന ഒരു വലിയ ഓട്ടോമാറ്റിക് ക്ളോക്കും കാണാം. അതിന്റെ ഓരോ മണിക്കൂറും ഇടവിട്ടുള്ള മണി മുഴക്കം ഗേറ്റിൽ നിന്നാലും കേൾക്കാവുന്ന അത്ര ഉച്ചത്തിലായിരുന്നു.", "വർഗീസ് അങ്കിൾ തന്നെയാണ് വാതിൽ തുറന്നത്. എഴുപത്തിയെട്ട് വയസ്സുകാരനായ അദ്ദേഹത്തിന്, ഒരു ബന്ധുവിന്റെ വിവാഹത്തിന് അഞ്ജലി അവസാനമായി കണ്ടപ്പോഴുള്ളതിനേക്കാൾ ശാരീരികമായി ഒരു ക്ഷീണം തോന്നിയിരുന്നു. എങ്കിലും, അദ്ദേഹം വന്ന് ഷേക്ക് ഹാൻഡ് തന്നപ്പോൾ ആ ക്ഷീണം ആ കൈകൾക് വന്നിട്ടില്ലെന്ന് അവൾക് മനസിലായി. കട്ടിയുള്ള കണ്ണടയ്ക്കുള്ളിലെ അദ്ദേഹത്തിന്റെ കണ്ണുകൾ ഇപ്പോഴും സൂക്ഷ്മതകൾ അന്വേഷിക്കുന്നുണ്ടെന്ന് തന്റെ കയ്യിലെ പുസ്തകത്തെ കുറിച്ച് ചോദിച്ചപ്പോൾ അവൾ തിരിച്ചറിഞ്ഞു. ബാംഗ്ലൂരിലായിരുന്നപ്പോൾ അവളുടെ അച്ഛന്റെ ഏറ്റവും അടുത്ത സുഹൃത്തായിരുന്നു അദ്ദേഹം. തൃശൂർ സ്വദേശി, 1975-ൽ ബാങ്ക് ജോലിക്കായി ബാംഗ്ലൂരിൽ എത്തിയതാണ്, പിന്നീട് ഒരിക്കലും നാട്ടിലേക്ക് മടങ്ങിപ്പോയില്ല. ആ വിവാദമുണ്ടായപ്പോൾ, സുഹൃത്തുക്കളിൽ പകുതിപ്പേരും ബന്ധം വിച്ഛേദിച്ചപ്പോഴും, എല്ലാ ഞായറാഴ്ചയും മുടങ്ങാതെ വീട്ടിൽ വന്നിരുന്ന ചുരുക്കം ചിലരിൽ ഒരാളായിരുന്നു അദ്ദേഹം.", "അവർ അകത്തേക്ക് കയറി ഹാളിലെ സോഫയിലിരുന്ന് പഴയ കാര്യങ്ങളെ കുറിച്ച് സംസാരിച്ച് കൊണ്ടിരുന്നപ്പോൾ അദ്ദേഹത്തിന്റെ ഭാര്യ ചായയും ബിസ്ക്കറ്റും കൊണ്ടുവന്നു. അവരുടെ സംസാരത്തിനിടയിൽ അവളെ നോക്കി ഒന്ന് പുഞ്ചിരിച്ചുകൊണ്ട് അവർ അടുക്കളയിലേക്ക് തന്നെ മടങ്ങി.", "ക്ളോക്ക് അതിന്റെ മണിക്കൂറിന്റെ ഒച്ചയുണ്ടാക്കി കഴിഞ്ഞപ്പോൾ വർഗീസ് ചോദിച്ചു.", "\"നിങ്ങൾ വീട് ഒഴിഞ്ഞുകൊടുക്കുകയാണല്ലേ?\"", "\"അതെ, അമ്മയ്ക്ക് അത് വിളിക്കണമെന്ന് പറഞ്ഞു. ഒരു മാസത്തിനുള്ളിൽ രജിസ്‌ട്രേഷൻ ഉണ്ടാവും.\"", "അയാൾ തലയാട്ടുക മാത്രം ചെയ്തു.", "അഞ്ജലി പത്തിന്റെ താൻ അന്വേഷിച്ച് വന്ന വിഷയങ്ങളെ കുറിച്ച് വർഗീസുമായി സംസാരിച്ചെങ്കിലും പലതും മറച്ചു വച്ചു. അവൾ അയാളോട് അച്ഛന്റെ ഡയറിയെ കുറിച്ച് മാത്രമേ സംസാരിച്ചുള്ളൂ. അവൾക് വന്ന വാട്സാപ്പ് മെസേജുകൾ കുറിച്ചോ, ബേക്കറിയിൽ വച്ച് കണ്ട ആളെ കുറിച്ചോ, ദുബായിയിലെ വിഷയത്തെ കുറിച്ചോ ഒന്നും അയാളോട് പറഞ്ഞില്ല. ഇൻവോയ്‌സുകളിലുണ്ടായ പ്രശ്‌നങ്ങളെക്കുറിച്ചും, ആർ.പി. എന്ന് പേരുള്ള ഒരാളെക്കുറിച്ചും അവളുടെ അച്ഛൻ എഴുതിവെച്ചിരുന്നെന്നും, സെപ്റ്റംബറിന് ശേഷം അതിലെ കുറിപ്പുകൾ നിലച്ചുപോയെന്നും മാത്രമേ അവൾ അയാളോട് പറഞ്ഞുള്ളൂ.", "കാലിൽ കാൽ കയറ്റി വച്ച് ആ കാൽമുട്ടിൽ തന്റെ കൈകൾ വെച്ച് വർഗീസ് അതെല്ലാം കേട്ടിരുന്നു. അവൾ 'ആർ.പി' എന്ന പേര് പറഞ്ഞപ്പോൾ അതുവരെ കാലാട്ടിയിരുന്ന വർഗീസിന്റെ കാലുകളുടെ ചലനം നിലച്ചു. ഡയറിയിൽ അതിന് ശേഷം പിന്നെ ഒന്നും എഴുതിയിട്ടില്ല എന്ന പറഞ്ഞപ്പോൾ അയാൾ ക്ളോക്കിലേക്ക് നോക്കി.", "\"ഇതിനെ കുറിച്ച് എന്തെങ്കിലും അച്ഛൻ അങ്കിളിനോട് സംസാരിച്ചിരുന്നു?\" - അവൾ ചോദിച്ചു.", "\"അവൻ എന്നോട് പല കാര്യങ്ങളെ കുറിച്ചും സംസാരിച്ചിട്ടുണ്ട്.\"", "\"കാവേരിയെ കുറിച്ച്?\"", "\"അവൻ ആ സമയം അസ്വസ്ഥനായിരുന്നു. അവൻ അസ്വസ്ഥനാണെന്ന് അവനെ കണ്ടാൽ ആർക്കും തോന്നുമായിരുന്നു.\" - അയാൾ തന്റെ ചായ എടുത്ത് സാവധാനം കുടിച്ചു.", "\"അങ്കിൾ, അച്ഛൻ എന്തെങ്കിലും സൂക്ഷിച്ച് വെക്കാൻ തന്നിട്ടുണ്ടോ? രേഖകളോ അല്ലെങ്കിൽ അങ്ങനെ മറ്റെന്തെങ്കിലും?\"", "അത് അവളുടെ ഒരു തോന്നൽ മാത്രമായിരുന്നു. നിശ്ശബ്ദതയിലേക് എറിഞ്ഞു കൊടുത്ത ഒരു ജേണലിസ്റ്റിന്റെ ചെറിയൊരു കൗശലം അതിലുണ്ടായിരുന്നു. എന്താണ് തിരിച്ചു കിട്ടുക എന്നറിയാനുള്ള അവളുടെ ഒരു ശ്രമം.", "വർഗീസ് തന്റെ കയ്യിലെ ചായകപ്പ് താഴെ വച്ചു. അയാളുടെ വലതു കൈ ഏതാണ്ട് അശ്രദ്ധമായിട്ടെന്നപോലെ, ഷർട്ടിന്റെ മുൻഭാഗത്തേക്ക് ഉയർന്നു. കോട്ടൺ തുണിക്കടിയിൽ, ഒരു നൂലിൽ കോർത്ത, ചെറുതും കടുപ്പമുള്ളതുമായ എന്തോ ഒന്നിനു മുകളിലായി ആ കൈ നിലയുറപ്പിച്ചു. അഞ്ജലി തന്റെ ചലനങ്ങൾ ശ്രദ്ധിക്കുന്നുണ്ടെന്ന് മനസ്സിലാക്കിയപ്പോൾ ഉടനെ തന്നെ അയാൾ തന്റെ കൈകൾ പഴയ സ്ഥാനത്ത് തന്നെ കൊണ്ടു വച്ചു .", "\"നീ അമ്മയോട് ചോദിക്കൂ\" - അയാൾ അവൾക് മറുപടി നൽകി.", "\"ഞാൻ അന്കിളിനോടല്ലേ ചോദിച്ചത്?\"", "\"അതിന്റെ മറുപടിയാണ് ഞാൻ പറഞ്ഞത്, നീ നിന്റെ അമ്മയോട് ചോദിക്കൂ\" - അയാൾ വളരെ സ്നേഹത്തോടെയാണത് പറഞ്ഞത്. അവൾക് ഒമ്പത് വയസ്സുള്ളപ്പോൾ ചോക്ളേടോന്നും അധികം കഴിക്കാൻ പാടില്ലെന്ന് പറഞ്ഞ അതെ ശൈലിയിൽ.", "\"ചില വാഗ്ദാനങ്ങൾ ലംഘിക്കാൻ എനിക്ക് അധികാരമില്ല, കുഞ്ഞേ\"", "ആ കനത്ത നിശബ്ദതയിൽ ക്ളോക്കിലെ സെക്കന്റ് സൂചിയുടെ ചലനശബ്ദം മാത്രം കേട്ടുകൊണ്ടിരുന്നു. കൂടെ അടുക്കളയിൽ ഒരു ടാപ്പ് തുറന്നതും പിന്നെ അടഞ്ഞതും കേട്ടു.", "അഞ്ജലി പിന്നെ നിര്ബന്ധിച്ചില്ല. ഒരു രഹസ്യം സൂക്ഷിക്കാൻ തീരുമാനിച്ചവർ, അവരുടെ സ്വീകരണമുറിയിൽ നമുക്ക് എത്ര നേരം ഇരിക്കാൻ കഴിയുമോ, അതിലും കൂടുതൽ കാലം ആ രഹസ്യം കാത്തുസൂക്ഷിക്കുമെന്ന് അവൾ പണ്ടേ മനസ്സിലാക്കിയിരുന്നു. അവൾ മറ്റൊന്നും മിണ്ടാതെ ചായ മുഴുവൻ കുറിച്ച് തീർത്തു. ഇറങ്ങുമ്പോൾ അയാളെ കെട്ടിപിടിച്ചു യാത്ര പറഞ്ഞു.", "അഞ്ജലി പോയതിന് ശേഷം, അതേയിടത്തിൽ വർഗീസ് ഏറെ നേരമായി ഇരിക്കുകയാണ്. രണ്ട് ചായ കപ്പുകൾ, തൊടാതെ വച്ചിരിക്കുന്ന ബിസ്കറ്റുകൾ അയാൾക്കൊപ്പമിരിപ്പുണ്ട്. അയാൾ പതിയെ തന്റെ ഷർട്ടിനുള്ളിൽ നിന്നും കഴുത്തിലിട്ടിരിക്കുന്ന ആ ചരടുകൊണ്ടുള്ള മാല പുറത്തേക്കിട്ടു. അതിൽ ചെറിയൊരു പിച്ചളയുടെ താക്കോൽ കോർത്തിട്ടിരുന്നു. തേയ്മാനം വന്ന മിനുസപ്പെട്ട ഒരു താക്കോൽ. അയാൾ അത് തന്റെ കയ്യിൽ പിടിച്ചപ്പോൾ അതിന് യാഥർത്ഥത്തിൽ ഉള്ളതിനേക്കാൾ ഭാരമുണ്ടെന്ന് തോന്നി. അയാളുടെ ഭാര്യ അടുക്കളയുടെ വാതിലിൽ വന്ന അയാളെ നോക്കിയെങ്കിലും ഒന്നും പറഞ്ഞില്ല. അയാൾ ആ മാല വീണ്ടും തന്റെ ഷർട്ടിനുള്ളിലേക്ക് തന്നെ തിരികെയിട്ടു.", "***", "അന്ന് വൈകുന്നേരം, ഷേണായിയുടെ ക്യാബിനിൽ അഞ്ജലി തന്റെ ലാപ്ടോപ്പും നോട്ട്ബുക്കുമായി കടന്നുചെന്നു. അവൾ എല്ലാം വിശദമായി അയാൾക് മുന്നിൽ വിവരിച്ചു. നബീലിനെ കുറിച്ചും, ആ ഫോട്ടോകളെ കുറിച്ചും, ആദ്യം കയ്യടിച്ച ആളെ കുറിച്ചും, രേഷ്മ പറഞ്ഞ കത്തിനെ കുറിച്ചുമെല്ലാം ഒന്നും വിടാതെ അവൾ അയാളോട് പറഞ്ഞു.", "അവൾ പറഞ്ഞ് നിർത്തിയപ്പോൾ ഷേണായി പറഞ്ഞു. \"ദേവ് വർമ്മ.. ഒരു ഇന്ററസ്റ്റിംഗ് കാരക്ടർ ആണല്ലോ. അഞ്ജലി, നിങ്ങൾക്കിനി ഉറപ്പായും ഈ വിഷയവുമായി മുന്നോട്ട് പോവാം. പിന്നെ, ദുബായിൽ നിന്ന് തന്നെ ഇത് തുടങ്ങുന്നതാണ് നല്ലത്.\"", "\"സാർ, ഇന്ത്യൻ പൗരന്മാർ ഉൾപ്പെടെ ഇരുപതിലധികം അറസ്റ്റുകൾ അവിടെ നടന്നിട്ടുണ്ട്. ആ ഗ്രൂപ്പ് ലക്ഷ്യമിട്ടത് ഇന്ത്യകകാരനായ ഒരു ബിസിനസ് ടൈഗൂണിനെ. എന്റെ അച്ഛന്റെ കേസുമായി ഇതിന് എന്തെങ്കിലും ബന്ധമുണ്ടോ ഇല്ലയോ എന്നൊന്നും എനിക്കറിയില്ല. എന്തായാലും ഈ കേസിന് ഇന്ത്യയുമായി എന്തോ ഒരു ബന്ധമുണ്ട്. അതൊരു വലിയ ന്യൂസ് വാൽയു ഉള്ള ഒന്നാണ്.\" -അഞ്ജലി പറഞ്ഞു.", "\"അതെ, അതൊരു ഇന്ററസ്റ്റിംഗ് സ്റ്റോറി ആയി നീ കറാഫ്റ് ചെയ്യണം.\"", "\"തീർച്ചയായും\"", "അയാൾ ഒരു നിമിഷം അവളെ നോക്കി. അയാൾ ആ വിഷയവുമായി മുന്നോട്ട് പോവാൻ സമ്മതിച്ചതിലുള്ള സന്തോഷം അവളുടെ മുഖത്തുണ്ടായിരുന്നു. ഷേണായി തന്റെ ഫോണെടുത്ത് ട്രാവൽ ഡിസ്കിന്റെ നമ്പറെടുത്ത് മേശയ്ക് കുറുകെ അവൾക് നേരെ നീട്ടി.", "\"അഞ്ച് ദിവസം\" - അയാൾ പറഞ്ഞു.", "\"ഇന്ത്യൻ വേർഷൻ മാത്രം. അമ്മായിയുടെ അടുത്ത് നിന്നോ അല്ലെങ്കിൽ മറ്റേതെങ്കിലും വിശ്വസനീയമായ സോഴ്സിൽ നിന്നോ വിവരം ലഭിക്കുന്നത് വരെ കാവേരിയെ കുറിച്ച് ഒന്നും അച്ചടിച്ച് വരരുത്. പിന്നെ, അഞ്ജലീ...\"", "അയാൾ പറയാൻ പോവുന്നതിനായി അഞ്ജലി കാത്ത് നിന്നു.", "\"നീ പോവുന്ന സ്ഥലത്തെ നിയമങ്ങളെ കുറിച്ച് ഞാൻ പറയാതെ തന്നെ അറിയാമല്ലോ. എന്തെങ്കിലും ചെറിയൊരു പിഴവ് മതി ഒരു ഇൻവെൻസ്റ്റിഗേഷന് ഓഫീസിലെത്താൻ. അതോർമ്മ വേണം.\"", "അവൾ അയാളുടെ കയ്യിൽ നിന്നും ഫോൺ വാങ്ങി.", "ഷേണായിയോട് നന്ദി പറഞ്ഞ് പുറത്തേക്ക് വരുന്ന വഴി അവൾ ഫോണെടുത്ത് രോഹൻ ബേക്കറിയിൽ നിന്നും എടുത്ത ഫോട്ടോയിലേക്ക് അവൾ നോക്കി. ഇളം നീല ഷർട്ടിട്ട ആ മനുഷ്യൻ.", "നിങ്ങളുടെ അച്ഛൻ വീട്ടിൽ എന്തെങ്കിലും സൂക്ഷിച്ചിരുന്നോ? ഒന്നും സൂക്ഷിച്ചിരുന്നില്ല എന്ന അവൾ പറഞ്ഞത് സത്യമായിരുന്നു. എന്നാൽ അയാൾ ചോദിച്ചത് തെറ്റായ ചോദ്യമാണെന്നും, വൈകാതെ അയാൾ ശരിയായ ചോദ്യം കണ്ടെത്തുമെന്നും അവൾക്കപ്പോൾ മനസ്സിലായി.", "എന്താണ് സൂക്ഷിച്ചിരുന്നത് എന്നല്ല, ആർക്കാണ് അത് നൽകിയത് എന്നാതാണ് ആ ചോദ്യം."], "isNew": false}]}</script>
<script>
(function(){
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book-data").textContent);
  var CH = BOOK.chapters;
  var SIZES = [15,16,17,18,20,22,24];
  var $ = function(id){return document.getElementById(id);};
  var root = document.documentElement;

  /* ---- storage (per-reader, may be unavailable) ---- */
  function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

  var prefs = load("prefs") || {};
  var sizeIdx = typeof prefs.size==="number" ? Math.max(0,Math.min(SIZES.length-1,prefs.size)) : 3;
  if(prefs.theme) root.setAttribute("data-theme",prefs.theme);

  var state = {ch:0,page:0,pages:1,P:0};
  var saved = load("pos");

  /* ---- cover ---- */
  document.title = BOOK.title;
  $("cv-title").textContent = BOOK.title;
  $("cv-author").textContent = BOOK.author;
  $("cv-tag").textContent = BOOK.tagline;
  $("cv-foot").textContent = BOOK.updatedLabel;
  $("b-home").textContent = BOOK.title;
  if(saved && CH[saved.ch]){
    $("cv-start").textContent = "തുടർന്ന് വായിക്കാം: അദ്ധ്യായം " + (saved.ch+1);
  }

  /* ---- weights for overall progress ---- */
  var weights = CH.map(function(c){return c.paras.join("").length;});
  var total = weights.reduce(function(a,b){return a+b;},0);

  /* ---- build TOC ---- */
  $("toc-sub").textContent = CH.length + " അദ്ധ്യായങ്ങൾ. " + BOOK.updatedLabel;
  function buildToc(){
    var ul = $("toc"); ul.innerHTML = "";
    CH.forEach(function(c,i){
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.innerHTML = '<span class="t"></span>';
      var named = c.title && c.title!==c.label;
      b.querySelector(".t").textContent = named ? (c.label+": "+c.title) : c.label;
      if(c.isNew){var s=document.createElement("span");s.className="new";s.textContent="പുതിയത്";b.appendChild(s);}
      if(i===state.ch && $("reader").classList.contains("on")){var cur=document.createElement("span");cur.className="cur";cur.textContent="ഇപ്പോൾ വായിക്കുന്നത്";b.appendChild(cur);}
      b.addEventListener("click",function(){closeSheets();openChapter(i,0);});
      li.appendChild(b); ul.appendChild(li);
    });
    if(BOOK.moreComing){
      var li = document.createElement("li"); li.className="soon";
      li.innerHTML = '<span>അദ്ധ്യായം '+(CH.length+1)+' ഉടൻ…</span>';
      ul.appendChild(li);
    }
  }

  /* ---- render one chapter into the flow ---- */
  var flow = $("flow"), pagesEl = $("pages");
  function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function render(i){
    var c = CH[i], h = [];
    var named = c.title && c.title!==c.label;
    h.push('<div class="chap-head">'+(named?'<span class="num">'+esc(c.label)+'</span>':'')+'<h2>'+esc(named?c.title:c.label)+'</h2></div>');
    c.paras.forEach(function(p){
      if(p==="***") h.push('<p class="scene" aria-hidden="true">✶ ✶ ✶</p>');
      else h.push('<p>'+esc(p)+'</p>');
    });
    if(i===CH.length-1 && BOOK.moreComing){
      h.push('<div class="endnote"><p class="mark">✶</p><h3>തുടരും…</h3><p>അദ്ധ്യായം '+(CH.length+1)+' ഉടൻ വരുന്നു. ഇതേ ലിങ്കിൽ തന്നെ പുതിയ അദ്ധ്യായങ്ങൾ ചേർക്കും.</p><p><button class="btn" data-act="toc">ഉള്ളടക്കം</button></p></div>');
    }
    h.push('<span id="sentinel"></span>');
    flow.innerHTML = h.join("");
    var t = flow.querySelector('[data-act="toc"]');
    if(t) t.addEventListener("click",function(e){e.stopPropagation();openSheet("s-toc");});
  }

  /* ---- pagination with CSS columns ---- */
  function layout(){
    var P = pagesEl.clientWidth;
    var m = P < 520 ? 22 : 46;
    state.P = P;
    root.style.setProperty("--fs",SIZES[sizeIdx]+"px");
    flow.style.left = m+"px";
    flow.style.width = (P-2*m)+"px";
    flow.style.columnWidth = (P-2*m)+"px";
    flow.style.columnGap = (2*m)+"px";
    var s = $("sentinel");
    var off = s.getBoundingClientRect().left - flow.getBoundingClientRect().left + flow.scrollLeft;
    state.pages = Math.max(1, Math.floor((off + 1) / P) + 1);
  }
  function measure(){
    flow.classList.remove("anim");
    flow.style.transform = "translateX(0)";
    layout();
  }
  function show(anim){
    if(anim) flow.classList.add("anim"); else flow.classList.remove("anim");
    flow.style.transform = "translateX("+(-state.page*state.P)+"px)";
    $("f-chap").textContent = CH[state.ch].label;
    $("f-page").textContent = "പേജ് " + (state.page+1) + " / " + state.pages;
    var before = 0; for(var k=0;k<state.ch;k++) before += weights[k];
    var pct = (before + weights[state.ch]*((state.page+1)/state.pages)) / total * 100;
    $("prog").style.width = Math.min(100,pct).toFixed(1)+"%";
    save("pos",{ch:state.ch,frac:state.pages>1?state.page/(state.pages-1):0});
  }

  function openChapter(i,where){
    showView("reader");
    state.ch = i; render(i); state.page = 0; measure();
    if(where==="end") state.page = state.pages-1;
    else if(typeof where==="number") state.page = Math.round(where*(state.pages-1));
    show(false);
    buildToc();
  }
  function next(){
    if(state.page < state.pages-1){state.page++; show(true);}
    else if(state.ch < CH.length-1){openChapter(state.ch+1,0);}
  }
  function prev(){
    if(state.page > 0){state.page--; show(true);}
    else if(state.ch > 0){openChapter(state.ch-1,"end");}
  }
  function relayout(){
    if(!$("reader").classList.contains("on")) return;
    var frac = state.pages>1 ? state.page/(state.pages-1) : 0;
    measure();
    state.page = Math.min(state.pages-1, Math.round(frac*(state.pages-1)));
    show(false);
  }

  /* ---- views and sheets ---- */
  function showView(id){
    ["cover","reader"].forEach(function(v){$(v).classList.toggle("on",v===id);});
  }
  var lastFocus = null;
  function openSheet(id){
    lastFocus = document.activeElement;
    if(id==="s-toc") buildToc();
    $("scrim").classList.add("on"); $(id).classList.add("on");
    var f = $(id).querySelector("button"); if(f) f.focus();
  }
  function closeSheets(){
    $("scrim").classList.remove("on");
    ["s-toc","s-set"].forEach(function(s){$(s).classList.remove("on");});
    if(lastFocus && lastFocus.focus) try{lastFocus.focus();}catch(e){}
  }
  $("scrim").addEventListener("click",closeSheets);
  $("b-toc").addEventListener("click",function(){openSheet("s-toc");});
  $("cv-toc").addEventListener("click",function(){openSheet("s-toc");});
  $("b-set").addEventListener("click",function(){openSheet("s-set");});
  $("b-home").addEventListener("click",function(){
    showView("cover");
    $("cv-start").textContent = "തുടർന്ന് വായിക്കാം: അദ്ധ്യായം " + (state.ch+1);
    saved = {ch:state.ch, frac: state.pages>1?state.page/(state.pages-1):0};
  });
  $("cv-start").addEventListener("click",function(){
    if(saved && CH[saved.ch]) openChapter(saved.ch, saved.frac||0); else openChapter(0,0);
  });

  /* ---- settings ---- */
  function syncThemeButtons(){
    var t = root.getAttribute("data-theme");
    if(!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    Array.prototype.forEach.call(document.querySelectorAll("#themes button"),function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-t")===t));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#themes button"),function(b){
    b.addEventListener("click",function(){
      var t = b.getAttribute("data-t");
      root.setAttribute("data-theme",t); prefs.theme=t; save("prefs",prefs); syncThemeButtons();
    });
  });
  function setSize(d){
    sizeIdx = Math.max(0,Math.min(SIZES.length-1,sizeIdx+d));
    prefs.size = sizeIdx; save("prefs",prefs);
    root.style.setProperty("--fs",SIZES[sizeIdx]+"px");
    relayout();
  }
  $("fs-down").addEventListener("click",function(){setSize(-1);});
  $("fs-up").addEventListener("click",function(){setSize(1);});
  root.style.setProperty("--fs",SIZES[sizeIdx]+"px");
  syncThemeButtons();

  /* ---- gestures: swipe, tap zones ---- */
  var sx=0, sy=0, st=0, down=false;
  pagesEl.addEventListener("pointerdown",function(e){
    if(e.button && e.button!==0) return;
    down=true; sx=e.clientX; sy=e.clientY; st=Date.now();
  });
  pagesEl.addEventListener("pointerup",function(e){
    if(!down) return; down=false;
    if(e.target.closest && e.target.closest("button")) return;
    var sel = window.getSelection && String(window.getSelection());
    if(sel && sel.length) return;
    var dx = e.clientX-sx, dy = e.clientY-sy;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){ if(dx<0) next(); else prev(); return; }
    if(Date.now()-st > 500 || Math.abs(dx) > 10 || Math.abs(dy) > 10) return;
    var r = pagesEl.getBoundingClientRect(), x = (e.clientX - r.left)/r.width;
    if(x < 0.3) prev(); else if(x > 0.7) next();
  });
  pagesEl.addEventListener("pointercancel",function(){down=false;});

  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"){closeSheets();return;}
    if(!$("reader").classList.contains("on")) return;
    if($("scrim").classList.contains("on")) return;
    if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();next();}
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev();}
  });

  var rt; window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(relayout,150);});

  /* ---- deep links: #ch1 … #chN ---- */
  function fromHash(){
    var m = /^#ch(\d+)$/.exec(location.hash||"");
    if(m){var i=parseInt(m[1],10)-1; if(CH[i]){openChapter(i,0);return true;}}
    return false;
  }
  window.addEventListener("hashchange",fromHash);
  buildToc();
  var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
  fromHash();
  ready.then(function(){ relayout(); });
})();
</script>
</body>
