<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>പേരിടാത്ത നോവൽ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Malayalam:wght@400;600;700&family=Gayathri:wght@400;700&family=Chilanka&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDEFEC; --ink:#1D2327; --muted:#5E676C; --rule:#C9CFCF;
  --accent:#23477A; --margin:#B5473A; --sheet:#F7F8F6; --shade:rgba(20,26,30,.38);
  --body:"Noto Serif Malayalam","Kartika","Nirmala UI","Noto Sans Malayalam",serif;
  --ui:"Gayathri","Noto Sans Malayalam","Nirmala UI","Kartika",sans-serif;
  --hand:"Chilanka","Gayathri","Kartika",cursive;
  --fs:18px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="sepia"]){
    --paper:#121619; --ink:#C9CFD2; --muted:#85909A; --rule:#2A3136;
    --accent:#8EA8CF; --margin:#B8645A; --sheet:#1A1F23; --shade:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121619; --ink:#C9CFD2; --muted:#85909A; --rule:#2A3136;
  --accent:#8EA8CF; --margin:#B8645A; --sheet:#1A1F23; --shade:rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-theme="sepia"]{
  --paper:#EFE3CC; --ink:#34281C; --muted:#75644F; --rule:#D8C7A6;
  --accent:#6E4A22; --margin:#A4503A; --sheet:#F6ECD9; --shade:rgba(52,40,28,.35);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.view{height:100%;display:none}
.view.on{display:flex;flex-direction:column}

/* ---------- Cover: a ledger page ---------- */
#cover{overflow-y:auto;align-items:center;justify-content:center;padding:24px 18px}
.ledger{
  position:relative;width:100%;max-width:520px;min-height:min(640px,100%);
  background:
    linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 47px,transparent 47px,transparent 51px,var(--margin) 51px,var(--margin) 52px,transparent 52px),
    repeating-linear-gradient(180deg,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);
  background-position:0 0,0 18px;
  padding:72px 28px 40px 76px;display:flex;flex-direction:column;
}
.ledger .tag{font-size:15px;color:var(--muted);line-height:36px;margin:0}
.ledger h1{font-family:var(--body);font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1.25;margin:36px 0 10px;color:var(--ink);letter-spacing:-.01em}
.sig{position:relative;margin:8px 0 0;font-family:var(--hand);font-size:28px;color:var(--accent);line-height:72px;overflow:hidden}
.sig::after{content:"";position:absolute;left:0;right:-28px;bottom:16px;height:1.5px;background:var(--accent);opacity:.55}
.cover-actions{margin-top:auto;padding-top:48px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.btn{font-family:var(--ui);font-size:19px;font-weight:700;padding:12px 22px 9px;border-radius:999px;background:var(--accent);color:var(--paper)}
.btn.ghost{background:none;color:var(--accent);padding-left:0;font-weight:400;text-decoration:underline;text-underline-offset:5px}
.cover-foot{margin-top:28px;font-size:14px;color:var(--muted);line-height:1.6}

/* ---------- Reader ---------- */
#reader{max-width:760px;margin:0 auto;width:100%}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;min-height:48px;flex:none}
.bar .ttl{flex:1;text-align:center;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px}
.icon{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--muted);font-size:18px}
.icon:hover{color:var(--ink)}
.icon svg{width:22px;height:22px}
#pages{position:relative;flex:1;overflow:hidden;touch-action:pan-y pinch-zoom;-webkit-user-select:text;user-select:text}
#flow{
  position:absolute;top:8px;bottom:12px;
  font-family:var(--body);font-size:var(--fs);line-height:1.9;color:var(--ink);
  column-fill:auto;orphans:2;widows:2;
  will-change:transform;
}
#flow.anim{transition:transform .32s cubic-bezier(.25,.8,.3,1)}
@media (prefers-reduced-motion:reduce){#flow.anim{transition:none}}
#flow p{margin:0 0 .3em;text-indent:1.4em;text-align:left;overflow-wrap:break-word}
#flow .chap-head + p, #flow .scene + p{text-indent:0}
.chap-head{break-inside:avoid;padding:8vh 0 1.4em;margin:0}
.chap-head .num{display:block;font-family:var(--ui);font-size:15px;color:var(--muted);margin-bottom:.4em}
.chap-head h2{font-family:var(--body);font-weight:700;font-size:1.9em;line-height:1.35;margin:0;color:var(--accent)}
.chap-head::after{content:"";display:block;width:56px;height:1.5px;background:var(--accent);opacity:.6;margin-top:1em}
.scene{text-align:center;color:var(--muted);letter-spacing:.6em;margin:1.1em 0;text-indent:0;break-after:avoid}
.endnote{break-before:column;text-align:center;padding-top:18vh}
.endnote .mark{font-size:2em;color:var(--accent);margin:0}
.endnote h3{font-family:var(--body);font-size:1.6em;margin:.4em 0 .2em;color:var(--ink)}
.endnote p{text-indent:0!important;color:var(--muted);text-align:center!important;font-family:var(--ui)}
.endnote .btn{margin-top:1.2em;font-size:17px}
#sentinel{display:inline-block;width:1px;height:1px}
.foot{flex:none;padding:4px 20px 10px;font-size:14px;color:var(--muted)}
.foot .row{display:flex;justify-content:space-between;gap:12px;margin-top:6px}
.foot .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:2px;background:var(--rule);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;background:var(--shade);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:82%;
  background:var(--sheet);color:var(--ink);border-radius:20px 20px 0 0;z-index:21;
  padding:8px 22px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;
  transform:translateY(105%);transition:transform .25s ease,visibility 0s linear .25s;visibility:hidden;
}
.sheet.on{transform:none;visibility:visible;transition:transform .25s ease;box-shadow:0 -8px 30px var(--shade)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--rule);margin:4px auto 10px}
.sheet h2{font-family:var(--body);font-size:22px;margin:6px 0 4px}
.sheet .sub{font-size:14px;color:var(--muted);margin:0 0 12px}
.toc{list-style:none;margin:0;padding:0}
.toc li{border-top:1px solid var(--rule)}
.toc button{width:100%;display:flex;align-items:baseline;gap:14px;padding:14px 2px 10px;text-align:left}
.toc .n{font-family:var(--body);font-weight:600;color:var(--accent);min-width:1.6em}
.toc .t{flex:1;font-size:18px}
.toc .cur{font-size:13px;color:var(--muted)}
.toc .new{font-size:13px;color:var(--paper);background:var(--accent);border-radius:999px;padding:2px 9px 0}
.toc li.soon{color:var(--muted);padding:14px 2px 10px;display:flex;gap:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--rule)}
.setrow:first-of-type{border-top:0}
.seg{display:flex;gap:8px}
.seg button{min-width:48px;height:44px;padding:4px 14px 0;border-radius:12px;border:1.5px solid var(--rule)}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid var(--rule)}
.sample{font-family:var(--body);color:var(--muted);font-size:15px;margin:2px 0 0}
</style>
</head>

<script type="application/json" id="book-data">{"title": "പേരിടാത്ത നോവൽ", "author": "എഴുത്തുകാരന്റെ പേര്", "tagline": "വായനക്കാർക്കുള്ള കരട് പതിപ്പ്", "updatedLabel": "അവസാനം പുതുക്കിയത്: 2026 ഒക്ടോബർ 22", "moreComing": true, "chapters": [{"label": "അദ്ധ്യായം 1", "title": "അദ്ധ്യായം 1", "paras": ["രാത്രി പന്ത്രണ്ട് മണിയോട് സമയം അടുത്തിരിക്കുന്നു. ഒമ്പത് മണി കഴിഞ്ഞപ്പോൾ തുടങ്ങിയിരുന്ന മഴ ഇനിയും ശമിച്ചിട്ടില്ല. മഴ അതിന്റെ പല ഭാവങ്ങളിലും പെയ്തുകൊണ്ടിരിക്കുകയാണ്. നിരത്തുകൾ വെള്ളച്ചാലുകളായി മാറിക്കഴിഞ്ഞിരിക്കുന്നു. ചാറ്റലുകളായി മഴ അതിന്റെ അവസാനത്തിലേക്ക് കടക്കുകയാണെന്ന തോന്നൽ അയാളിൽ ഉണ്ടായി. കഡുഗോഡി മൈത്രി ലെ ഔട്ടിലെ നയൻത് ക്രോസിന്റെ ഒരു മൂലയിലുള്ള വാകമരച്ചുവട്ടിൽ അയാൾ നിൽക്കുമ്പോൾ ആ പ്രദേശം ഒന്നാകെ ഉറങ്ങി കഴിഞ്ഞിരിക്കുന്നു. അവിടെ ഉണ്ടായിരുന്ന സ്ട്രീറ്റ് ലൈറ്റുകളിൽ പലതും കണ്ണടച്ചിട്ട് കാലം കുറച്ചായി. ആ ഇരുട്ട് അയാൾക്ക് ഒരു മറയായി നിന്നു.", "അവിടെ നിന്നാൽ ആ വീട് മുഴുവൻ കാണാമായിരുന്നു. ഒരല്പം താഴ്ന്ന മതിലും, തുരുമ്പ് പടർന്ന് കയറിയ ഗേറ്റും, പടികൾക്കരികിൽ ചെറിയൊരു തുളസിത്തറയും, കരിഞ്ഞ് പോയ ചെടികളുമായുള്ള കുറച്ച് ചെടിച്ചട്ടികളും ആ വീടിനെ അയാൾക്ക് പരിചയപ്പെടുത്തി. ഗേറ്റിന്റെ തൂണിൽ മങ്ങിപ്പോയ ഒരു പേര് കറുത്ത നിറത്തിൽ വെളുത്ത അക്ഷരത്തിൽ എഴുതി വച്ചിരുന്നു. ഈ മാസം അവസാനിക്കുന്നതിന് മുമ്പ് പുതിയ ഉടമസ്ഥർ അത് പൂർണമായും മായ്ക്കും - 'എം.മാധവൻ മേനോൻ'. ആ പേരിലെ അക്ഷരങ്ങളെല്ലാം വെയിലേറ്റു ചിതറിപോയിരുന്നു.", "ആ മഴയിലും അയാൾ തന്റെ കയ്യിലുണ്ടായിരുന്ന കുട നിവർത്തിയിരുന്നില്ല. അതിന്റെ പിടി ഒരു പ്രത്യേക ആകൃതിയിലായിരുന്നു. ആളുകൾ ഓർമിച്ച് വെക്കുന്നത് അത്തരം പ്രത്യേകതകളാണ്. അയാളൊരു തൊപ്പി ധരിച്ചായിരുന്നു നിന്നിരുന്നത്. ആ തൊപ്പിയുടെ വാക്കുകളിൽ നിന്ന് വെള്ളം അയാളുടെ ശരീരത്തിലേക് പടര്ന്നുണ്ടായിരുന്നു. കോളറിന് പുറകിലൂടെ ഒലിച്ചിറങ്ങുന്ന വെള്ളം അയാളിൽ യാതൊരു അസ്വസ്ഥതയും ഉണ്ടാക്കിയില്ല. ആ ചാറ്റൽ മഴ ഇലകളിൽ തങ്ങി നിന്ന വെള്ളത്തെ ഇടക്കിടെ കനം കൂടിയ മഴത്തുള്ളികളാക്കി അയാളിലേക്ക് പതിപ്പിച്ചു.", "അറുപത്തിമൂന്ന് വയസ്സായിരുന്നു അയാളുടെ പ്രായം. അതിൽ ഏതാണ്ട് ഇരുപത്തിരണ്ട് വര്ഷം പോലീസിലും ബാക്കി പതിനൊന്ന് വര്ഷം ഇത്തരത്തിലുള്ള ജോലികളിലും അയാൾ ചെലവഴിച്ചു. ഇത്തരത്തിലുള്ള ജോലി എന്നു പറയുമ്പോൾ പല ആളുകൾക്കും വേണ്ടി അവർ ചൂണ്ടിക്കാണിക്കുന്ന ആളുകളെ നിരീക്ഷിക്കുക. ഭാര്യമാർക്ക് വേണ്ടി ഭർത്താക്കന്മാരെയും, ഭർത്താക്കന്മാർക്ക് വേണ്ടി ഭാര്യമാരെയും അയാൾ നിരീക്ഷിച്ചിട്ടുണ്ട്. ഒരിക്കൽ സംശയാലുവായ ഒരു അച്ഛനു വേണ്ടി മരുമകനെ പിന്തുടർന്നപ്പോൾ, അയാൾക്ക് പ്രത്യേകിച്ച് ഒന്നും കണ്ടെത്താനുണ്ടായില്ല. ഒരു രണ്ടാമത്തെ ഫോണും, സ്റ്റോക് മാർക്കറ്റിൽ പണം നഷ്ടപ്പെടുത്തുന്നു എന്നതും മാത്രമായിരുന്നു ആകെ കണ്ടെത്തിയത്. ആ അച്ഛന്റെ സംശയം അയാൾക് മറ്റേതോ ഒരു ബന്ധമുണ്ടെന്നും പണം ചെലവഴിക്കുന്നത് അവിടെയാണെന്നുമായിരുന്നു. അതുകൊണ്ട് തന്നെ അയാളെ അന്വേഷിച്ച് വരുന്നവർക്ക് എല്ലാം തങ്ങൾക് നേരത്തെ തന്നെ സംശയമുണ്ടായിരുന്ന കാര്യങ്ങൾ സ്ഥിരീകരിച്ച് കിട്ടാനുള്ള തെളിവുകൾ സംഘടിപ്പിച്ച് നൽകണം. ഇത്തരത്തിലുള്ള സാധാരണ ജോലികളാണ് അയാൾ ചെയ്തുകൊണ്ടിരുന്നത്. അതിനുള്ള പ്രതിഫലം അയാൾക് നൽകുന്നു. അത്രമാത്രം.", "എന്നാൽ, ഈ ജോലി അത്തരത്തിലുള്ള ഒന്നായിരുന്നില്ല. ആ വീടിന്റെ മുൻവശത്തെ ഒരു മുറിയിൽ ലൈറ് തെളിഞ്ഞിരുന്നു. ആ വഴിയിൽ വെളിച്ചമുള്ള ഒരു ജനൽ അത് മാത്രമായിരുന്നു. മറ്റെല്ലാ വീടുകളും ഉറക്കത്തിലേക്ക് മാറിക്കഴിഞ്ഞിരുന്നു. ആ ജനാലയിലൂടെയുള്ള വെളിച്ചം മഴയിൽ നനഞ്ഞ റോഡിലേക്കു പടർന്ന് കിടപ്പുണ്ടായിരുന്നു. ആ വീട്ടിൽ താമസിച്ചിരുന്ന വിധവയായൊരു സ്ത്രീ നാട്ടിലേക്ക് മടങ്ങിപോയതിന് ശേഷം, കഴിഞ്ഞ രണ്ട് വര്ഷങ്ങളിലേറെയായി ആ വീട് ഇരുട്ടിലായിരുന്നു. എന്നാൽ ഇപ്പോൾ തുടർച്ചയായ നാലാം രാത്രിയിലും ഒരു സ്ത്രീ ആ വീട്ടിലുണ്ട്. ഓരോ അലമാരകളും, മേശകളും, അടുക്കിവച്ചിരുന്ന പൊടിപിടിച്ച കടലാസ് പെട്ടികളുമെല്ലാം തുറന്ന് അവയിലെ സാധനങ്ങൾ പരിശോധിക്കുകയാണ് അവരെന്ന് അയാൾ വീടിനടുത്തേക്ക് പതിയെ നടന്നടുക്കുമ്പോൾ കണ്ടു.", "ഒരു കെട്ട് കടലാസുകളുമായി അവർ ജനൽ കമ്പികൾക് പുറകിലൂടെ നടന്നു പോകുന്നത് അയാൾക്ക് കാണാം. അവരത് ഒരു മേശയ്ക്ക് മുകളിൽ വച്ച് അവിടെയുണ്ടായിരുന്ന കസേരയിൽ ഇരുന്നു. തന്റെ കണ്ണട എടുത്ത് വച്ച് അവർ അത് ശ്രദ്ധയോടെ വായിക്കുന്നുണ്ട്. വെറുതെ കണ്ണോടിക്കുകയല്ലെന്നത് വ്യക്തം. മറിച്ച് ഓരോ പേജുകളും കാര്യമായി തന്നെ വായിക്കുകയാണ്. പലപ്പോഴും ചില പേജുകൾ കയ്യിലെടുത്ത് പിടിച്ച് അവർ അതിലെന്തോ തിരയുന്നത് പോലെ അയാൾക് തോന്നി. അതുവരെ നോകിയതൊന്നും അവർ മേശമേൽ ഇരിക്കുന്ന അവരുടെ കറുത്ത ബാഗിലേക്ക് മാറ്റി വയ്ക്കുന്നതും അയാൾക് കാണാനായില്ല. അവരെന്തോ അന്വേഷിക്കുന്നതും മനസിലാക്കാൻ ശ്രമിക്കുന്നതും ഇതുവരെ അവർക്ക് ലഭിച്ചിട്ടില്ലെന്ന് അയാൾക്കുറപ്പായി. കാര്യങ്ങൾ പൂർണ്ണമായി മനസ്സിലാവാതെ അവർ അവിടം വിട്ട് പോവാൻ മുതിരില്ല. അതൊരുപക്ഷേ ഒരു പത്രപ്രവർത്തകയുടെ ശീലമാവാം. അയാൾ ചിന്തിച്ചു. അതല്ലെങ്കിൽ അച്ഛനിൽ നിന്ന് മകൾക് ലഭിച്ച സ്വഭാവവുമാവാം.", "അവരുടെ പേരും, മുഖവും അയാൾക്ക് അറിയാമായിരുന്നു. ഇന്ദിരാനഗറിൽ അവർ ഒറ്റയ്ക്ക് താമസിക്കുന്ന ഫ്ലാറ്റും, ഔട്ടർ റിംഗ് റോഡിൽ അവർ ജോലി ചെയ്യുന്ന ന്യൂസ് ഓഫീസും, അവർ അമിത ശ്രദ്ധയോടെ ഓടിക്കുന്ന ആ ചാരനിറത്തിലുള്ള ഹാച്ച്ബാക്ക് കാറും - എല്ലാം അയാൾക്കറിയാമായിരുന്നു. ഒരു കവറിനുള്ളിലാണ് ഈ വിവരങ്ങളെല്ലാം അയാളിലേക്കെത്തിയത്; ഒപ്പം ഒരു ഫോട്ടോയും വിലാസവും, അയാൾ ചെയ്യേണ്ടിയിരുന്ന ആ ജോലിയുടെ മൂല്യത്തേക്കാൾ വലിയൊരു തുക പ്രതിഫലമായും ആ കവറിൽ ഉണ്ടായിരുന്നു.", "അതാണ് അയാളെ ആദ്യം അസ്വസ്ഥനാക്കിയത്. തന്റെ അനുഭവത്തിൽ, ആളുകൾ അമിതമായി പണം നൽകുന്നത് പ്രധാനമായും രണ്ട് കാരണങ്ങൾ കൊണ്ടാണ്: ഒന്നുകിൽ അവർക്ക് ഭയക്കാനുള്ള എന്തോ ഒന്ന് ഈ അന്വേഷണത്തിൽ കണ്ടെത്താനുണ്ട്, അല്ലെങ്കിൽ അവർക്ക് വേണ്ട വിലയേറിയ എന്തോ വിവരങ്ങൾ വിലയ്‌ക്കെടുക്കാനുണ്ടാവുമായിരിക്കാം.", "ആ നിശബ്ദമായ രാത്രിയെ വിറപ്പിച്ച് കൊണ്ട് കെട്ടിടങ്ങളുടെ മേൽക്കൂരകൾക്കപ്പുറത്തുകൂടി ഒരു ട്രെയിൻ യശ്വന്ത്പൂരിലേക്ക് കടന്നുപോയി. മഴയിൽ അലിഞ്ഞ്, നീണ്ടുനിന്ന ഒരു ഹോൺ ശബ്ദം അവനിലേക്ക് എത്തി. ഒരു നായ വെറുതെ ഒന്നു കുരച്ചു, പിന്നെ നിശബ്ദമായി. അയാൾ തന്റെ വാച്ചിലേക്ക് നോക്കി. സമയം രണ്ട് മണിയോടടുക്കുന്നു. അയാളുടെ പോക്കറ്റിൽ കിടന്ന് ഫോൺ വൈബ്രെറ്റു ചെയ്തു.", "അയാൾ ആ ഒരു മെസേജ് പ്രതീക്ഷിച്ചിരുന്നു എന്ന് തോന്നുന്നു. എവിടെയും തിരിഞ്ഞ് നോക്കാതെ, ഫോൺ എടുത്ത് സ്‌ക്രീനിലേക് നോക്കി. ഒരു ഇമെയിൽ ആണ്. അയച്ചിരിക്കുന്നത് മാധവൻ മേനോൻ. കുറച്ച് നേരം അയാൾ ആ മെസേജ് തുറക്കാതെ വിദൂരതയിലേക്ക് നോക്കി നിന്നു. ഈ മെയിൽ അഡ്രസിൽ നിന്നായിരിക്കും മെസേജ് വരിക എന്ന് ആദ്യമേ അയാൾക് വിവരം ലഭിച്ചിരുന്നു. അതിനൊരു കാരണവും അയാളെ അറിയിച്ചിരുന്നതാണ്. ഫോൺ നമ്പറുകളെക്കാൾ സുരക്ഷിതമായ, വർഷങ്ങളായി ഉപയോഗിക്കാത്ത, ഒരിടത്തും ഉപയോഗിക്കാത്ത ഒരു പഴയ അക്കൗണ്ട്. പകൽ വെളിച്ചത്തിൽ ഇന്ദിരാനഗറിലെ ഒരു കഫെയിലിരുന്ന് കേൾക്കുമ്പോൾ അതൊരു യുക്തിസഹമായ കാര്യമായി തോന്നിയിരുന്നു. എന്നാൽ, ആ മഴയത്ത് മരിച്ചുപോയ ഒരാളുടെ വീടിനു മുന്നിൽ നിൽക്കുമ്പോൾ, അതേ വ്യക്തിയുടെ പേരിൽ ഒരു സന്ദേശം ലഭിക്കുക എന്നത് തികച്ചും വല്ലാത്ത ഒരനുഭവമായി അയാൾക് തോന്നി.", "അയാൾ ആ മെയിൽ തുറന്നു.", "അതിൽ അഭിസംബോധനയോ മറ്റു ഔപചാരിതകളോ ഒന്നും ഉണ്ടായിരുന്നില്ല. ഒരൊറ്റ വാരി മാത്രം - അവൾ അത് കണ്ടെത്തിയോ?", "അയാൾ കണ്ണുകളുയർത്തി ജനാലയിലേക്ക് നോക്കി. ആ സ്ത്രീ ജനാലയ്ക്കരികിൽ നിന്നുകൊണ്ട് എന്തോ നോക്കുന്നുണ്ട്. അതൊരു നോട്ട് ബുക്കോ ഫയലോ ആവാം. കൃത്യമായി പറയാനാവുന്നില്ല. അവർ അതിൽ തന്നെ ശ്രദ്ധയോടെ വായിച്ച് അവിടെത്തന്നെ കുറച്ച് നേരം നിന്നു. ആ നിമിഷം, വർഷങ്ങളായി ഒരു ജോലിക്കിടയിലും സംഭവിക്കാത്ത വിധം അയാളുടെ ഉള്ളൊന്ന് പിടഞ്ഞു. അതിനിടെ ആ സ്ത്രീ തന്റെ കയ്യിലുണ്ടായിരുന്ന പേപ്പറുകൾ ഒരു കാർട്ടൻ ബോക്സിലേക് വയ്ക്കുന്നതും അടുത്ത പേപ്പറുകൾ എടുക്കുന്നതും അയാൾ കണ്ടു.", "അയാൾ പതിയെ നിന്നിടത്ത് നിന്ന് ഒരല്പം കൂടി പുറകിലോട്ട് മാറി നിർത്തിയിട്ടിരുന്ന ഒരു കാറിന്റെ മറവിലേക് നീങ്ങി നിന്ന്, മെസേജ് വന്നാൽ മാത്രം വിളിക്കണമെന്ന് നിർദ്ദേശിക്കപ്പെട്ടിരുന്ന ആ നമ്പറിലേക്ക് ഡയൽ ചെയ്തു. ആദ്യത്തെ തവണ വിളിച്ചപ്പോൾ ഫോൺ ആരും അറ്റൻഡ് ചെയ്തില്ല. അയാൾ സംശയത്തോടെ വീണ്ടും വിളിച്ചു. നാലാമത്തെ റിംഗിൽ ഫോൺ അറ്റന്റ് ചെയ്തു.", "\"അതെ\" - ശാന്തവും, ഉറച്ചതും, ഒട്ടും തിടുക്കവുമില്ലാത്തതുമായ ഒരു ശബ്ദം. ആ ശബ്ദത്തിന് ഉടമയായ ആളെ അയാൾ ഒരിക്കൽ കണ്ടിട്ടുണ്ട്. പക്ഷെ, പേരറിയില്ല. അറിയില്ലെനന്നല്ല, അയാൾ ചോദിച്ചിരുന്നുമില്ല. അല്ലെങ്കിലും ഇത്തരം ജോലികൾ ഏല്പിക്കാൻ വരുന്നവർക്ക് തങ്ങളുടെ ഐഡന്റിറ്റി വെളിപ്പെടുത്താൻ താത്പര്യവും ഉണ്ടാവാറില്ല.", "\"എന്തായി, അവൾക്കത് കിട്ടിയോ?\"", "\"ഇല്ല\"- അയാൾ പറഞ്ഞു. \"ഇതുവരെ കിട്ടിയിട്ടില്ല\".", "പേജുകൾ പരതി നോക്കുന്ന ആ സ്ത്രീയെ അയാൾ നോക്കി. \"പക്ഷെ, അവൾ ഉത്തരങ്ങളല്ല തിരയുന്നത്, ചോദ്യങ്ങളാണ്\" - അയാൾ പറഞ്ഞു.", "“എനിക്കറിയാം.” വളരെ പെട്ടെന്നായിരുന്നു ആ മറുപടി. ആ മറുപടിയിൽ അയാൾ അസ്വസ്ഥനായി. എന്തുകൊണ്ടാണ് അത് തന്നെ അസ്വസ്ഥമാക്കിയതെന്ന് മനസ്സിലാക്കാൻ അയാൾക്ക് അല്പസമയം വേണ്ടിവന്നു. കാര്യങ്ങൾ നിരീക്ഷിക്കാനാണ് അദ്ദേഹത്തെ നിയോഗിച്ചിരുന്നത്; അതായത്, എല്ലാം കാണേണ്ടത് അയാളായിരുന്നു. എന്നാൽ, മറുതലയ്ക്കലുള്ള ആൾക്ക് കാര്യങ്ങൾ നേരത്തെ തന്നെ അറിയാമായിരുന്നു. അതിനർത്ഥം, അവിടെ നിരീക്ഷിക്കാൻ അയാൾ മാത്രമായിരുന്നില്ല എന്നാണ്.", "“അവൾ പോകുന്നതുവരെ അവിടെ നിങ്ങൾ ഉണ്ടാവണം”. അയാൾക്കുള്ള നിർദേശം അതായിരുന്നു. “തീർച്ചയായും” - അയാൾ മറുപടി നൽകി.", "ആ റോഡിന്റെ മറുതലയ്ക്കൽ, നയൻത് ക്രോസ് മെയിൻ റോഡുമായി ചേരുന്നിടത്ത്, ഒരു വാഹനത്തിന്റെ ഹെഡ്‌ലൈറ്റുകൾ തെളിഞ്ഞു. ആ വാഹനം വളരെ സാവധാനമാണ് വരുന്നത്. അത് അവിടെ താമസിക്കുന്ന ആരുടെയെങ്കിലും വാഹനത്തിന്റെയോ, വഴി തെറ്റിയ ഏതെങ്കിലും ഡ്രൈവറുടെ വാഹനത്തിന്റേയോ വേഗതയല്ല എന്ന് അയാൾക്ക് മനസ്സിലായി. അടഞ്ഞ് കിടക്കുന്ന ഒരു ചെറിയ പലചരക്ക് കടയും, ക്ഷേത്രമതിലും കടന്ന് നിർത്തിയിട്ടിരിക്കുന്ന ഒരു കാറിന് മുന്നിലായി ആ വാഹനം നിന്നു. ഉടൻ തന്നെ ആ ലൈറ്റുകൾ അണയുകയും ചെയ്തു. എന്നാൽ എൻജിൻ ഓഫായിരുന്നില്ല.", "മഴയുടെ ശബ്ദത്തിനിടയിലും, ക്ഷമയോടെ ഓടിക്കൊണ്ടിരിക്കുന്ന ആ എൻജിന്റെ ശബ്ദം അയാൾക്ക് കേൾക്കാമായിരുന്നു. “ആരോ വന്നിട്ടുണ്ട്” അയാൾ പതുക്കെ പറഞ്ഞു.", "ഫോൺ ലൈനിൽ ഒരു നിമിഷത്തെ നിശബ്ദത. “ആരാണ്?”.", "“അറിയില്ല.”", "വീണ്ടും ഒരു നിശബ്ദത, അത് ഇത്തവണ കുറച്ചുകൂടി നീണ്ടുനിന്നു. ശബ്ദം വീണ്ടും കേട്ടപ്പോൾ അതിലെ ശാന്തത ഒട്ടും കുറഞ്ഞിരുന്നില്ല; ആ രാത്രിയിൽ മറ്റെന്തിനേക്കാളും അദ്ദേഹത്തെ ഭയപ്പെടുത്തിയത് അതായിരുന്നു. “അപ്പോൾ, ആരാണെന്ന് മനസ്സിലാകുമ്പോഴേക്കും നീ അവിടെ നിന്ന് മാറിക്കോ.”", "ഫോൺ ലൈൻ കട്ടായി. അയാൾ വീണ്ടും വെളിച്ചം വീശുന്ന ജനാലയിലേക്ക് നോക്കി. തന്റെ അച്ഛന്റെ രേഖകൾക്കിടയിൽ മുട്ടുകുത്തിയിരിക്കുന്ന ആ സ്ത്രീയെ അദ്ദേഹം വീണ്ടും കണ്ടു. തന്നെ മറ്റാരോക്കെയോ നിരീക്ഷിക്കുന്നുണ്ടെന്ന് അറിയാതെ അവരിപ്പോഴും എന്തെല്ലാമോ തിരയുകയാണ്. അയാൾ തന്റെ ഫോൺ പാന്റിന്റെ പോക്കറ്റിലിട്ട്, തൊപ്പി ഊരി വെള്ളമൊന്ന് കുടഞ്ഞ് വീണ്ടും ധരിച്ച് ഒട്ടും ധൃതി കാണിക്കാതെ ക്ഷേത്രത്തിന് പിന്നിലുള്ള ഇടവഴിയിലൂടെ നടന്നുനീങ്ങി.", "രണ്ടരയ്ക്ക് പത്ത് മിനിറ്റുള്ളപ്പോൾ ആ സ്ത്രീ മുറിയിലെ വിളക്കണച്ച് ഇരുട്ടിൽ അൽപനേരം നിന്നു. മഴക്കാലത്ത് ആ വീടിന് എപ്പോഴും ഉണ്ടായിരുന്ന അതേ ഗന്ധം അവിടെ നിറഞ്ഞുനിന്നു. നനഞ്ഞ ചുവന്ന തറയുടെ മണം, പഴയ കടലാസുകളുടെ മണം, പിന്നെ മുപ്പതു വർഷമായി അമ്മ എല്ലാ അലമാരകളിലും സൂക്ഷിച്ചിരുന്ന കർപ്പൂരത്തിന്റെ നേരിയ ഗന്ധം. ഫർണിച്ചറുകൾ ഇല്ലാത്തതുകൊണ്ട് മുറികൾ അവൾ ഓർമ്മിച്ചതിലും വലുതായി തോന്നി. പക്ഷെ, സഹിക്കാനാവാത്ത ഒരു നിശബ്ദത അവൾക് അനുഭവിക്കാനാവുന്നനുണ്ടായിരുന്നു. ഒരുമിച്ച് സംസാരിച്ചിരുന്ന ആ പഴ ഡൈനിംഗ് ടേബിളും, ഒരു തേക്കിന്റെ അലമാരയും അവിടം വിട്ട് പോയിക്കഴിഞ്ഞിരുന്നു. സിടൗട്ടിൽ തൂക്കിയിട്ടിരുന്ന ചൂരലിന്റെ ആ കസേര ഗ്രില്ലിലേക്ക് കൊളുത്തിവച്ചിട്ടുണ്ട്. പൊടിയും ചിലന്തിവലയും അതിലെ ഓർമ്മകളെ അപ്പാടെ മറച്ചിരിക്കുന്നു. അത് കഴിഞ്ഞാൽ ആ വീട്ടിൽ അവശേഷിച്ചത് കടലാസുകൾ മാത്രമായിരുന്നു. പത്തൊമ്പത് പെട്ടികളിലായി നിറച്ച കടലാസുകൾ; അതിൽ പതിനൊന്ന് പെട്ടികളിലെ ഉള്ളടക്കം ഈ നാല് ദിവസങ്ങളിലായി അവൾ വായിച്ചുതീർത്തിരുന്നു.", "അവർ മുറിക്ക് പുറത്ത് കടന്നു. ഹാളിലെ ലൈറ്റിട്ടു. ഇപ്പോൾ വീടിന്റെ മുൻവശം വരെ പ്രകാശം കാണാം. ഹാളിലെ ഒരു വശത്തായി പരിശോധിക്കാത്ത പെട്ടികൾ മാറ്റി വച്ചിട്ടുണ്ട്. അതിൽ നിന്ന് രണ്ട് പെട്ടികൾ അവർ ആയാസത്തോടെ എടുത്ത് പുറത്തേക് നടന്നു. സിറ്ഔട്ടിൽ ആ പെട്ടികൾ വച്ച് അടച്ചിട്ട ഗേറ്റും പാർക്ക് ചെയ്തിരുന്ന കാറിന്റെ ഡിക്കിയും തുറന്ന് ആ രണ്ട് പെട്ടിയുമായി കാറിന് നേരെ നടന്നു. മഴ നേർത്ത് നേർത്ത് നൂല് പോലെ ആയിരിക്കുന്നു. ആ വീട്ടിലെ വെളിച്ചത്തിൽ ചാറ്റൽ മഴ തെളിഞ്ഞ് കാണാമായിരുന്നു. ആ പെട്ടികൾ കാറിൽ വച്ച് അവർ തിരികെ ചെന്ന് തന്റെ ബാഗെടുത്ത് ലൈറ് ഓഫ് ചെയ്ത് മുൻവശത്തെ വാതിൽ പൂട്ടി. അത് ശരിയായി പൂട്ടിയിട്ടുണ്ടോ എന്ന രണ്ട് തവണ ഉറപ്പ് വരുത്തി. പുറത്തേക്കിറങ്ങിയ അവർ ഗെറ്റ് അടച്ച് ലാച്ചിൽ കൈവച്ചുകൊണ്ട് ആ ചാറ്റൽ മഴയിൽ ഒരു നിമിഷം നിന്നു.", "അവരുടെ കൈകൾ ആ ലാച്ചിൽ നിന്ന് ആ തൂണിൽ എഴുതിയ നെയിം പ്ളേറ്റിലേക് നീങ്ങി. ആ വിരലുകൾക് താഴെ നരച്ച നിറത്തിൽ എം. മാധവൻ മേനോൻ എന്ന് അവർ വായിച്ചു. തൃശൂരിലേക്ക് താമസം മാറുമ്പോൾ ആ പേര് മായ്ച്ച് പോവണമെന്ന് 'അമ്മ പറഞ്ഞിരുന്നതാണ്. എന്നാൽ അതിപ്പോൾ വേണ്ടെന്ന് പറഞ്ഞത് താൻ തന്നെ ആയിരുന്നു. പക്ഷെ, അതെന്തേ എന്ന് 'അമ്മ ചോദിച്ചതുമില്ല.", "ഇപ്പോൾ അവിടെയില്ലാത്ത ആ ഡൈനിംഗ് ടേബിളിനു ചുറ്റുമുള്ള ഞായറാഴ്ചകളിലെ പ്രഭാതങ്ങളെ അവൾ ഓർത്തു. ഒരു കണ്ണടയും പഴയ കോട്ടൺ മുണ്ടുമണിഞ്ഞ്, മുന്നിൽ പല ലെഡ്ജറുകൾ തുറന്നുവെച്ചിരിക്കുന്ന അച്ഛൻ. കണക്കുകൾ കൂട്ടുന്നതിനിടയിൽ മറന്നുപോയതുകൊണ്ട്, അദ്ദേഹത്തിന്റെ കൈയ്ക്കരികിലിരുന്ന സ്റ്റീൽ ഗ്ലാസിലെ കാപ്പി തണുത്തുപോയിരിക്കുന്നു. അദ്ദേഹത്തിന് നേരെ എതിർവശത്ത്, അതൊന്നും ശ്രദ്ധിക്കാതെ ഏതൊക്കെയോ പുസ്തകങ്ങളുമായി ഇരിക്കുന്ന അഞ്ജലി മേനോൻ എന്ന ആ പഴയ സ്‌കൂൾ കുട്ടി.", "ഒരിക്കൽ, അവർക്ക് പന്ത്രണ്ട് വയസ്സുള്ളപ്പോൾ, എന്തുകൊണ്ടാണ് ഒരേ കോളം മൂന്ന് തവണ പരിശോധിച്ചതെന്ന് അവർ അച്ഛനോട് ചോദിച്ചിരുന്നു.", "അച്ഛൻ കണ്ണടയ്ക്കു മുകളിലൂടെ അവരെ നോക്കി പുഞ്ചിരിച്ചു.", "“കണക്കുകൾ ഒരിക്കലും കള്ളം പറയില്ല കുട്ടി. അത് എഴുതുന്നവരാണ് കളവ് ചെയ്യുന്നത്. അതറിയണമെങ്കിൽ പലവട്ടം പരിശോധിക്കേണ്ടി വരും.”.", "ആറ് വർഷത്തിന് ശേഷം പത്രങ്ങൾ തട്ടിപ്പ് എന്ന വാക്കിനൊപ്പം അദ്ദേഹത്തിൻ്റെ പേരും അച്ചടിച്ചു. ഒരു വർഷത്തിനുള്ളിൽ അച്ഛൻ മരിച്ചു. പ്രായപൂർത്തിയായതിന്റെ ഭൂരിഭാഗവും അച്ഛൻ അത് ചെയ്യില്ല എന്ന ഉറപ്പിലായിരുന്നു ജീവിച്ചത്. എന്നാൽ അതൊന്ന് തെളിയിക്കാൻ വേണ്ടി നടത്തിയ ശ്രമങ്ങളെല്ലാം തന്നെ വിഫലങ്ങളായിരുന്നു.", "അവൾ ഗേറ്റിൽ നിന്ന് കൈ എടുത്തു. കാറിന് നേരെ തിരിഞ്ഞപ്പോഴാണ് അവൾ അത് കണ്ടത്: അമ്പത് മീറ്റർ അകലെ, മഴമരങ്ങൾക്ക് താഴെയായി നിർത്തിയിട്ടിരിക്കുന്ന ഒരു ഗ്രെ കളർ സെഡാൻ കാർ. അതിന്റെ മുൻഭാഗം അവൾക്ക് നേരെയായിരുന്നു, ലൈറ്റുകൾ അണച്ചിട്ട നിലയിലും.", "നയൻത് ക്രോസിലെ നിർത്തിയിട്ടിരുന്ന ആ കാറിൽ പ്രത്യേകിച്ച് ശ്രദ്ധേയമായി ഒന്നും ഉണ്ടായിരുന്നില്ല. അവിടുത്തെ വീടുകളിൽ പകുതിയിലേറെ വാടക വീടുകളായി പരിണമിച്ചിരുന്നു. വഴിയരികിൽ സ്ഥലം കിട്ടുന്നിടത്തോക്കെ താമസക്കാർ തങ്ങളുടെ വാഹനങ്ങൾ പാർക്ക് ചെയ്തിട്ടുണ്ട്. പതിമൂന്ന് വർഷത്തോളം ഒരു ജേണലിസ്റ്റായിരുന്നില്ലെങ്കിൽ അഞ്ജലി ആ കാറിനെ ശ്രദ്ധിക്കാതെ കടന്ന് പോയേനെ. പക്ഷെ, സാധാരണയിൽ നിന്ന് വ്യത്യസ്തമായ ഏതൊരു കാര്യവും ശ്രദ്ധിക്കുന്ന ഒരു ശീലം അവൾക്ക് ഉണ്ടായിരുന്നതിനാൽ ആ കാറിനെ വിട്ടുകളയാതെ പോവാൻ അവൾക്കായില്ല.", "അവിടെ കിടന്നിരുന്ന എല്ലാ വാഹനങ്ങളുടെയും വിൻഡ്‌സ്‌ക്രീനുകളിൽ ചാറ്റൽമഴ തുള്ളികളായി പറ്റിപ്പിടിച്ചിരുന്നു. എന്നാൽ, ആ ഒരു വാഹനത്തിന്റെ വിൻഡ്‌സ്‌ക്രീനിൽ മാത്രം അങ്ങനെയുണ്ടായിരുന്നില്ല. അതിലെ ഗ്ലാസ് തെളിഞ്ഞുകിടന്നു. ആരെങ്കിലും അടുത്തിടെ വൈപ്പറുകൾ പ്രവർത്തിപ്പിച്ചിട്ടുണ്ടാകണം. കയ്യിൽ കാറിന്റെയും വീടിന്റെയും താക്കോലുകളുമായി അവൾ അനങ്ങാതെ നിന്നു. തെളിഞ്ഞ ആ ഗ്ലാസിന് പിന്നിൽ ഇരുട്ട് മാത്രമായിരുന്നു. അതിനുള്ളിൽ ആരെങ്കിലും ഇരിക്കുന്നുണ്ടോ എന്ന് അവൾക്ക് തിരിച്ചറിയാൻ കഴിഞ്ഞില്ല.", "ഒരു പക്ഷെ, അത് ഏതെങ്കിലും ഡ്രൈവർ ആയിരിക്കാം, അവൾ സ്വയം വിശ്വസിപ്പിക്കാൻ ശ്രമിച്ചു. അല്ലെങ്കിൽ പാർട്ടി കഴിഞ്ഞ് തിരിച്ചെത്തിയ ഏതെങ്കിലും ഐ ടിക്കാർ ആവാം. ചിലപ്പോൾ ഫോണിലോ മറ്റോ ആയിരിക്കും. വീട്ടിലേക്ക് കയറുന്നതിന് മുമ്പ് ഫോൺ സംഭാഷണം പൂർത്തിയാക്കാൻ ഇരിക്കുന്നതുമാവാം. ഇങ്ങനെ സാധാരണമായ നൂറ് കാരണങ്ങൾ ഉണ്ടാകാം.", "അങ്ങനെ വിശ്വസിപ്പിച്ച് അവൾ തന്റെ കാർ തുറന്ന് അകത്തുകയറി, എൻജിൻ സ്റ്റാർട്ട് ചെയ്യുന്നതിന് മുൻപായി വാതിലുകൾ ലോക്ക് ചെയ്തു. താൻ അങ്ങനെ ചെയ്തത് ശ്രദ്ധയിൽപ്പെട്ടപ്പോൾ അവൾക്ക് സ്വയം ദേഷ്യം തോന്നി.", "അഞ്ജലി കാർ സ്റ്റാർട് ചെയ്തു. പതിയെ മുന്നോട്ടെടുക്കുമ്പോഴും അവളുടെ ശ്രദ്ധ ആ സെഡാൻ കാറിൽ തന്നെ ആയിരുന്നു. മിററിലൂടെ അവൾ ആ കാർ ശ്രദ്ധിച്ചു. അതിന്റെ ലെറ്റുകൾ തെളിഞ്ഞില്ല. അത് അനങ്ങാതെ മരങ്ങളിൽ നിന്ന് വെള്ളം ഇറ്റ് വീഴുന്നിടത്ത് അതേപടി കിടന്നു. ക്ഷേത്രത്തിനടുത്തെ വളവ് തിരിഞ്ഞ് മെയിൻ റോഡിലേക്കു കയറുന്നത് വരെ അവൾ ആ കാറിനെ തന്നെ ശ്രദ്ധിച്ചു. അവൾ പോവും തോറും ആ കാർ മിററിൽ ചെറുതായിക്കൊണ്ടേ ഇരുന്നു.", "ക്ഷേത്രമതിലിന് പിന്നിലുള്ള ഇടവഴിയിലൂടെ നടന്നുപോയ, തൊപ്പി ധരിച്ച ആളെയും അവൾ കണ്ടില്ല. അപ്പോഴേക്കും അയാൾ അവിടെനിന്ന് പോയിക്കഴിഞ്ഞിരുന്നു.", "അവളുടെ ഉറക്കം അത്ര സുഖകരമായിരുന്നില്ല.", "ആറുമണിക്ക് ഉണർന്നപ്പോൾ കണ്ടത്, ചാരനിറം പൂണ്ട ഒരു നഗരത്തെയാണ്. ഇന്ദിരാനഗറിലെ തന്റെ ഫ്ലാറ്റിന്റെ ബാൽക്കണിയിൽ നിന്ന് നോക്കിയപ്പോൾ, ജാക്കരാണ്ട മരങ്ങളുടെ മുകൾഭാഗങ്ങളിൽ നിന്ന് വെള്ളം ഇറ്റുവീഴുന്നത് അവൾ കണ്ടു. ഒരു തൂപ്പുകാരൻ തലേദിവസം വീണ ഇലകൾ ഓടയിലേക്ക് തള്ളിക്കയറ്റുന്നുണ്ടായിരുന്നു. രാത്രിയിലെ മഴയ്ക്ക് ശേഷമുള്ള ബാംഗ്ലൂരിനെ കാണുമ്പോൾ, കരഞ്ഞുതീർത്ത ശേഷം കരഞ്ഞതേയില്ലെന്ന് നടിക്കുന്ന ഒരു നഗരത്തെപ്പോലെയാണ് അവൾക്ക് തോന്നിയത്.", "പുലർച്ചെ വന്നപ്പോൾ അവൾ വെച്ചിരുന്ന കാർട്ടണുകൾ, അവളുടെ വീടിന്റെ ഇടനാഴിയിൽ ഇരിപ്പുണ്ട്. അവയുടെ നേർക്ക് ഒന്നു നോക്കുകപോലും ചെയ്യാതെ, അവൾ കാപ്പി തയ്യാറാക്കി - അവളുടെ അച്ഛൻ ഉണ്ടാക്കിയിരുന്നതുപോലെ, ആദ്യം ഡിക്‌ോക്ഷൻ എടുത്ത്, പാൽ പ്രത്യേകം തിളപ്പിച്ച് - എന്നിട്ട് ആ കാപ്പിയുമായി അവൾ സോഫയിലേക്ക് നടന്നു.", "6:41-ന് അഞജലിയുടെ ഫോണിലേക്കു ഒരു മെസേജ് വന്നു.", "അവൾ ഫോണെടുത്ത് നോക്കി. വാട്സാപ്പ് മെസേജാണ്. അപരിചിതമായ ഒരു നമ്പർ. പേരില്ല, പ്രൊഫൈൽ ചിത്രമില്ല. അവൾ മെസേജ് ഓപ്പൺ ചെയ്തു. രണ്ട് ഇമേജുകൾ ആണ്. കൂടെ ഒരു വരി എഴുത്തും ഉണ്ട്. അവൾ ആദ്യത്തെ ചിത്രം ഓപ്പൺ ചെയ്തു.", "അതൊരു പഴയ ഫോട്ടോയുടെ ഫോട്ടോ പകർത്തിയതായിരുന്നു. ഒരു മഞ്ഞ വെളിച്ചത്തിൽ എടുത്ത ചിത്രം. ഒരു ഓഫീസ് കെട്ടിടത്തിന്റെ ചില്ലു വാതിലുകൾക് പുറത്ത് പന്ത്രണ്ടോളം പേർ നിൽക്കുന്നുണ്ടായിരുന്നു; ആ വാതിലുകളിൽ പുതുതായി കൊണ്ടുവന്ന ചെണ്ടുമല്ലിപ്പൂമാല ചാർത്തിയിരുന്നു. നന്നായി ഇസ്തിരിയിട്ട ഷർട്ടുകൾ ധരിച്ച പുരുഷന്മാരും, പട്ടുസാരിയുടുത്ത ഏതാനും സ്ത്രീകളും അവിടെയുണ്ട്. നേരിട്ടുള്ള സൂര്യപ്രകാശത്തിൽ ക്യാമറയിലേക്ക് നോക്കാൻ ആവശ്യപ്പെട്ടപ്പോൾ, കണ്ണുകൾ ചെറുതാക്കി, അല്പം കൃത്രിമമായി പുഞ്ചിരിക്കുന്ന ഭാവമാണ് എല്ലാവരുടെയും മുഖത്ത്. വാതിലുകൾക്ക് മുകളിൽ നീല അക്ഷരങ്ങളിൽ ഇങ്ങനെ എഴുതിയിരുന്നു: 'കാവേരി ഗ്ലോബൽ ട്രേഡേഴ്സ് പ്രൈവറ്റ് ലിമിറ്റഡ്'.", "ഇടതുവശത്തുനിന്ന് രണ്ടാമതായി, താൻ അച്ഛന് വേണ്ടി ഇസ്തിരിയിട്ടതെന്ന് ഓർമ്മയുള്ള, കൈകൾക്ക് നീളം കുറഞ്ഞ ഒരു ചെക്ക് ഷർട്ട് ധരിച്ചുകൊണ്ട് അവളുടെ അച്ഛൻ നിൽക്കുന്നുണ്ടായിരുന്നു.", "ഈ ഫോട്ടോ അവൾ ഇതിനുമുമ്പ് കണ്ടിട്ടില്ലായിരുന്നു. ആ വീട്ടിലെ എല്ലാ ആൽബങ്ങളും അവൾ പരിശോധിച്ചതാണ്. അദ്ദേഹത്തിന്റെ രേഖകളടങ്ങിയ പതിനൊന്ന് പെട്ടികൾ നാല് രാത്രികൾ കൊണ്ട് അവൾ വായിച്ചുതീർത്തതുമാണ്. അങ്ങനെയായിരുന്നെങ്കിൽ, ഇത് അവളുടെ ഓർമ്മയിൽ ഉണ്ടാകുമായിരുന്നു.", "ചിത്രത്തിന്റെ ചട്ടക്കൂടിന് പുറത്തുള്ള എന്തോ കണ്ടുകൊണ്ട് അദ്ദേഹം ചിരിക്കുകയായിരുന്നു. അവൾ ഓർക്കുന്നതിനേക്കാൾ ചെറുപ്പമായിട്ടാണ് അദ്ദേഹത്തെ അതിൽ കാണപ്പെട്ടത്. വരാനിരിക്കുന്ന കാര്യങ്ങളെക്കുറിച്ച് യാതൊരു ധാരണയുമില്ലാത്ത ഒരാളെപ്പോലെയായിരുന്നു അദ്ദേഹം.", "രണ്ടാമത്തെ ചിത്രം തുറക്കുന്നതിന് മുമ്പ്, അവൾ കൈയ്യിലിരുന്ന കാപ്പി താഴെ വെച്ചു.", "അതൊരു ലെഡ്ജർ ബുക്കിന്റെ പേജായിരുന്നു. മേശപ്പുറത്ത് മേശപ്പുറത്ത് പരത്തിവെച്ച് പകർത്തിയ ചിത്രം. തീയതികൾ, ഇൻവോയ്സ് നമ്പറുകൾ, ലക്ഷക്കണക്കിന് രൂപയുടെ തുകകൾ എന്നിവ അടങ്ങിയ നിരകൾ. തെറ്റിദ്ധരിക്കാൻ ഇടയില്ലാത്ത വിധം, അല്പം മുന്നോട്ട് ചാഞ്ഞ, വ്യക്തവും വൃത്തിയുള്ളതുമായ അക്കങ്ങൾ. ആ താളിന്റെ അടിഭാഗത്തേക്ക് എത്തുന്നതിന് മുൻപേ തന്നെ, ആ കൈയക്ഷരം അവൾ തിരിച്ചറിഞ്ഞു. തന്റെ സ്കൂൾ പുസ്തകങ്ങളുടെ കവറുകളിലും , അദ്ദേഹം അവൾക്ക് നൽകിയ അവസാനത്തെ ജന്മദിന കാർഡിലും അവൾ ആ കൈയക്ഷരം കണ്ടിരുന്നു.", "പേജിന്റെ അടിയിൽ, ആകെത്തുകയ്ക്ക് അരികിലായി അവളുടെ അച്ഛന്റെ ഒപ്പുണ്ടായിരുന്നു. തന്റെ സ്‌കൂൾ പ്രോഗ്രസ് റിപ്പോർട്ടിൽ അച്ഛൻ ഇടാറുണ്ടായിരുന്ന അതെ ഒപ്പ്.", "ആ ഒപ്പിനോട് ചേർന്ന്, ഫോട്ടോയുടെ തൊട്ടരികിലായി മറ്റെന്തോ ഒന്നുകൂടി ഉണ്ടായിരുന്നു.", "വ്യത്യസ്തമായ മഷിയിൽ വരച്ച മറ്റൊരു അടയാളത്തിന്റെ തുടക്കം. ഒരു വൃത്തം, ഒരു അക്ഷരത്തിന്റെ താഴേക്കുള്ള വര - പിന്നീട് ഒന്നുമില്ല; കാരണം ഫ്രെയിം അതിനെ മുറിച്ചുമാറ്റിയിരുന്നു.", "ചിത്രങ്ങൾക്ക് താഴെയുള്ള ആ മെസേജ് അവൾ വായിച്ചു.", "'നിങ്ങളുടെ അച്ഛൻ ഇത് ഒറ്റയ്ക്കല്ല ഒപ്പിട്ടത്'.", "ഒരു മിനിറ്റോളം അഞ്ജലി അനങ്ങാതെയിരുന്നു. താഴെ എവിടെയോ ഒരു പ്രഷർ കുക്കർ വിസിൽ മുഴക്കി. അടുത്ത കെട്ടിടത്തിൽ ഒരു കുട്ടി കരയുന്നുണ്ടായിരുന്നു. ചുറ്റും സാധാരണമായ ഒരു പ്രഭാതം കടന്നുപോയിക്കൊണ്ടിരുന്നു; കയ്യിൽ ഫോണുമായി അവൾ ആ ഒരൊറ്റ ഇരിപ്പിൽ തന്നെ ഇരുന്നു.", "ആദ്യത്തെ ഷോക്ക് ഒന്ന് മാറിയപ്പോൾ, അവളിലെ ജേണലിസ്റ് ഉണർന്നു. അവൾ കാര്യങ്ങളെ ചോദ്യങ്ങളായി ചിന്തിക്കാൻ തുടങ്ങി.", "എന്റെ വീട്ടിൽ ഒരിക്കലും ഇല്ലാതിരുന്ന ഈ ഒരു ഫോട്ടോ ഇപ്പോൾ ആരുടെ കൈവശമാണ് ഉള്ളത്?", "അച്ഛന്റെ രേഖകളിൽ പെടാത്ത അദ്ദേഹത്തിന്റെ ലെഡ്ജറുകളിലെ ഒരു പേജ് ഇപ്പോൾ ആരുടെ കൈവശമാണ് ഉള്ളത്?", "പിന്നെ, കൃത്യം ഇതുതന്നെ അന്വേഷിച്ചുകൊണ്ട് ഞാൻ നാല് രാത്രികൾ ചെലവഴിച്ചു എന്ന കാര്യം ആർക്കാണ് അറിയാമായിരുന്നത്?", "അവൾ റിപ്ലൈ ടൈപ്പ് ചെയ്തു: \"ആരാണിത്?\"", "രണ്ട് ചാരനിറത്തിലുള്ള ടിക്ക് മാർക്കുകൾ. അല്പനേരത്തിന് ശേഷം, അവ നീലനിറമായി മാറി.", "മറുപടി വളരെ സാവധാനമാണ് വന്നത്. എഴുതുന്നയാൾ ഓരോ വാക്കും ആലോചിച്ച് തിരഞ്ഞെടുക്കുകയാണെന്ന പോലെ.", "\"പതിനേഴ് വർഷം മുമ്പേ സംസാരിക്കേണ്ടിയിരുന്ന ഒരാൾ. ഫോണിലൂടെയല്ല. ഞാൻ നിന്നെ തേടിയെത്തും.\"", "അവൾ ഉടൻ തന്നെ ആ നമ്പറിലേക്ക് വിളിച്ചു. രണ്ടുതവണ റിംഗ് ചെയ്ത ശേഷം ലൈൻ കട്ടായി. അവൾ വീണ്ടും വിളിച്ചു. നിങ്ങൾ വിളിച്ച നമ്പർ നിലവിൽ സ്വിച്ച് ഓഫ് ആണ് എന്ന മറുപടിയിൽ അതവസാനിച്ചു.", "അഞ്ജലി തന്റെ അരികിലുണ്ടായിരുന്ന തലയിണപ്പുറത്ത് ഫോൺ സ്ക്രീൻ മുകളിലേക്ക് വരുന്ന രീതിയിൽ വെച്ചു. എന്നിട്ട് ഹാളിൽ നിരത്തിവെച്ചിരുന്ന കാർട്ടണുകളിലേക്ക് നോക്കി; ഒരു മനുഷ്യജീവിതത്തിന്റെ അവശിഷ്ടങ്ങളടങ്ങിയ ആ പത്തൊൻപത് പെട്ടികൾ - പതിനേഴ് വർഷങ്ങളായി അതൊരു നുണയാണെന്ന് തന്നോട് ആവർത്തിച്ചു പറഞ്ഞിരുന്ന അതേ പെട്ടികൾ.", "പിന്നീട് അവൾ വീണ്ടും ഫോൺ കയ്യിലെടുത്ത് രണ്ടാമത്തെ ചിത്രം സൂം ചെയ്ത നോക്കി. പേജിന്റെ അരികിലുള്ള മഷി ചാരനിറത്തിലുള്ള ചെറിയ ചതുരങ്ങളായി പിരിയുന്നതുവരെ അവൾ സാവധാനം അത് വലുതാക്കിക്കൊണ്ടിരുന്നു.", "ആ രണ്ടാമത്തെ അടയാളം എന്തായിരുന്നാലും, അത് എവിടെ വെച്ച് അവസാനിപ്പിക്കണമെന്ന് അത് അയച്ചയാളോ അത് അയാൾക് നൽകിയ ആളോ കൃത്യമായി തീരുമാനിച്ചിരുന്നു."], "isNew": false}, {"label": "അദ്ധ്യായം 2", "title": "അദ്ധ്യായം 2", "paras": ["ആ പഴയ മരത്തിന്റെ ചെറിയൊരു പെട്ടി അച്ഛന്റെ ഓഫീസിലെ മേശയിൽ ഉണ്ടായതായിരുന്നു. കമ്പനി അടച്ച് പൂട്ടിയപ്പോൾ അവർ അച്ഛന് തിരികെ നൽകിയ ഒരേയൊരു വസ്തുവും അത് മാത്രമായിരുന്നു. അമ്മയുടെ കണ്ണുകളിലേക്കു നോക്കാൻ പോലും കൂട്ടാക്കാത്ത ഒരു ജീവനക്കാരൻ, ടാക്സിയിലാണ് അത് എത്തിച്ചുനൽകിയത്. തിനേഴ് വർഷങ്ങളായി, താമസസ്ഥലങ്ങൾ മാറുമ്പോഴെല്ലാം അഞ്ജലി അത് കൂടെ കൊണ്ടുപോയി. ആകെ മൂന്നോ നാലോ തവണയേ അവൾ അത് തുറന്നിട്ടുണ്ടാകൂ.", "വളരെ കാലങ്ങൾക് ശേഷം അവൾ ആ പെട്ടി എടുത്തു. പതിവില്ലാത്ത വിധം ബാംഗ്ലുരിലെ തണുപ്പ് അവളെ വല്ലാതെ നോവിച്ചുകൊണ്ടേയിരുന്നു. ആ തണുപ്പിലും അവൾ ഹാളിലെ നിലത്തിരുന്ന് ആ പെട്ടിയിലേക് നോക്കി. തന്റെ കഴുത്തിൽ കിടക്കുന്ന സ്കാർഫ് ഒന്നൊതുക്കിയിട്ട് കയ്യിലെ ഫോൺ അവൾ നിലത്ത് വെച്ച് ആ പെട്ടി തുറന്നു.", "അതിനുള്ളിൽ അവൾക്ക് നന്നായി അറിയാവുന്ന മൂന്ന് വസ്തുക്കളാണുണ്ടായിരുന്നത്. അച്ഛന്റെ പഴയൊരു എച്ച്.എം.ടി. (HMT) വാച്ച്. അതിന്റെ സ്ട്രാപ്പ് പൊട്ടിപ്പോയിരുന്നു, വാച്ചിലെ സൂചികൾ നാലുമണിക്ക് ഇരുപത് മിനിറ്റ് ബാക്കിയുള്ള നേരത്ത് നിലച്ചിരിക്കുന്നു - ആ സമയം ഏത് ദിവസത്തേതാണെന്ന് ആർക്കും ഓർമ്മയുണ്ടായിരുന്നില്ല. അച്ഛന്റെ ഒരു പാസ്‌പോർട്ട് സൈസ് ഫോട്ടോ. അത് മങ്ങി, നേർപ്പിച്ച ചായയുടെ നിറമായി മാറിയിരുന്നു. പിന്നെ, നാലായി മടക്കിയ ഒരു പത്രക്കട്ടിംഗ്. പഴക്കം കൊണ്ട് അതൊരു നേർത്ത തുണി പോലെ ആയിരിക്കുന്നു.", "ആ പത്രവാർത്ത നിവർത്തി നോക്കേണ്ട ആവശ്യം അവൾക്കുണ്ടായിരുന്നില്ല. അതിനൊപ്പം പ്രസിദ്ധീകരിച്ച ചിത്രം അവൾക് അത്രമേൽ പരിചിതമായിരുന്നു. അച്ഛനെ രണ്ട് പോലീസുകാർ ഓഫീസിൽ നിന്ന് പുറത്തേക് കൊണ്ട് പോവുന്ന ചിത്രമായിരുന്നു അത്. കൈവിലങ്ങില്ലെങ്കിലും അദ്ദേഹത്തിന്റെ ഇരുകൈകളിലും ഇരുവശങ്ങളിലായി രണ്ട് പോലീസുകാർ ബലിഷ്ടമായി പിടിച്ചായിരുന്നു ആ നടത്തം. കാമറയിൽ നിന്ന് മുഖം തിരിച്ചാണ് അച്ഛൻ നടക്കുന്നത്. അന്ന് അവൾക് പതിനെട്ട് വയസായിരുന്നു. കോളേജിന് അടുത്തുള്ള ബസ് സ്റ്റോപ്പിലെ ഒരു കടയിലാണ് അവൾ ആദ്യമായി അത് കണ്ടത്. ഒരു സായാഹ്‌ന പത്രത്തിൽ മുൻ പേജിൽ തന്നെ ലീഡ് ന്യൂസായി ആ ചിത്രവും വാർത്തയും തൂങ്ങിക്കിടക്കുന്നത് അവൾ കണ്ടു. ബസുകൾ വരികയും പോവുകയും ചെയ്തുകൊണ്ടിരുന്നിട്ടും, അവൾ അവിടെത്തന്നെ അതിലേക്ക് നോക്കിക്കൊണ്ട് നിന്നു.", "അവളുടെ കണ്ണുകൾ നിറഞ്ഞു. ഓർമ്മകൾ അവളുടെ കണ്ണുകളിലേക്കു ഒഴുകിയെത്തി. അവൾ ആ പത്രക്കട്ടിങ്ങിൽ നിന്ന് കണ്ണെടുത്തു. ആ പെട്ടി ഒരു വശത്തേക്ക് നീക്കി വച്ച്, അവൾ എഴുന്നേറ്റു. തലേ ദിവസം കൊണ്ട് വന്നു വച്ച ആ കടലാസുപെട്ടികളിൽ നിന്ന് ഇതുവരെ തുറന്ന് നോക്കാത്ത പെട്ടികളിൽ ആദ്യത്തേത് തന്റെ അടുത്തേക്ക് വലിച്ചിട്ടു.", "സമയം പോകുന്നതൊന്നും അവൾ അറിഞ്ഞതേയില്ല. പാതി കുടിച്ച് വച്ച കാപ്പിയുടെ ചൂട് ആ തണുപ്പിനൊപ്പം അലിഞ്ഞ് പോയിരുന്നു. പത്ത് മണി ആയപ്പോഴേക്കും താൻ അതുവരെ അന്വേഷിക്കാതെ പോയ രണ്ട് കാര്യങ്ങൾ അവൾ കണ്ടെത്തികഴിഞ്ഞിരുന്നു.", "അതിൽ ആദ്യത്തേത്, 2008 മാർച്ചിലെ തീയതി രേഖപ്പെടുത്തിയ, ഒരു കന്നഡ ദിനപത്രത്തിന്റെ നഗരവാർത്താ പേജിൽ നിന്നുള്ള മറ്റൊരു കട്ടിംഗ് ആയിരുന്നു, ചെറിയൊരു ചിത്രം മാത്രം. അതൊരു വിവാദത്തെക്കുറിച്ചോ, മറ്റെന്തെങ്കിലും പ്രശ്നങ്ങളെ കുറിച്ചോ അല്ലായിരുന്നു. മറിച്ച് അതൊരു ആഘോഷത്തെ കുറിച്ചുള്ള വാർത്തയായിരുന്നു. 'കാവേരി ഗ്ലോബൽ ട്രേഡേഴ്സ് കന്നിംഗ്‌ഹാം രാസ്തയല്ലി ഹോസെ രാപ്തു കസേരിയന്നു തെരെയിറ്റിദേ' - കന്നിംഗ്ഹാം റോഡിൽ കാവേരി ഗ്ലോബൽ ട്രേഡേഴ്സ് പുതിയ കയറ്റുമതി ഓഫീസ് തുറക്കുന്നു എന്നായിരുന്നു തലക്കെട്ട്. അതിന് താഴെയായി വെള്ള ഷർട്ടും പാന്റ്സും ധരിച്ച ഒരാൾ, ചെണ്ടുമല്ലിപ്പൂക്കൾ കൊണ്ട് അലങ്കരിച്ച ഗ്ലാസ് വാതിലുകൾക്ക് കുറുകെ കെട്ടിയ റിബൺ മുറിക്കുന്ന ഒരു ചിത്രമുണ്ടായിരുന്നു.", "അവൾ തന്റെ ഫോൺ എടുത്തു. വാട്സാപ്പിൽ അയച്ച് കിട്ടിയ ചിത്രം ഗാലറിയിൽ നിന്നെടുത്ത് ഓപ്പൺ ചെയ്തു. പത്രവാർത്തയുടെ ചിത്രം അവൾ തന്റെ ഫോണിലെ ചിത്രത്തിനോട് ചേർത്ത് പിടിച്ചു.", "അതെ വാതിലുകൾ, അതെ പൂമാല, മുകളിലെ ബോർഡിൽ അതെ നീല അക്ഷരങ്ങൾ. ഈ രണ്ട് ചിത്രങ്ങളും എടുത്തത് അതെ ദിവസമാണ്. ഒരു പക്ഷെ അതെ മണിക്കൂറിൽ തന്നെ ആയിരിക്കാം.", "സ്ഥാപനം ഉദ്ഘാടനം ചെയ്യുന്ന അയാളെക്കുറിച്ച് ആ ചിത്രത്തിൽ എന്ത് പറയുന്നു എന്ന അവൾ നോക്കി. അടിക്കുറിപ്പിൽ അവൾ ഇങ്ങനെ കണ്ടു. എം എൽ എ ശങ്കർ ദേവരാജ് കമ്പനി ഡയറക്ടര്മാരുടെയും ജീവനക്കാരുടെയും സാനിധ്യത്തിൽ ഓഫീസ് ഉദ്ഘാടനം ചെയ്യുന്നു.", "കർണാടകയിലെ ആർക്കും അറിയാവുന്നതുപോലെ, അഞ്ജലിക്കും ആ പേര് പരിചിതമായിരുന്നു. എന്നാൽ പതിനേഴ് വർഷം മുൻപ് അദ്ദേഹം ആദ്യമായി നിയമസഭയിലേക്ക് തിരഞ്ഞെടുക്കപ്പെട്ട ഒരു ജനപ്രതിനിധി മാത്രമായിരുന്നു എങ്കിൽ ഇപ്പോൾ അങ്ങനെയല്ല. രാഷ്ട്രീയ മണ്ഡലത്തിൽ പല വിഷയങ്ങളിലും ആ പേര് ഉയർന്ന കേൾക്കാറുണ്ട്. ഒന്ന് രണ്ട് തവണ ചില വിഷയങ്ങളുമായി ബന്ധപ്പെട്ട് അഞ്ജലി അദ്ദേഹത്തെ സന്ദർശിച്ചിരുന്നു. അന്നെല്ലാം വളരെ ആകർഷകമായ പെരുമാറ്റവും വിഷയത്തെക്കുറിച്ചുള്ള ആഴത്തിലുള്ള അറിവും പ്രകടിപ്പിച്ച അദ്ദേഹം, പക്ഷെ ചില നേരങ്ങളിൽ പിടി കൊടുക്കാതെ ഇരുന്നത് അവൾ ശ്രദ്ധിച്ചിരുന്നു.", "ആ മനുഷ്യൻ ഒരിക്കൽ തന്റെ അച്ഛന്റെ ഓഫീസുമായി ഏതെങ്കിലും തരത്തിൽ ഒരു ബന്ധം ഉണ്ടായിരുന്നു എന്ന കാര്യം അവൾ അതുവരെ അറിയാതെ ഉണ്ടായിരുന്നില്ല. അവൾ ആ പത്രവാർത്തയുടെ ചിത്രം ഒരു പ്ലാസ്റ്റിക് കവറിലാക്കി മാറ്റി വച്ചു.", "രണ്ടാമത്തെ വസ്തു ഒരു ഡയറിയായിരുന്നു.", "2009ലെ ഒരു ഡെസ്ക് ഡയറി ആയിരുന്നു അത്. മെറൂൺ നിറത്തിലുള്ള റെക്‌സിൻ കവറിൽ ഒരു ബാങ്കിന്റെ പേര് സ്വർണ്ണനിറത്തിൽ പതിച്ചിരുന്നു. ആരെങ്കിലും ആരും കാണാതിരിക്കാനായി തിരുകിവെച്ചതുപോലെ, അല്ലെങ്കിൽ സുരക്ഷിതമായിരിക്കട്ടെ എന്നു കരുതി വെച്ചതുപോലെ, കടലാസുകൾക്കിടയിൽ ഒരു വശത്ത് വൈദ്യുതി ബില്ലുകളുടെ കെട്ടിനടിയിൽ അത് ഒളിച്ച് വച്ചിരുന്നു.", "അവൾ ആ ഡയറി എടുത്ത് തുറന്ന് നോക്കി. മുൻ കവറിന്റെ ഉൾവശത്തായി അച്ഛൻ ശ്രദ്ധാപൂർവ്വം എഴുതിയ പോലെ ഒരു ഇ മെയിൽ വിലാസമുണ്ടായിരുന്നു. അതിന് താഴെയായി 2006ലെ ഒരു തിയതിയും പേഴ്‌സണൽ എന്ന ഒരൊറ്റ വാക്കും കുറിച്ചിട്ടതായി അവൾ കണ്ടു.", "അപ്പോഴാണ് അയാൾക് അങ്ങനെ ഒരു സ്വഭാവം ഉണ്ടായിരുന്നു എന്നത് താൻ മറന്ന് പോയതായി അവൾ മനസ്സിലാക്കിയത്. മല്ലേശ്വരം മാർക്കറ്റിനടുത്തുള്ള സൈബർ കഫേയിൽ ഇരുന്ന്, രണ്ട് വിരലുകൾ കൊണ്ട് ടൈപ്പ് ചെയ്യുന്നതും, അയാൾക്ക് വന്ന ഓരോ സന്ദേശവും ഒരു ടെലിഗ്രാം വായിക്കുന്നതുപോലെ അമ്മയ്ക്ക് ഉറക്കെ വായിച്ചുകേൾപ്പിക്കുന്നതുമായ അയാളുടെ ചിത്രം അവൾ അപ്പോൾ ഓർത്തു. അതൊരു ശീലം മാത്രമായിരുന്നു. തനിക്കറിയാവുന്നതൊക്കെ അമ്മയോട് പറയുന്ന അച്ഛന്റെ ആ ശീലം അവളിലേക്ക് കടന്നുവന്നു. അവൾ ആ മെയിൽ ഐഡി തന്റെ ഫോണിലെ നോട്ടിലെക് പതിയെ പകർത്തി വച്ചു.", "അവൾ ആ ഡയറിയിലെ താളുകൾ മറിച്ചു. ഡയറിക്കുറിപ്പുകളെല്ലാം നന്നേ ചെറുതായിരുന്നു. ഇംഗ്ലീഷും മലയാളവും കലർന്ന ഭാഷയിലാണ് അവ എഴുതിയിരുന്നത്. അവയിൽ മിക്കതും നിസ്സാരമായ കാര്യങ്ങളായിരുന്നു. ഡോക്ടറെ കാണാനുള്ള സമയം, അവാളും കോളേജ് ഫീസ്, അമ്മയുടെ ബന്ധുവിന്റെ വിവാഹം, അവധിയെടുക്കേണ്ട ദിവസങ്ങൾ എന്നിങ്ങനെ. അവൾ സാവധാനം ഓരോ പേജുകളിലൂടെ കടന്ന് പോയി. പല കുറിപ്പുകളും അദ്ദേഹം ക്ഷീണിതനായിരിക്കുമ്പോൾ സംസാരിച്ചിരുന്നതുപോലെ അവൾക് തോന്നി. അച്ഛന്റെ ഒരു വര്ഷം അങ്ങനെ അവളുടെ വിരലുകൾക്കടിയിലൂടെ കടന്നുപോയി.", "അങ്ങനെ മാസങ്ങൾ കടന്ന് പോവുന്നതിനിടെ ജൂൺ മാസം മുതൽ കുറിപ്പുകളുടെ ഭാഷയിലും രീതികളിലുമെല്ലാം മാറ്റം വന്നത് അവൾ കണ്ടു.", "ജൂണിലെ എക്സ്പോർട്ട് ഇൻവോയ്‌സുകൾ ഷിപ്പിംഗ് ബില്ലുകളുമായി ഒത്തുപോകുന്നില്ല. ഡി-യോട് ചോദിച്ചു; സമയവ്യത്യാസം (timing difference) മൂലമാണെന്നാണ് അദ്ദേഹം പറയുന്നത്.", "അതേ കയറ്റുമതിക്കാർ തന്നെ. നാല് സ്ഥാപനങ്ങൾ. അതിൽ മൂന്നെണ്ണത്തിലും ഒരേ ഡയറക്ടർ. പരിശോധിക്കണം.", "ആർ.പി.-യോട് സംസാരിച്ചു. കാത്തിരിക്കാൻ അദ്ദേഹം പറഞ്ഞു. കംപ്ലയിൻസ് വിഭാഗം ഇത് പരിശോധിക്കും.", "വീണ്ടും ആർ.പി.-യെ വിളിച്ചു. തൽക്കാലം ഒന്നും എഴുതി നൽകേണ്ടെന്ന് അദ്ദേഹം പറഞ്ഞു.", "ആ കുറിപ്പുകളിലെ ചുരുക്കെഴുത്തുകൾ അവൾ പലയാവർത്തി വായിച്ചു - R.P.ജൂണിനും സെപ്തംബറിനും ഇടയിൽ ഏഴുതവണ ആ പേര് ഉപയോഗിച്ചതായി അവൾ കണ്ടെത്തി. ഓരോ തവണയും കാത്തിരിക്കുക എന്നർത്ഥം വരുന്ന ഒരു പദത്തോടൊപ്പമാണ് ആ പേര് ഉപയോഗിച്ചിരിക്കുന്നതെന്നും അവൾ അതിൽ നിന്ന് മനസ്സിലാക്കി. പലതിലും ആർ പി പറയുന്നത് ഇങ്ങനെയാണ്. കാത്തിരിക്കൂ, അത് ഓഡിറ്റിങ് ശേഷം, വിഷമിക്കേണ്ട കാര്യങ്ങൾ ഞാൻ കൈകാര്യമ് ചെയ്തോളാം. അങ്ങനെ ആ പേര് വരുന്നിടത്തെല്ലാം ഒരു കാര്യങ്ങളിലും തീരുമാനം ആവാത്ത പോലെ അവൾക് തോന്നി.", "ആ ഡയറിയിലെ അവസാനത്തെ കുറിപ്പ് സെപ്തംബർ 17ന് എഴുതിയതായിരുന്നു. അതാവട്ടെ ഒരൊറ്റ വരിയിൽ അവസാനിപ്പിച്ചിട്ടുമുണ്ട്.", "ആർ.പി. തെളിവ് ആവശ്യപ്പെട്ടിരിക്കുന്നു. നാളെത്തന്നെ വേണം.", "അതിന് ശേഷമുള്ള താളുകളെല്ലാം ശൂന്യമായിരുന്നു. അവൾ ബാക്കിയുള്ള പേജുകൾ വലതുകൈകൊണ്ട് ഓടിച്ച് നോക്കി. തീയതികൾ താളുകളിൽ മാറി മാറി വന്നു. അതിൽ ഒക്ടോബർ 9ന്, അവൾക് കഷ്ടിച്ച് തിരിച്ചറിയാൻ കഴിയുന്ന ഒരു കൈപ്പടയിൽ വളരെ ആഴത്തിൽ അമർത്തി എഴുതിയതിനാൽ പേപ്പർ കീറിപ്പോയി നിലയിൽ ഇങ്ങനെ കുറിച്ചിരുന്നു.", "ഓഫീസിൽ ഉണ്ടായിരുന്നതെല്ലാം അവർ കൊണ്ടുപോയിരിക്കുന്നു.", "അഞ്ജലി ഇരുന്നിടത്ത് നിന്ന് എഴുന്നേറ്റു. സോഫയിലേക് ചാഞ്ഞിരിക്കുമ്പോൾ കൈയ്യിലിരുന്ന ആ ഡയറിക്കൊപ്പം ആ തണുത്ത കാപ്പിയെടുത്ത് അവൾ ഒന്ന് രുചിച്ചു. അതിന്റെ കയ്പ്പ് അവളുടെ നാഡികളിലേക്ക് പുളഞ്ഞിറങ്ങിപ്പോയി.", "ആ ഡയറിക്കൊപ്പം തുരുമ്പിച്ച ഒരു ക്ലിപ്പുകൊണ്ട് ബന്ധിച്ച കുറച്ച് പേപ്പറുകൾ ഉണ്ടായിരുന്നു. അവരുടെ അച്ഛന്റെ വക്കീൽ നൽകിയ ഒരു ഫയലായിരുന്നു അത്. ആ ഒരു രേഖയെ കുറിച്ച് അമ്മയോട് ചോദിച്ചപ്പോഴെല്ലാം 'അമ്മ അത് നൽകാതെ സംസാരത്തിനിടയിൽ വിഷയം മാറ്റുമായിരുന്നു. പല തവണ അതിനായി ശ്രമിച്ചിരുന്നെങ്കിലും അതെവിടെയാണ് സൂക്ഷിച്ചിരുന്നതെന്നോ, എന്ത് ചെയ്തെന്നോ ഒരു സൂചനയും അവൾക് ലഭിച്ചിരുന്നില്ല. ഇപ്പോൾ തന്റെ മേശപ്പുറത്ത് ഓഫീസിൽ എത്തുന്ന ഏതൊരു റിപ്പോർട്ടും വായിക്കുന്നതുപോലെ, അഞ്ജലി ആ ഫയൽ ഓരോ പേജായി ഹാളിലെ സോഫയിലിരുന്ന് വായിച്ചു.", "2009 ഒക്ടോബറിൽ, കമ്പനിയുടെ മാനേജിംഗ് ഡയറക്ടർ നൽകിയ പരാതിയുടെ അടിസ്ഥാനത്തിൽ നഗരത്തിലെ സെൻട്രൽ ഡിവിഷനിലുള്ള ഒരു പോലീസ് സ്റ്റേഷനിൽ എഫ്.ഐ.ആർ (FIR) രജിസ്റ്റർ ചെയ്തു. വഞ്ചന, വിശ്വാസവഞ്ചന, വ്യാജരേഖ ചമയ്ക്കൽ എന്നീ കുറ്റങ്ങൾ ചുമത്തി, അവളുടെ പിതാവിനെ ഒന്നാം പ്രതിയായാണ് ഇതിൽ ഉൾപ്പെടുത്തിയിരുന്നത്. മറ്റുള്ളവരെ \"അന്വേഷണത്തിനിടയിൽ തിരിച്ചറിയേണ്ട മറ്റ് വ്യക്തികൾ\" എന്ന് മാത്രമാണ് രേഖപ്പെടുത്തിയിരുന്നത്. അവളുടെ പിതാവിനെ അറസ്റ്റ് ചെയ്യുകയും, രണ്ടുദിവസം ചോദ്യം ചെയ്ത ശേഷം ജാമ്യത്തിൽ വിടുകയും ചെയ്തു.", "ഒരു വർഷത്തിന് ശേഷമുള്ള ഒരു തീയതിയിൽ ആ വക്കീലിൽ നിന്ന് അവളുടെ അമ്മയ്ക്ക് വന്ന ഒരു കത്തും അതിൽ ഉണ്ടായിരുന്നു. വളരെ ശ്രദ്ധാപൂർവം തയ്യാറാക്കിയ സൗമ്യമായ ഭാഷയിലായിരുന്നു ആ കത്ത്. കുറ്റപത്രം സമർപ്പിക്കുന്നതിന് മുമ്പേ പ്രതി മരണപ്പെട്ടതിനാൽ അദ്ദേഹത്തിനെതിരായ നിയമനടപടികൾ അവസാനിച്ചുവെന്ന് അതിൽ വിശദീകരിച്ചിരുന്നു. അദ്ദേഹം ഒരു കുറ്റത്തിനും ശിക്ഷിക്കപ്പെട്ടിരുന്നുമില്ല, കുറ്റവിമുക്തനാക്കപ്പെട്ടിരുന്നുമില്ല. ചുരുക്കത്തിൽ വിചാരണ ചെയ്യാൻ ആരും അവശേഷിക്കാത്ത ഒരു കേസായി അത് മാറി.", "കത്തിന് പിന്നിൽ മറ്റൊരു കട്ടിംഗ് കൂടി പിൻ ചെയ്തു വെച്ചിരുന്നു; 2011-ലെ ഒരു പത്രവാർത്തയിൽ നിന്നുള്ള ഒരു ഭാഗമായിരുന്നു അത്.  കാവേരി കേസിൽ പോലീസ് അന്തിമ റിപ്പോർട്ട് സമർപ്പിച്ചു: കുറ്റകൃത്യങ്ങൾ നടന്നതായി സ്ഥിരീകരിച്ചെങ്കിലും, അതിന് ഉത്തരവാദികളായവരെ കണ്ടെത്താനായില്ല. പ്രതികളെ കണ്ടെത്താനാകാത്തതിനാൽ ആ കേസ് അവസാനിപ്പിച്ചതായി അന്വേഷണ സംഘം.", "ആ ഫയലിലെ അവസാന രേഖ പരാതിയോടൊപ്പമുള്ള ഒരു അനുബന്ധമായിരുന്നു. പണം കൈമാറ്റം ചെയ്യപ്പെട്ടു എന്ന് ആരോപിക്കപ്പെടുന്ന സ്ഥാപനങ്ങളുടെ പട്ടികയായിരുന്നു അത്. അതിൽ നാല് സ്ഥാപനങ്ങളായിരുന്നു ഉണ്ടായിരുന്നത്. ഓരോന്നിനും രജിസ്റ്റർ ചെയ്ത വിലാസവും ഡയറക്ടർമാരുടെ പട്ടികയും ഉണ്ടായിരുന്നു. അവൾ ആ പേജ് എടുത്ത് മുന്നിലെ സെന്റർ ടേബിളിലേക്ക് ഒന്നാഞ്ഞു. അവിടെയുണ്ടായിരുന്ന ഒരു പേന കയ്യിലെടുത്ത് ആ പേരുകൾക്കിടയിലൂടെ ഓടിച്ചു. അതിൽ നാലെണ്ണത്തിലെ മൂന്ന് കമ്പനിയിലും ഒരാളുടെ പേര് പൊതുവായതായിരുന്നു.", "എസ്. ഗൗഡ - മൂന്നിലും അതെ ആൾ തന്നെ.", "അവളുടെ അച്ഛൻ അത് പരിശോധിച്ചിരുന്നു എന്നവൾക്ക് ആ കുറിപ്പുകളിൽ നിന്ന് മനസ്സിലായി. അതിന് ശേഷം ഓഫീസിലെ ഫയലുകൾക്കായി ആരോ വരികയും ചെയ്തിട്ടുണ്ട്.", "ഔട്ടർ റിംഗ് റോഡിലുള്ള ഒരു ഗ്ലാസ് കെട്ടിടത്തിന്റെ നാലാം നിലയിലായിരുന്നു സൗത്ത്‌ലൈനിന്റെ ഓഫീസ്. ഒരു പ്ളേസ്മെന്റ് കൺസൾട്ടൻസിക്കും ഡെന്റൽ ക്ലിനിക്കിനും ഇടയിലായിരുന്നു ആ സ്ഥാപനം. ഉച്ചകഴിഞ്ഞ് രണ്ടുമണിയായപ്പോൾ, വിശപ്പില്ലാത്തവരായി അഭിനയിക്കുന്ന മുപ്പതോളം പേരുടെ സാന്നിധ്യം ആ ന്യൂസ് റൂമിൽ അസ്വസ്ഥമായ ഒരു ചലനം സൃഷ്ടിക്കുന്നുണ്ടായിരുന്നു.", "വിക്രം ഷേണായിയുടെ ക്യാബിനിൽ മാത്രമാണ് ഒരു വാതിലുണ്ടായിരുന്നത്. ആ വാതിൽ എപ്പോഴും തുറന്നിട്ടിരുന്നു. അമ്പത്തിയാറുകാരനായ അദ്ദേഹം മംഗളൂരു സ്വദേശിയാണ്. ഒരു ദേശീയ ദിനപത്രത്തിൽ ഇരുപത് വർഷം ജോലി ചെയ്ത ശേഷമാണ്, സുഖസൗകര്യങ്ങളോടെയും മാനേജ്‌മെന്റിന്റെ ചൊൽപ്പടികളിലും ജീവിക്കുന്നതിനേക്കാൾ, ദരിദ്രനായിരുന്നാലും ശരിയായ പക്ഷത്ത് നിൽക്കുന്നതാണ് നല്ലതെന്ന് അദ്ദേഹം തീരുമാനിച്ചത്. അങ്ങനെയാണ് 'സൗത്ത് ലൈൻ' എന്ന പത്രം പിറവിയെടുത്തത്. 'സൗത്ത്‌ലൈൻ' പ്രസിദ്ധീകരിക്കുന്ന ഓരോ അന്വേഷണാത്മക റിപ്പോർട്ടും അദ്ദേഹം രണ്ട് തവണ വായിക്കും. ഒരിക്കൽ ഒരു എഡിറ്റർ എന്ന നിലയിലും, മറ്റൊരിക്കൽ അദ്ദേഹം തന്നെ പറയാറുള്ളതുപോലെ ആ റിപ്പോർട്ടിൽ പരാമർശിക്കപ്പെടുന്ന വ്യക്തിയുടെ അഭിഭാഷകൻ എന്ന നിലയിലും.", "അഞ്ജലിയുടെ ഫോണിലെ വാട്സാപ്പ് മെസേജ് അയാൾ വായിച്ച് നോക്കി. ആ രണ്ട് ഫോട്ടോകളും അയാൾ പലയാവർത്തി പരിശോധിച്ചു. ശേഷം ഫോൺ മേശപ്പുറത്ത് കമിഴ്ത്തി വച്ചു. അയാൾ ഒരു നിമിഷം ചില്ല് ജനാലയിലൂടെ പുറത്തേക്ക് നോക്കി. ഒരു നിമിഷം നിശബ്ദനായി അയാൾ അഞ്ജലിയെ നോക്കി. അയാൾ 'വേണ്ട' എന്നാവും പറയുക എന്ന് അഞ്ജലിക്ക് തോന്നിയിരുന്നു.", "\"ഇതെന്താണെന്ന് പറയൂ \" - ആ നിശബ്ദത അവസാനിപ്പിച്ച് ഷേണായി പറഞ്ഞു.", "\"കാവേരി ഗ്ലോബൽ ട്രേഡേഴ്സിലെ ഒരു ലെഡ്ജർ പേജാണിത്, എൻ്റെ അച്ഛൻ ഒപ്പിട്ടത്. അദ്ദേഹത്തിനരികിൽ മറ്റൊരാളും ഒപ്പിട്ടിട്ടുണ്ട്. എന്നാൽ ഇത് അയച്ചവർ, ആ രണ്ടാമത്തെ ഒപ്പ് വെട്ടിമാറ്റിക്കളഞ്ഞിട്ടുണ്ട്.\"", "\"ആരാണ് അയച്ചത്?\"", "\"എനിക്കറിയില്ല, നമ്പർ സ്വിച്ച് ഓഫ് ആണ്.\"", "\"അതായത് അജ്ഞാതമായ ഒരു സോഴ്സിൽ നിന്ന് ലഭിച്ച വിവരം\" - അയാൾ കണ്ണട ഊരി മേശയിൽ വെച്ച് അവിടെയിരുന്നു ഒരു ഗ്ലാസ്സിൽ നിന്ന് അല്പം വെള്ളം കുടിച്ചു.", "\"അഞ്ജലി, അതൊരു സോഴ്‌സല്ല. ചൂണ്ടയാണത്.\"", "\"എന്ത് ചൂണ്ട\" - അവൾ സംശയത്തോടെ ഷേണായിയെ നോക്കി.", "\"ഇതിന്റെ ഒരു രീതി കണ്ട് എനിക്കങ്ങനെ തോന്നുന്നു. മറ്റെന്തെങ്കിലും വിവരങ്ങൾ?\"", "അഞജലി ഷേണായിയോട് ബാക്കി കാര്യങ്ങൾ വിവരിച്ചു. ഡയറിയെക്കുറിച്ചും, അതിൽ ആർ.പി.യെക്കുറിച്ച് എഴുതിയിരുന്ന ഏഴ് കുറിപ്പുകളെക്കുറിച്ചും, നാല് കയറ്റുമതി സ്ഥാപനങ്ങളിൽ മൂന്നെണ്ണത്തിലും പേരുള്ള ആ ഡയറക്ടറെക്കുറിച്ചും, ഒടുവിൽ പ്രതിയെ കണ്ടെത്താനാകാതെ അവസാനിപ്പിച്ച ആ കേസിനെക്കുറിച്ചും. ഒരു കഥ വിവരിക്കുന്നതുപോലെ, കൃത്യമായ ക്രമത്തിൽ, അനാവശ്യമായ വിശേഷണങ്ങളൊന്നും ചേർക്കാതെ, ഒട്ടും വൈകാരികതയില്ലാതെ അവൾ കാര്യങ്ങൾ നിരത്തി അവതരിപ്പിച്ചു.", "ഷേണായി അവളുടെ സംസാരത്തിനിടയിൽ ഒട്ടും തടസപ്പെടുത്താതെ എല്ലാം കേട്ടിരുന്നു. അവൾ പറഞ്ഞ് നിർത്തിയപ്പോൾ ഗ്ലാസിന് അപ്പുറമുള്ള ന്യൂസ്‌റൂമിലേക്ക് നോക്കിക്കൊണ്ട് അദ്ദേഹം കുറച്ചുനേരം നിശബ്ദനായി ഇരുന്നു.", "\"ഇതിനെക്കുറിച്ച് റിപ്പോർട്ട് ചെയ്യാൻ എനിക്ക് നിന്നെ അനുവദിക്കാനാവില്ലെന്ന് നിനക്കറിയാമല്ലോ\"", "\"ഞാൻ റിപ്പോർട്ട് ചെയ്യാൻ അനുവാദം ചോദിക്കുകയല്ല. റിപ്പോർട്ട് ചെയ്യാൻ തക്കതായ എന്തെങ്കിലും ഉണ്ടോ എന്ന് കണ്ടെത്താൻ കുറച്ച് സമയം ചോദിക്കുകയാണ്.\"", "\"ഇത് നിന്റെ അച്ഛനുമായി ബന്ധപ്പെട്ട കേസാണ്. ഒന്നാം പ്രതിയുടെ മകളാണ് നീ. ഈ വാർത്തയിൽ നിന്റെ പേര് കണ്ടാൽ, ഏതൊരു അഭിഭാഷകനും നിന്റെ കുടുംബപ്പേര് വായിക്കുന്നതോടെ വായന നിർത്തിക്കളയും.\"", "\"എന്നാൽ മറ്റാരെക്കൊണ്ടെങ്കിലും എഴുതിക്കാമല്ലോ\"", "\"എഴുതാൻ എന്തെങ്കിലും ഉണ്ടെങ്കിൽ\" - അയാൾ മറുപടി നൽകി", "അതൊട്ടും അഞ്ജലിക്ക് ഇഷ്ടപ്പെട്ടില്ല. എങ്കിലും അവൾ മറുത്തോരു മുഖഭാവം പോലും ഷേണായിയോട് കാണിച്ചില്ല. അയാൾ അവളോട് വീണ്ടും പറഞ്ഞു.", "\"ഇവിടെ എന്താണ് പുതിയതായിട്ടുള്ളത്? ഒരാൾ തന്റെ കമ്പനിയിൽ നടത്തിയ ഒരു സാമ്പത്തിക തട്ടിപ്പ്. അതാണെങ്കിൽ കണ്ടെത്താനാവാത്ത ഒരു കേസായി കണ്ട് കോടതി അവസാനിപ്പിച്ചു. പ്രതിയാണെങ്കിൽ മരണപ്പെടുകയും ചെയ്തു. ആ കമ്പനി നിലവിൽ പ്രവർത്തിക്കുന്നുമില്ല. നിയമനടപടികൾ സ്വീകരിക്കാൻ കഴിയുന്നവരാണെങ്കിൽ എല്ലാവരും ഒന്നുകിൽ മറിച്ച് പോയി, അല്ലെങ്കിൽ മറ്റെവിടെയോ വിസ്‌മൃതിയിൽ ആയി. അതുമല്ലെങ്കിൽ നമ്മൾക്കിപ്പോൾ തൊടാനാവാത്ത വിധം അതിസമ്പന്നരായിരിക്കാം.\"", "അവളെന്തോ പറയാനായി വന്നെങ്കിലും ഒന്നും പറഞ്ഞില്ല. അവൾക്കു വ്യക്തമായ ഒരു മറുപടിയോ ആ മറുപടിയെ സാധൂകരിക്കുന്ന തെളിവുകളോ അവളുടെ കയ്യിലില്ലായിരുന്നു. അത് അയാൾക്കും അറിയാമായിരുന്നു.", "\"നോക്കൂ അഞ്ജലി, എനിക്ക് തോന്നുന്നത് ഇതാണ്\"- അയാൾ അല്പം മൃദുവായ സ്വരത്തിൽ പറഞ്ഞു.", "\"ലോകത്തിൽ നിങ്ങൾക്ക് ഏറ്റവും ആവശ്യമുള്ളതെന്താണെന്ന് കൃത്യമായി അറിയാവുന്ന ഒരാളുണ്ട്. അവർ അതിന്റെ ഒരു ഭാഗം നിങ്ങൾക്ക് അയച്ചുതന്നു; ബാക്കി ഭാഗത്തിനായി നിങ്ങൾ വീണ്ടും വരുമെന്ന് ഉറപ്പാക്കാൻ പാകത്തിൽ അത് മുറിച്ചെടുത്തതുമാണ്. ഒരു വിസിൽ ബ്ലോവറും അങ്ങനെ ചെയ്യില്ല. അങ്ങനെയുള്ളവർ നിങ്ങൾക്ക് പൂർണമായ രേഖകളാണ് കൈമാറുക. അത് ഞാൻ അഞ്ജലിക്ക് പറഞ്ഞ് തരേണ്ട കാര്യമില്ലല്ലോ. എന്നാൽ ഇവിടെ ഇയാൾ നിനക്ക് നൽകിയിരിക്കുന്നത് ഒരു ചൂണ്ടക്കൊളുത്താണ്.\"", "\"ഒരുപക്ഷെ, അവർ ആരെയെങ്കിലും ഭയപ്പെടുന്നുണ്ടെങ്കിലോ?\" - അഞ്ജലി തന്റെ വാദം ഉറപ്പിക്കാനായി ചോദിച്ചു.", "\"ഉണ്ടാവാം. ഭയപെടുന്നവർക്കും, ഭയപ്പെടുത്തുന്നവർക്കും കാരണങ്ങൾ ഉണ്ടാവുമല്ലോ.\" ഷേണായി തന്റെ പേനയെടുത്ത് വിരലുകൾക്കിടയിൽ കറക്കി.", "\"അഞ്ജലി, വ്യക്തിപരമായ ഒരു പരാതിയോ, സംശയങ്ങളോ, അതൃപ്തികളോ ഒന്നും ഒരു വാർത്തയാവില്ല. ചിലപ്പോൾ അതെല്ലാം ഒരു കഥയായി മാറാം.\"", "അവൾ ഇരുന്നിടത്ത് നിന്ന് എഴുന്നേറ്റു.", "\"അപ്പോൾ വേണ്ട എന്നാണ് സാർ പറയുന്നതല്ലേ?\"", "\"വേണ്ട എന്നല്ല, ഇപ്പോൾ വേണ്ട എന്നാണ്\"", "അയാൾ തൊട്ടടുത്തിരുന്ന ഏതോ ഒരു മാഗസിൻ എടുത്ത് മറിച്ച് നോക്കി അവളുടെ മുഖത്ത് നോക്കാതെ പറഞ്ഞു - \"നിന്റെ പതിവ് ജോലികൾക്കു ഒരു മുടക്കവും വരാൻ പാടില്ല\"", "അവൾ പുറത്തേക്ക് നടക്കുമ്പോൾ അയാൾ വിളിച്ചു.", "\"ആ അഞ്ജലി, ഈ ആളിൽ നിന്നല്ലാതെ, മറ്റേതെങ്കിലും ഒരാളിൽ നിന്ന് ഇതുമായി ബന്ധപ്പെട്ട ഒരു സ്ഥിരീകരണം ലഭിക്കാതെ കാവേരിയെ കുറിച്ച് നീ ഒരു വാക്ക് പോലും പ്രസിദ്ധീകരിക്കാൻ പാടില്ല. പിന്നെ, ഇനി ഈ വ്യക്തി നിന്നെ വീണ്ടും ബന്ധപ്പെട്ടാൽ, അവരെ കാണുന്നതിന് മുൻപ് തന്നെ നീ എന്നോട് പറയണം. കണ്ടുകഴിഞ്ഞിട്ടല്ല.\"", "അഞ്ജലി ഒരിക്കലും പ്രതീക്ഷിച്ചതായിരുന്നില്ല ഷേണായിയുടെ ഈ തരത്തിലുള്ള ഒരു പ്രതികരണം. അവളുടെ മുഖത്ത് അതിന്റെ എല്ലാ നിരാശയം ഉണ്ടായിരുന്നു. അയാളുടെ ആ ആജ്ഞയ്ക്ക് മുന്നിൽ അവൾ തലയാട്ടി.", "വാതിൽക്കൽ എത്തിയപ്പോൾ അവൾ നിന്നു. \"സാർ, 2008-ൽ കാവേരിയുടെ ഓഫീസ് ഉദ്ഘാടനം ചെയ്തത് ശങ്കർ ദേവരാജാണ്.\"", "അയാൾ മാഗസിനിൽ നിന്ന് കണ്ണെടുത്തില്ല. പക്ഷേ കറക്കിക്കൊണ്ടിരുന്ന പേന നിശ്ചലമായി. \"ഈ സംസ്ഥാനത്തെ പകുതിയോളം എം.എൽ.എമാരും, പിന്നീട് പാപ്പരായ പലരുടെയും സ്ഥാപനങ്ങൾ ഉദ്ഘാടനം ചെയ്തിട്ടുണ്ട്. അതുകൊണ്ട് അതൊരു വാർത്തയെ അല്ല\"", "\"എനിക്കറിയാം, ഞാൻ പറഞ്ഞെന്നെ ഉള്ളൂ\"", "\"നല്ലത്\"- അയാൾ മാഗസിനിൽ നിന്ന് കണ്ണെടുത്ത് അഞ്ജലിയെ തലയുയർത്തി നോക്കി.", "എല്ലാ രാത്രിയിലെയും പോലെ, ടിവിയിലെ വാർത്ത സംപ്രേഷണം ചെയ്തുകൊണ്ടിരിക്കുമ്പോഴാണ് 'അമ്മ വിളിക്കുന്നത്.", "“നീ ഭക്ഷണം കഴിച്ചോ?”", "“കഴിച്ചു, അമ്മേ.”", "“എന്താ കഴിച്ചത്?”", "അഞ്ജലി കൗണ്ടറിൽ ഇരുന്ന പൊട്ടിക്കാത്ത ബ്രെഡ് പാക്കറ്റിലേക്ക് നോക്കി. എന്നിട്ട് കഴിക്കാത്ത ഏതോ ഒരു ഭക്ഷണത്തിന്റെ പേര് പറഞ്ഞു. മുപ്പത്തിയഞ്ച് വർഷമായിട്ടും ഒട്ടും മാറാത്ത, അവിശ്വാസം നിറഞ്ഞ ഒരു ചെറിയ ശബ്ദമുണ്ടാക്കിയ ശേഷം അമ്മ സംസാരം തുടർന്നു.", "“സ്ഥലം വാങ്ങുന്ന ആൾ വിളിച്ചിരുന്നു. രജിസ്ട്രേഷൻ നേരത്തെയാക്കിയിട്ടുണ്ട്. ഡിസംബറിന് പകരം അടുത്ത മാസം ഇരുപത്തിയെട്ടാം തീയതിക്കാണ് നോക്കിയിരിക്കുന്നത്. അതിന് ഒരാഴ്ച മുമ്പുതന്നെ വീട് ഒഴിഞ്ഞുകിട്ടണമെന്ന് അയാൾ പറഞ്ഞിട്ടുണ്ട്.”", "\"ആറാഴ്ച\" അഞ്ജലി പറഞ്ഞു.", "\"അതു മതി. അവിടെ കടലാസുകൾ അല്ലാതെ മറ്റൊന്നും ഇനി മാറ്റാനില്ലല്ലോ .\"", "\"ഞാൻ വായിച്ചുനോക്കാത്ത എട്ട് പെട്ടികൾ കൂടിയുണ്ട്.\"", "\"എന്നാ പിന്നെ അവ വായിക്കേണ്ട.\" അമ്മയുടെ ശബ്ദം ശാന്തമായിരുന്നു .", "\"അതെല്ലാം പഴയ പേപ്പർ വാങ്ങുന്ന ആർക്കെങ്കിലും കൊടുത്തേക്കൂ. അതിൽ വായിക്കാൻ ഇനിയെന്താ ഉള്ളത്? കുറെ പഴയ പേപ്പറും ബാങ്കിലെ ഇടപാടിന്റെ കടലാസും മാത്രമുണ്ടാവും. അച്ഛൻ എല്ലാം സൂക്ഷിച്ചുവെച്ചിരുന്നതാ. അദ്ദേഹത്തിന്റെ സ്വഭാവം നിനക്കറിയാമല്ലോ.\"", "\"ഞാൻ 2009 ലെ അച്ഛന്റെ ഡയറി കണ്ടു\"", "'അമ്മ അപ്പോൾ തൃശ്ശൂരിലെ ബസ് സമരത്തെ കുറിച്ച് ടിവിയിൽ കണ്ട വാർത്താതെ കുറിച്ച് സംസാരിച്ച് തുടങ്ങി.", "\"അമ്മേ?\" - അവൾ ഉറക്കെ വിളിച്ചു.", "“മോളെ, അച്ഛൻ ആരും കാണരുതെന്ന് വിചാരിച്ചതൊന്നും നീ തിരഞ്ഞു പോവണ്ട.”", "ആരും കാണരുതെന്ന് അച്ഛൻ ആഗ്രഹിക്കാത്തത് അന്വേഷിക്കരുത് എന്നാണ് 'അമ്മ വളരെ സൗമ്യമായി അവളോട് പറഞ്ഞത്. ആ സൗമ്യതയിലും ഒരു ഭയത്തിന്റെ തുടിപ്പ് അവൾക്ക് അനുഭവപ്പെട്ടു. പക്ഷെ, അമ്മയുടെ ആ മറുപടിയിൽ അവൾക് ദുഃഖമോ ആക്ഷേപമോ ഒന്നും തോന്നിയതുമില്ല.", "\"അമ്മെ, അച്ഛന്റെ ഡയറിയിൽ ആർ പി എന്ന വിളിക്കപ്പെടുന്ന ഒരാളെ പറ്റി എഴുതിയിട്ടുണ്ട്. അതും പലതവണ ആ പേര് പറയുന്നുണ്ട്. കമ്പനിയിലുള്ള ആരോ അച്ഛനോട് കാത്തിരിക്കാൻ പറയുന്നുണ്ട്. അതിനെ കുറിച്ച് എന്തെങ്കിലും അമ്മയ്ക്കറിയാമോ?\"", "\"എനിക്കതിനെ കുറിച്ചോന്നും അറിയില്ല മോളേ\"", "ആ മറുപടി ഒട്ടും വൈകാതെ, ഒരു നിമിഷം പോലും ആലോചിക്കാതെയാണ് വന്നത്. ഒരു പേര് ഓർത്തെടുക്കാൻ ശ്രമിക്കുമ്പോൾ പോലും അമ്മ പതിവായി പുറപ്പെടുവിക്കുന്ന 'മ്...' എന്ന ശബ്ദം പോലുമില്ലാതെ, വളരെ പെട്ടെന്നായിരുന്നു ആ മറുപടി വന്നത് എന്ന് അവൾ ശ്രദ്ധിച്ചു.", "ബസ് സമരം, അവളുടെ അമ്മായിയുടെ കാൽമുട്ടിന്റെ അവസ്ഥ, മെഡിക്കൽ കോളേജിൽ പ്രവേശനം ലഭിച്ച ഒരു ബന്ധുവിന്റെ മകൾ എന്നിങ്ങനെ മറ്റു പല കാര്യങ്ങളെക്കുറിച്ചും അവർ കുറച്ചു കൂടി നേരം സംസാരിച്ചു. പതിവുപോലെ, 'നന്നായി എന്തെങ്കിലും കഴിക്കണം' എന്ന് ഓർമ്മിപ്പിച്ചുകൊണ്ട്, ഒരു 'യാത്രാമൊഴി' പോലും പറയാതെ ആ സംഭാഷണം അവസാനിച്ചു.", "അതിനുശേഷം അഞ്ജലി ഏറെനേരം അടുക്കളയിലെ കൗണ്ടറിനു സമീപം ഇരുന്നു.", "പിന്നീട് അവൾ ഡ്രോയറിൽ നിന്ന് ഒരു നോട്ട്പാഡ് എടുത്ത്, പതിമൂന്ന് വർഷത്തെ ശീലമനുസരിച്ച്, 2009-ൽ സംഭവിച്ചതെന്താണെന്ന് അറിയാൻ സാധ്യതയുള്ളവരുടെ പേരുകൾ എഴുതിത്തുടങ്ങി.", "ആർ.പി. - കാത്തിരിക്കാൻ പറഞ്ഞു. തെളിവ് ആവശ്യപ്പെട്ടു.", "എസ്. ഗൗഡ - നാലിൽ മൂന്ന് സ്ഥാപനങ്ങളിലെയും ഡയറക്ടർ.", "ശങ്കർ ദേവരാജ് - ഉദ്ഘാടനം", "ഫോട്ടോ അയച്ച് തന്ന ആൾ", "അവൾ ആ പട്ടികയിലേക്ക് നോക്കി. നോട്ട്പാഡിന് അരികിലായി ഇരുന്ന ആ പഴയ മരത്തിന്റെ പെട്ടി അവൾ വീണ്ടും തുറന്ന് നോക്കി. അച്ഛന്റെ, ഓട്ടം നിലച്ച ആ പഴയ വാച്ചിലെ സൂചികൾ അപ്പോഴും നാലുമണിക്ക് ഇരുപത് മിനിറ്റ് കുറവുള്ള സമയത്താണ് നിന്നിരുന്നത്.", "ഒരു നിമിഷം നോക്കിയിരുന്ന ശേഷം, അവൾ വീണ്ടും പേന എടുത്ത് പേജിന്റെ താഴെയായി ഒരു പേര് കൂടി ചേർത്തു.", "'അമ്മ!"], "isNew": false}, {"label": "അദ്ധ്യായം 3", "title": "അദ്ധ്യായം 3", "paras": ["നാലു ദിവസങ്ങൾ പിന്നിട്ടു. പ്രത്യേകിച്ച് ഒന്നും തന്നെ സംഭവിച്ചില്ല.", "ആ നമ്പർ സ്വിച്ച് ഓഫ് ചെയ്ത നിലയിൽ തന്നെ തുടർന്നു. അഞ്ജലി ബാക്കിയുണ്ടായിരുന്ന എട്ട് പെട്ടികൾ കൂടി പരിശോധിച്ചു. അതിൽ ബാങ്ക് സ്റ്റേറ്റ്‌മെന്റുകൾ, ഇൻഷുറൻസ് രേഖകൾ, സ്വന്തം സ്കൂൾ സർട്ടിഫിക്കറ്റുകൾ, അമ്മയുടെ കൈപ്പടയിൽ എല്ലാ ഏകാദശി ദിവസങ്ങളും വട്ടമിട്ട് അടയാളപ്പെടുത്തിയ 1998-ലെ ഒരു മലയാളം കലണ്ടർ എന്നിവ കണ്ടെത്തി. എന്നാൽ 'കാവേരി ഗ്ലോബൽ ട്രേഡേഴ്സി'നെക്കുറിച്ച് യാതൊരു വിവരവും ലഭിച്ചില്ല. അഞ്ജലി പതിയെ തന്റെ ദൈനംദിന ജീവിതത്തിരക്കിലേക്ക് കടന്നു. അതിനിടെ ബെല്ലന്ദൂരിലെ ഒരു തടാക കൈയേറ്റത്തെക്കുറിച്ചും, ഡെങ്കിപ്പനി പരിശോധനകൾക്ക് അമിത നിരക്ക് ഈടാക്കുന്ന ഒരു ആശുപത്രിയെക്കുറിച്ചും അവർ വാർത്തകൾ ചെയ്തു.", "ഓരോ ദിവസങ്ങളിലെ രാത്രികളിലും ചുവരിലെ ബോർഡിൽ പതിച്ച് വച്ചിരുന്ന ആ നോട്ട് പാഡിൽ രേഖപ്പെടുത്തിയ പേരുകളിലേക്ക് അവൾ നോക്കും.", "അമ്മയുടെ പേര് ഇപ്പോഴും വെട്ടിമാറ്റപ്പെടാതെ അതിൽ തന്നെയുണ്ട്.", "അന്നൊരു ബുധനാഴ്‌ച ആയിരുന്നു. ആ ദിവസം വീണ്ടും മഴ പെയ്തു. ഔട്ടർ റിംഗ് റോഡിനെ ബ്രേക്ക് ലൈറ്റുകളുടെ ഒരു നദിയാക്കി മാറ്റിയ, ഉച്ചകഴിഞ്ഞുള്ള കനത്ത മഴ. മൂന്നു മണിയായപ്പോഴേക്കും ന്യൂസ്‌റൂമിലെ ജനാലകൾ കനത്ത മഴത്തുള്ളികളാൽ വെളുത്തുപോയി, അവയ്ക്കപ്പുറമുള്ള നഗരം അപ്രത്യക്ഷമാവുകയും ചെയ്തു.", "ഡിജിറ്റൽ ഡെസ്കിൽ നിന്നുള്ള രോഹൻ തന്റെ ലാപ്ടോപ്പ് തുറന്നുപിടിച്ചുകൊണ്ട് അഞ്ജലിയുടെ അരികിലേക്ക് വന്നു. എന്തെങ്കിലും ആവശ്യമുണ്ടെങ്കിൽ മാത്രമേ അവൻ അങ്ങനെ ചെയ്യാറുള്ളൂ.", "\"കഴിഞ്ഞ വർഷം ക്രിപ്‌റ്റോ ട്രേഡിംഗ് തട്ടിപ്പുകളെക്കുറിച്ച് നിങ്ങൾ ഒരു ലേഖനം എഴുതിയിരുന്നല്ലോ\" അവൻ പറഞ്ഞു.", "\"ടെലിഗ്രാം ഗ്രൂപ്പുകളെക്കുറിച്ച്.\"- അഞ്ജലി തിരുത്തി.", "\"രണ്ടു വർഷം മുമ്പ്.\"", "\"ദുബായ് പോലീസ് ഒരു പ്രസ്താവന പുറത്തിറക്കിയിട്ടുണ്ട്. അറസ്റ്റിലായവരിൽ ഇന്ത്യക്കാരുമുണ്ട്. വൈകുന്നേരം ആറ് മണിക്കുള്ളിൽ, ഇതിലെ ഇന്ത്യൻ ബന്ധത്തെക്കുറിച്ച് വിശദീകരിക്കുന്ന ഒരു കുറിപ്പ് തയ്യാറാക്കണമെന്ന് ഷേണായി സാർ ആവശ്യപ്പെട്ടിട്ടുണ്ട്. എന്നാൽ ഇതിൽ ഉപയോഗിച്ചിരിക്കുന്ന പല വാക്കുകളുടെയും അർത്ഥം എനിക്ക് മനസ്സിലാകുന്നില്ല.\"", "അതും പറഞ്ഞ് അവൻ അവളുടെ മേശപ്പുറത്ത് ലാപ്ടോപ്പ് വെച്ചു.", "ഒരു മിനിറ്റിലധികം ദൈർഘ്യമുള്ള ഒരു വീഡിയോ ക്ലിപ്പ് ആയിരുന്നു അത്. ദുബായ് പോലീസ് പ്രസ് റിലീസ് ആയി പുറത്ത് വിട്ട വീഡിയോ. ചില്ലുഗോപുരങ്ങൾക്കിടയിൽ ചുവപ്പും നീലയും പടർന്ന് കയറുന്ന പോലീസ് ബീക്കണിന്റെ പ്രകാശം അതിൽ കാണാം. അരികിൽ ഹെഡ്‌ലൈറ്റുകൾ കൊണ്ട് അലങ്കരിച്ച ഒരു ഹൈവേ. ഒരു റെസിഡൻഷ്യൽ കെട്ടിടത്തിന് പുറത്തുള്ള പോലീസ് വാഹനങ്ങളിലേക്ക്, യൂണിഫോമിലുള്ള ഉദ്യോഗസ്ഥർ മങ്ങിയ മുഖങ്ങളുള്ള ആളുകളെ ഒരു വാനിലേക്ക് കയറ്റുന്നത് അതിൽ കാണാം. പിടിച്ചെടുത്ത ഫോണുകളും ലാപ്‌ടോപ്പുകളുമെല്ലാം ഒരു മേശയ്ക്ക് മുകളിൽ ലേബലുകൾ പതിച്ച് വച്ചിരിക്കുന്നു. മറ്റെന്തൊക്കെയോ തെളിവുകൾ ആ മേശയ്ക്ക് മുകളിൽ കാണുന്ന ബാഗിലും ഉണ്ട്.", "തനിക്ക് പിന്നിലെ ജനാലയിൽ പതിക്കുന്ന ബാംഗ്ലൂരിലെ മഴയുടെ ശബ്ദത്തിനിടയിൽ അഞ്ജലി അത് നോക്കിനിന്നു. വിചിത്രമായ ഒരു നിമിഷത്തിൽ, ആ രണ്ട് നഗരങ്ങളും തമ്മിൽ ലയിച്ചുചേരുന്നതുപോലെ തോന്നി. ഇവിടെ ജനാലച്ചില്ലിലെ വെള്ളത്തുള്ളികളും, അവിടെ ഉയർന്നുനിൽക്കുന്ന ഗ്ലാസ് കെട്ടിടങ്ങളും - രണ്ടിടത്തും നിറഞ്ഞുനിന്ന പ്രകാശം. അവയ്ക്കുള്ളിൽ എന്താണ് സംഭവിക്കുന്നതെന്ന് ഒട്ടും അവൾക്ക് വെളിപ്പെടുന്നുണ്ടായിരുന്നില്ല.", "വീഡിയോയെ അപേക്ഷിച്ച് എഴുതി നൽകിയ പ്രസ്താവനയുടെ ദൈർഘ്യം കുറവായിരുന്നു. ദുബായ് നഗരത്തിലെ വിവിധയിടങ്ങളിൽ പ്രവർത്തിച്ചിരുന്നതും, ഓൺലൈൻ തട്ടിപ്പിലും കള്ളപ്പണം വെളുപ്പിക്കലിലും ഏർപ്പെട്ടിരുന്നതുമായ ഒരു കുറ്റവാളി സംഘത്തെ ദുബായ് പോലീസ് പിടികൂടി. ഡിജിറ്റൽ ആസ്തികളിൽ നിക്ഷേപം നടത്തിയിരുന്ന ഒരാളെ തട്ടിക്കൊണ്ടുപോയി കൊലപ്പെടുത്തിയ ശേഷം അയാളുടെ ആസ്തികൾ കൈക്കലാക്കാൻ ഈ സംഘം പദ്ധതിയിട്ടിരുന്നതായി ആരോപണമുണ്ട്. പിടിയിലായവർ വിവിധ രാജ്യങ്ങളിൽ നിന്നുള്ളവരാണ്. അന്വേഷണം തുടരുകയാണെന്നും, കേസ് പബ്ലിക് പ്രോസിക്യൂഷന് കൈമാറുമെന്നും അധികൃതർ അറിയിച്ചു.", "അറസ്റ്റിലായവരുടെ എണ്ണം ആ പ്രസ്താവനയിൽ ഉണ്ടായിരുന്നു. വൈകുന്നേരമായപ്പോഴേക്കും ഗൾഫ് പത്രങ്ങൾ ആ സംഖ്യ തങ്ങളുടെ തലക്കെട്ടുകളിൽ ഉൾപ്പെടുത്തിക്കഴിഞ്ഞിരുന്നു. ഇന്ത്യൻ ചാനലുകളാകട്ടെ, അതിനെ ഏകദേശ കണക്കിലേക്ക് മാറ്റി \"രണ്ടു ഡസനിലധികം\" എന്ന് വിശേഷിപ്പിച്ചു. എന്നാൽ, നിക്ഷേപകന് എന്ത് സംഭവിച്ചു എന്ന് പറയാൻ ആർക്കും കഴിഞ്ഞില്ല. അദ്ദേഹം എവിടെയാണെന്നതിനെക്കുറിച്ച് പോലീസ് പ്രസ്താവനയിൽ ഒട്ടും പരാമർശിച്ചിരുന്നുമില്ല.", "\"അപ്പോൾ\" രോഹൻ ചോദിച്ചു, \"എന്താണ് ഒരു ഡിജിറ്റൽ അസറ്റ്?\"", "അവൾ മൂന്ന് വാക്യങ്ങളിലൂടെ അത് അവന് വിശദീകരിച്ചുകൊടുക്കുകയും, ഇന്ത്യൻ കോൺസുലേറ്റിൽ ചോദിക്കേണ്ട ചോദ്യങ്ങളുടെ ഒരു പട്ടിക എഴുതി നൽകുകയും ചെയ്തു.", "എട്ടു മണിയായപ്പോഴേക്കും ന്യൂസ്‌റൂമിൽ രാത്രി ഷിഫ്റ്റിലുള്ളവർ മാത്രമായി. മഴ നേർത്ത ചാറ്റൽമഴയായി മാറി. അഞ്ജലി തന്റെ ഡെസ്കിൽത്തന്നെ ഇരുന്നു. കീബോർഡിനരികിൽ, വെൻഡിംഗ് മെഷീനിൽ നിന്നെടുത്ത ഒരു കപ്പ് കാപ്പി തണുത്തുറയുന്നുണ്ടായിരുന്നു. അവളുടെ അച്ഛന്റെ ശീലത്തെ ഓർമ്മിപ്പിക്കുന്ന അതേ കാഴ്ച.", "രോഹൻ പറഞ്ഞ വാർത്തയുടെ വിവരങ്ങൾ അപ്പോഴേക്കും പലയിടത്തായി പ്രസിദ്ധീകരിച്ചത് അവൾ കണ്ടു. പോലീസ് ആരുടെയും പേര് വെളിപ്പെടുത്തിയിരുന്നില്ല. എമിറേറ്റ്‌സിൽ ഇതൊരു സാധാരണ കാര്യമാണ്. അവിടെ സംശയിക്കപ്പെടുന്നവരെ തിരിച്ചറിയുന്നത് അവരുടെ പേരിന്റെ ആദ്യാക്ഷരങ്ങളും പൗരത്വവും മാത്രം സൂചിപ്പിച്ചുകൊണ്ടായിരിക്കും. അതും പലപ്പോഴും അങ്ങനെ പോലും ചെയ്യാറില്ല. എന്നാൽ ഔദ്യോഗിക പ്രസ്താവനകളേക്കാൾ വേഗത്തിൽ വാർത്തകൾ പ്രചരിക്കും എന്നതുകൊണ്ട്, ഒമ്പത് മണിയായപ്പോഴേക്കും ഗൾഫ് മേഖലയിലെ ഒരു ബിസിനസ് വെബ്‌സൈറ്റ്, പോലീസ് വെളിപ്പെടുത്താതിരുന്ന വിവരങ്ങൾ പുറത്തുവിട്ടു. \"വിഷയവുമായി ബന്ധപ്പെട്ട വൃത്തങ്ങളെ\" ഉദ്ധരിച്ചുകൊണ്ട്, ആക്രമണത്തിന് ലക്ഷ്യമിട്ട വ്യക്തി 48 വയസ്സുകാരനായ ഒരു നിക്ഷേപകനാണെന്നും, ദുബായിലെ ഫ്രീ സോണുകളിലൊന്നിൽ പ്രവർത്തിക്കുന്ന ഒരു ഡിജിറ്റൽ-അസറ്റ് ഫണ്ടിന്റെ സ്ഥാപക പങ്കാളിയാണെന്നും അവർ റിപ്പോർട്ട് ചെയ്തു. അദ്ദേഹത്തിന്റെ പേര് വെളിപ്പെടുത്തിയില്ലെങ്കിലും, അദ്ദേഹം നേതൃത്വം നൽകുന്ന ഫണ്ടിന്റെ പേര് അതിൽ നൽകിയിരുന്നു.", "അഞ്ജലി ആ ഫണ്ടിനെക്കുറിച്ച് അന്വേഷിച്ചു. കഴിഞ്ഞ ആഴ്ചയ്ക്കുള്ളിൽ എപ്പോഴോ അതിന്റെ വെബ്‌സൈറ്റ് നീക്കം ചെയ്യപ്പെട്ടിരുന്നു എന്നവൾക്ക് മനസ്സിലാക്കാനായി. എന്നാൽ ഇന്റർനെറ്റിൽ ഒന്നും പൂർണ്ണമായി മാഞ്ഞുപോകില്ലല്ലോ. ഹോംപേജിന്റെ ഒരു പഴയ പതിപ്പ് (ആർക്കൈവ് ചെയ്ത പകർപ്പ്) അവിടെത്തന്നെയുണ്ടായിരുന്നു. നഗരദൃശ്യവും, \"മൂല്യത്തിന്റെ ഭാവി\" (the future of value) എന്നതിനെക്കുറിച്ചുള്ള ഒരു സ്ലോഗനും, പങ്കാളികളുടെ വിവരങ്ങൾ അടങ്ങിയ ഒരു പേജും അതിലുണ്ടായിരുന്നു. അതിലെ പങ്കാളികളുടെ ലോഗോകളിൽ മിക്കതും അവൾക്ക് പരിചിതമായിരുന്നില്ല. എന്നാൽ ഒരെണ്ണം മാത്രം അവൾക്ക് നേരിയ തോതിൽ പരിചിതമായി തോന്നി, എന്തുകൊണ്ടെന്നാൽ അവൾക്ക് കൃത്യമായി പറയാൻ കഴിഞ്ഞില്ലെങ്കിലും.", "‘ഹേമാവതി ക്യാപിറ്റൽ FZ-LLC.’", "അവൾ അതിനെക്കുറിച്ചും അന്വേഷിച്ചു. എന്നാൽ വളരെ കുറച്ചു വിവരങ്ങൾ മാത്രമേ കണ്ടെത്താനായുള്ളൂ. ഹേമാവതി ക്യാപിറ്റലിന് സ്വന്തമായി വെബ്‌സൈറ്റ് ഉണ്ടായിരുന്നില്ല. പണം നൽകി വാർത്തകൾ പ്രസിദ്ധീകരിക്കുന്ന ഒരു പ്ലാറ്റ്‌ഫോമിൽ വന്ന, രണ്ട് വർഷം പഴക്കമുള്ള ഒരു പത്രക്കുറിപ്പ് മാത്രമാണ് ഉണ്ടായിരുന്നത്. നിക്ഷേപകന്റെ ഫണ്ടുമായുള്ള ഒരു സ്ട്രാറ്റജിക് പാർട്ണർഷിപ്പിനെ കുറിച്ചായിരുന്നു ആ വാർത്ത. ഇത്തരം പത്രക്കുറിപ്പുകൾ പ്രസിദ്ധീകരിക്കാൻ ഏതാനും ഡോളറുകൾ ചെലവാകും, എന്നാൽ ആരും അവ വായിക്കാറുമില്ല. ഹേമാവതിയുടെ മാനേജിംഗ് പാർട്ണറുടെ ഒരു ഉദ്ധരണിയോടെയാണ് ആ കുറിപ്പ് അവസാനിക്കുന്നത്. സഹകരണത്തെയും വിശ്വാസത്തെയും കുറിച്ചുള്ള പതിവ് വരികളായിരുന്നു അത്.", "മാനേജിംഗ് പാർട്ണറുടെ പേര് സന്തോഷ് ഗൗഡ എന്നായിരുന്നു.", "അഞ്ജലി ഒരു നിമിഷം അനങ്ങാതെ ഇരുന്നു. പെട്ടെന്ന് എന്തോ ഓർമ്മ വന്ന പോലെ അവൾ തന്റെ മേശയ്ക്ക് താഴെ എന്തോ പരതി.", "മേശയുടെ വലിപ്പിൽ നിന്ന് അവൾ കുറച്ച് കടലാസുകൾ പുറത്തേക്കെടുത്തു. അതിൽ അച്ഛന്റെ അഭിഭാഷകന്റെ ഫയലിൽ നിന്ന് ലഭിച്ച രേഖകളുടെ പകർപ്പുകളായിരുന്നു. 2009-ൽ 'കാവേരി ഗ്ലോബൽ ട്രേഡേഴ്സി'ൽ നിന്ന് മുപ്പത്തിയെട്ട് കോടി രൂപ കൈമാറ്റം ചെയ്യപ്പെട്ടതായി ആരോപിക്കപ്പെടുന്ന നാല് കയറ്റുമതി സ്ഥാപനങ്ങളുടെ പട്ടിക, അതായത് ആ അനുബന്ധ രേഖ അവൾ തനിക്ക് മുന്നിലേക്കെടുത്ത് വച്ചു. അതിലെ ഡയറക്ടർമാരുടെ പേരുകൾ അവൾ ഒരാവർത്തി കൂടി വായിച്ചു. 'എസ്. ഗൗഡ' എന്ന പേരിന് താഴെ അവൾ മൂന്നുതവണ വരയിട്ടിരുന്നു. എന്നാൽ സ്ഥാപനങ്ങളുടെ പേരുകളിൽ അവൾ ഒട്ടും തന്നെ ശ്രദ്ധ കൊടുത്തിട്ടില്ലായിരുന്നു.", "പട്ടികയിലെ രണ്ടാമത്തെ സ്ഥാപനം ഹേമാവതി എക്സ്‌പോർട്ട്സ് പ്രൈവറ്റ് ലിമിറ്റഡ് ആയിരുന്നു.", "ഒരു നിശ്വാസം അവളെ കടന്ന് പോയി.", "എന്നിട്ട്, ഏതൊരു ജൂനിയർ റിപ്പോർട്ടറോടും ചെയ്യാൻ ഉപദേശിക്കുമായിരുന്ന കാര്യം അവൾ തന്നെ ചെയ്തു. തന്റെ നിഗമനം തെറ്റാണെന്ന് തെളിയിക്കാൻ അവൾ അവളോട് തന്നെ പറഞ്ഞു.", "കർണാടകയിൽ ഏറ്റവും സാധാരണയായി കണ്ടുവരുന്ന കുടുംബപ്പേരുകളിലൊന്നായിരുന്നു 'ഗൗഡ'. ബാംഗ്ലൂരിൽ മാത്രം ഇത്തരത്തിൽ ആയിരക്കണക്കിന് ആളുകളുണ്ടാകും. ഗൾഫ് നാടുകളിൽ നൂറുകണക്കിനു പേരും. കാവേരി നദിയുടെ പോഷകനദിയായ ഹേമാവതി എന്ന പേര് ഒരു അണക്കെട്ടിനും, ഡസനോളം സ്കൂളുകൾക്കും, ഒരു ബസ് കമ്പനിക്കും, ഒരുപക്ഷേ ഹാസ്സൻ ജില്ലയിൽ ജനിച്ച നൂറോളം സ്ത്രീകൾക്കും ഈ പേര് കാണാം.", "അഞ്ജലി ഉടൻ തന്നെ ഇന്ത്യൻ ഗവൺമെന്റിന്റെ കമ്പനി രജിസ്ട്രി തുറന്ന് 'ഹേമാവതി എക്സ്‌പോർട്‌സ്' എന്ന കമ്പനിക്കായി തിരഞ്ഞു. കാവേരിയെ പോലെ തന്നെ ഈ കമ്പനിയും 2012-ൽ രജിസ്ട്രിയിൽ നിന്ന് നീക്കം ചെയ്യപ്പെട്ടിരുന്നു എന്ന് അവൾക്ക് മനസ്സിലായി. കമ്പനിയുടെ മുൻ ഡയറക്ടർമാരുടെ മുഴുവൻ പേരുകളും അവരുടെ 'ഡയറക്ടർ ഐഡന്റിഫിക്കേഷൻ നമ്പറുകളും' (DIN) ആ രജിസ്ട്രിയിൽ കൃത്യമായി രേഖപെടുത്തിയിട്ടുണ്ട്. 2009-ലെ 'എസ്. ഗൗഡ' എന്നത് സിദ്ധരാജു ഗൗഡ എന്നാണെന്ന് അതിൽ നിന്ന് അഞ്ജലി മനസിലാക്കി.", "അപ്പോൾ അത് ആ ഒരേ വ്യക്തിയായിരുന്നില്ല. അംഞ്ജലിയ്ക്ക് ഒരല്പം ആശ്വാസമായി.", "അവൾ സിദ്ധരാജു ഗൗഡയെക്കുറിച്ച് അന്വേഷിച്ചെങ്കിലും കാര്യമായൊന്നും കണ്ടെത്താനായില്ല. അതൊരു സാധാരണ പേരായിരുന്നു. ഒപ്പം ഫോട്ടോയോ പ്രൊഫൈലോ, നിലവിൽ സജീവമായ മറ്റ് ഡയറക്ടർ സ്ഥാനങ്ങളോ ഒന്നും തന്നെ ഉണ്ടായിരുന്നില്ല. അവൾ 'സന്തോഷ് ഗൗഡ', 'ദുബായ്' എന്നീ വാക്കുകൾ ഉപയോഗിച്ച് തിരഞ്ഞപ്പോൾ, ഒരു പ്രൊഫഷണൽ നെറ്റ്‌വർക്കിംഗ് സൈറ്റിൽ ഒരു പ്രൊഫൈൽ കണ്ടെത്തി. അതിലും ഫോട്ടോ ഉണ്ടായിരുന്നില്ല, ആകെ രണ്ട് കണക്ഷനുകൾ മാത്രമാണുണ്ടായിരുന്നത്. അദ്ദേഹം മൈസൂരിൽ കൊമേഴ്‌സ് പഠിച്ചിരുന്നു എന്ന് അതിൽ പറയുന്നുണ്ടായിരുന്നു എങ്കിലും അദ്ദേഹം എപ്പോഴാണ് പഠിച്ചത്, എവിടെയാണ് ജനിച്ചത്, അല്ലെങ്കിൽ അദ്ദേഹത്തിന്റെ പിതാവ് ആരാണ് എന്നൊന്നും അതിൽ വ്യക്തമാക്കിയിരുന്നില്ല.", "അഞ്ജലി കസേരയിലേക് ഒന്ന് ചാരിയിരുന്നു.", "ഒരു പേര് എന്നത് യാദൃശ്ചികമാകാം. എന്നാൽ രണ്ട് പേരുകൾ ഒരു പ്രത്യേക ക്രമത്തെ സൂചിപ്പിക്കുന്നു. 2009-ൽ അവളുടെ പിതാവിന്റെ കമ്പനിയിൽ നിന്ന് പണം പുറത്തേക്ക് പോകാൻ കാരണമായ ഒരു കമ്പനിയുടെ പേരും ഒരു കുടുംബപ്പേരും, പതിനേഴ് വർഷങ്ങൾക്ക് ശേഷം ദുബായിൽ വീണ്ടും പ്രത്യക്ഷപ്പെട്ടിരിക്കുന്നു. അതും ആരെങ്കിലും വധിക്കാൻ പദ്ധതിയിട്ടിരുന്ന ഒരാളുടെ അരികിൽ!", "അഞ്ജലി തന്റെ ലാപ്ടോപ് എടുത്ത് ഒരു മെയിൽ ഡ്രാഫ്ട് ചെയ്തു. അതീവ ശ്രദ്ധയോടെ തന്റെ സംശയങ്ങൾ സ്ഥിരീകരിക്കപ്പെടുന്നതിനായി അവൾ ഓരോ ചോദ്യങ്ങളും കൃത്യതയോടെ ചോദിക്കാൻ തുടങ്ങി.", "ദുബായ് പോലീസിന്റെ മീഡിയ ഓഫീസിലേക്കും, അവിടെ തന്റെ പരിചയത്തിലുള്ള ഒരാൾക്കും അവൾ ഒരു മെയിൽ അയച്ചു. അതിൽ ലക്ഷ്യമിടപ്പെട്ട നിക്ഷേപകന്റെ ഫണ്ടിന്റെ പേര് സ്ഥിരീകരിക്കാമോ എന്നും, അദ്ദേഹം സുരക്ഷിതനാണോ എന്നും അന്വേഷിച്ചു. ആർക്കൈവ് ചെയ്ത വെബ്‌സൈറ്റിൽ നിന്ന് ലഭ്യമായ ഒരു വിലാസം ഉപയോഗിച്ച് ആ ഫണ്ട് ഹൌസിലേക്കും അവൾ ഒരു സന്ദേശം അയച്ചു. കൂടാതെ പത്രക്കുറിപ്പിൽ നൽകിയിരുന്ന വിലാസം വഴി 'ഹേമാവതി ക്യാപിറ്റലി'നും ഒരു സന്ദേശം അവൾ എഴുതി - ബംഗളൂരുവിലെ 'ഹേമാവതി എക്‌സ്‌പോർട്ട്‌സു'മായി ഈ സ്ഥാപനത്തിന് എന്തെങ്കിലും ബന്ധമുണ്ടോ എന്നും, ഇക്കാര്യത്തിൽ പ്രതികരിക്കാൻ സന്തോഷ് ഗൗഡയെ കണക്ട് ചെയ്യാൻ കഴിയുമോ എന്നും അവൾ അന്വേഷിച്ചു.", "ദുബായ് പോലീസ് ഓഫീസസിൽ നിന്നും ഒരു മിനിറ്റിനുള്ളിൽത്തന്നെ ഒരു ഓട്ടോമാറ്റിക് അക്‌നോളഡ്ജ്‌മെന്റ് മെസേജ് അവൾക് ലഭിച്ചു.", "ഫണ്ട് ഹൌസിലേക്കയച്ച മെയിൽ, ആ മെയിൽ ഐഡി നിലവിലില്ലാത്തതിനാൽ അവൾക് തന്നെ തിരിച്ച് വന്നു.", "ഹേമാവതി ക്യാപിറ്റലിലേക്കയച്ച ഇമെയിൽ കൃത്യമായി ഡെലിവെർഡ് ആയെങ്കിലും, അവൾക്കതിൽ യാതൊരു മറുപടിയും ലഭിച്ചില്ല.", "രാത്രി ഏറെ വൈകും മുമ്പ് തന്നെ അവൾ ഒരു ഓട്ടോയിൽ വീട്ടിലേക്ക് തിരിച്ചു. റോഡിൽ വെള്ളക്കെട്ടുണ്ടായതുകൊണ്ട് കാർ എടുക്കാൻ അവൽ മടിച്ചിരുന്നു. ഓട്ടോയിൽ ഡ്രൈവർ നാഗുവേ നയനാ എന്ന ഇളയരാജയുടെ ഒരു പഴയ മെലഡി ഗാനം കുറഞ്ഞ ശബ്ദത്തിൽ വെച്ചിരുന്നു. നനഞ്ഞ റോഡുകളിൽ തെരുവ് വിളക്കുകളുടെ പ്രകാശം പ്രതിഫലിച്ച്, സ്വർണ്ണനിറത്തിലുള്ള നീണ്ട വരകളായി കാണപ്പെട്ടു. അഞ്ജലി തന്റെ മടിയിലിരിക്കുന്ന ബാഗിന് അഭിമുഖമായി ഫോൺ പിടിച്ചിട്ടുണ്ട്. ഫോണിലേക്ക് നോക്കാൻ അവൾക് മടിയായിരുന്നു. കാരണം, അതിലേക് നോക്കിയാൽ താൻ വീണ്ടും പഴയ ആ കാര്യങ്ങളുടെ ലൂപ്പിലേക് മടങ്ങുമെന്ന് അവൾക്ക് ഉറപ്പായിരുന്നു.", "അവൾ തന്റെ ഫ്‌ളാറ്റിന്റെ മുന്നിലിറങ്ങി, ഡ്രൈവർക്ക് പണം നൽകി. അപ്പോഴാണ് അവളുടെ ഫോൺ വൈബ്രെട് ചെയ്തത്.", "ഫോൺ എടുത്ത് നോക്കിയപ്പോൾ ആ തണുപ്പിലും ഒരു ചൂട് അവളെ തലോടിക്കൊണ്ട് കടന്ന് പോയി. അവളും ആ ഒരു സന്ദേശത്തിനായി തന്നെ കാത്തിരിക്കുകയായിരുന്നു. പേരോ, പ്രൊഫൈൽ ചിത്രമോ ഇല്ലാത്ത അതെ നമ്പർ, നാല് ദിവസത്തെ നിശബ്ദതയ്ക്ക് ശേഷം അത് വീണ്ടും സജീവമായിരിക്കുന്നു. അവൾ ആ മെസേജ് തുറക്കാതെ വന്ന മെസേജിന്റെ പ്രിവ്യു വായിച്ചു.", "'ഞാൻ നിനക്ക് എഴുതിയത് എന്തിനാണെന്ന് ഇപ്പോൾ നിനക്ക് മനസ്സിലായിക്കാണുമല്ലോ.'", "കെട്ടിടത്തിന്റെ, വെള്ളം ഇറ്റുവീഴുന്ന പോർട്ടിക്കോയ്ക്ക് താഴെ നിന്ന് അവൾ അത് രണ്ടുതവണ വായിച്ചു. പ്ലാസ്റ്റിക് കസേരയിൽ ഇരുന്നിരുന്ന സെക്യൂരിറ്റി ജീവനക്കാരൻ ഒന്ന് തലയുയർത്തി അവളെ നോക്കി. അവൾ മറ്റാരെങ്കിലും തന്നെ നിരീക്ഷിക്കുന്നുണ്ടോ എന്ന സംശയത്തിൽ ചുറ്റിലും ഒന്ന് കണ്ണോടിച്ചു. ആരുമില്ലെന്ന് ഉറപ്പ് വരുത്തിയ ശേഷം വീണ്ടും തന്റെ ഫോണിലേക്കു ശ്രദ്ധ തിരിച്ചു.", "അവൾ ആ മെസേജ് ഓപ്പൺ ചെയ്ത ആ നിമിഷം തന്നെ അടുത്ത മെസേജ് അവളെ തേടിയെത്തി.", "'നാളെ. രാവിലെ 11 മണിക്ക്. ഒരു മണിക്കൂർ മുമ്പ് സ്ഥലമറിയിക്കാം. തനിയെ വരണം.'", "'ദുബായിയെക്കുറിച്ച് എങ്ങനെ അറിഞ്ഞു?' എന്ന് അവൾ ടൈപ്പ് ചെയ്തെങ്കിലും അത് ഡിലീറ്റ് ചെയ്തു. 'നീ ആരാണ്?' എന്നും ടൈപ്പ് ചെയ്തു നോക്കി, അതും ഡിലീറ്റ് ചെയ്തു. കാരണം, അത് അവൾ നേരത്തെ ചോദിച്ചതാണ്, അതിന് അയാൾ മറുപടി നൽകിയിരുന്നില്ല. ഒടുവിൽ അവൾ ഇങ്ങനെ മാത്രം എഴുതി:", "'ഞാൻ വരാം. ഒറ്റയ്ക്കല്ല. എന്റെ കൂടെ ഒരാളുണ്ടാവും, എന്റെ എഡിറ്റർ.'", "രണ്ട് ചാരനിറത്തിലുള്ള ടിക്ക് മാർക്കുകൾ. പിന്നെ രണ്ട് നീല നിറത്തിലുള്ളവ. ഏകദേശം ഒരു മിനിറ്റിനു ശേഷം:", "'നിങ്ങളുടെ എഡിറ്റർ മാത്രം. നിങ്ങളുടെ അമ്മയാവരുത്.'", "ആ വാക്കുകൾ അവളുടെ കശേരുക്കളിലൂടെ ഒരു മിനാളായി അവൾക് തോന്നി. അവൾ ചുറ്റും നോക്കി. വിജനമായ റോഡ്, നനഞ്ഞുകിടക്കുന്ന കാറുകൾ, എതിർവശത്തെ ഇരുണ്ട ജനാലകൾ, കസേരയിലിരിക്കുന്ന കാവൽക്കാരൻ. അവിടെ ആരുമുണ്ടായിരുന്നില്ല.", "അവൾ പതിയെ അകത്തേക് കയറി. പതിവായി ലിഫ്റ്റിൽ പോയിരുന്ന അഞ്ജലി അന്ന് സ്റ്റെയര്കേസായിരുന്നു ഉപയോഗിച്ചത്. മുകളിലേക്കു നടക്കുമ്പോൾ അവളുടെ മനസ്സിൽ ഓരോരോ സംഭവങ്ങളുടെ ചിത്രങ്ങൾ മിന്നിമാഞ്ഞു. വളരെ യാന്ത്രികമായി ഫ്‌ളാറ്റിന്റെ വാതിൽ തുറന്ന് അകത്ത് കയറിയ അവൾ വാതിൽ ശരിക്കും പൂട്ടിയോ എന്ന് പതിവില്ലാതെ രണ്ട് തവണ ഉറപ്പ് വരുത്തി. അകത്ത് കയറിയിട്ടും ലൈറ്റ ഇടാൻ ശ്രമിക്കാതെ അവൾ ആ ഇരുട്ടിൽ ഫോയർ സ്‌പേസിൽ തന്നെ നിന്നു.", "അല്പസമയത്തിന് ശേഷം, അവൾ ലൈറ്റുകൾ ഓൺ ചെയ്ത ഹാളിലെ സോഫയിൽ ഇരുന്നു. തുടർന്ന് ഷേണായി തന്നോട് ചെയ്യാൻ പറഞ്ഞ കാര്യം അവൾ ചെയ്തു. അവൾ ആ രണ്ട് സന്ദേശങ്ങളും അയാൾക് ഫോർവേഡ് ചെയ്തു, ഒപ്പം ഒരു വരിയും കുറിച്ചു. അജ്ഞാതൻ തിരിച്ചെത്തിയിരിക്കുന്നു. നാളെ 11 മണിക്ക് കൂടിക്കാഴ്ചയുണ്ട്. സ്ഥലം പിന്നീട് അറിയിക്കാം.", "ഷേണായി ഉറങ്ങിയിട്ടുണ്ടായിരുന്നില്ല. ഒരു മിനിറ്റിനകം തന്നെ അയാളുടെ മറുപടി അജ്ഞലിക്ക് ലഭിച്ചു.", "'രോഹൻ നിന്റെ കുറെ വരും, കാണാൻ കഴിയുന്ന ഒരിടത്ത് ഇരിക്കാൻ ശ്രമിക്കുക. ലൊക്കേഷൻ കിട്ടുമ്പോൾ ഉടൻ തന്നെ അയച്ച് തരണം.'", "അവൾ 'OK' എന്ന് മറുപടി നൽകി. പിന്നീട്, ഉറക്കം വരാതിരുന്നതുകൊണ്ടും, അതുപോലെ അവൾ പതിവായി ചെയ്യുന്ന ഒരു കാര്യമായതുകൊണ്ടും, ആ അപരിചിതനുമായുള്ള സംഭാഷണത്തിന്റെ തുടക്കത്തിലേക്ക് സ്ക്രോൾ ചെയ്ത് അവൾ ആ മെസേജുകളും ടൈമ് സ്റ്റാമ്പുകൾ പരിശോധിച്ചു.", "ആദ്യത്തെ മെസേജ് ഓഫീസിന് പുറത്തുനിൽക്കുന്ന അവളുടെ പിതാവിന്റെ ഫോട്ടോയും, വെട്ടിയെടുത്ത് മാറ്റം വരുത്തിയ ലെഡ്ജർ പേജും, അത് വന്നിരിക്കുന്നത് ശനിയാഴ്ച രാവിലെ 6:41-നാണ്.", "അവൾ ദുബായ് പോലീസ് പുറത്തിറക്കിയ പത്രക്കുറിപ്പിലെ സമയം പരിശോധിച്ചു. ബുധനാഴ്ച പന്ത്രണ്ട് മണി കഴിഞ്ഞ് രണ്ട് മിനിറ്റ് ആയപ്പോഴാണ് അത് പുറത്തിറക്കിയിരിക്കുന്നത്.", "ആ രണ്ട് സമയങ്ങൾ, അവ അക്കങ്ങളാണെന്ന് തോന്നാത്ത അവസ്ഥയാകുന്നതുവരെ അവൾ അവയെ അടുത്തടുത്ത് വെച്ച് വീണ്ടും വീണ്ടും വായിച്ചുനോക്കി.", "'ഞാൻ നിനക്ക് എഴുതിയത് എന്തിനാണെന്ന് ഇപ്പോൾ നിനക്ക് മനസ്സിലായിക്കാണുമല്ലോ.' എന്ന മെസേജിലെ ആ വാചകം അവളെ വല്ലാതെ കൊളുത്തി വലിച്ചുകൊണ്ടിരുന്നു.", "അയാൾ ആരായിരുന്നാലും, അത് സംഭവിക്കുന്നതിന് നാല് ദിവസം മുമ്പ് തന്നെ അയാൾക്ക് അതറിയാമായിരുന്നു എന്ന് അവളോടാരോ പറയുന്ന പോലെ അഞ്ജലിക്ക് തോന്നി."], "isNew": false}, {"label": "അദ്ധ്യായം 4", "title": "അദ്ധ്യായം 4", "paras": ["കൃത്യം പത്ത് മണിക്ക് സ്ഥലത്തിന്റെ ലൊക്കേഷൻ അഞ്ജലിയുടെ മൊബൈലിൽ എത്തി.", "'നൂർ ബേക്കറി, ഫ്രേസർ ടൗൺ. മുകൾനിലയിൽ.'", "അഞ്ജലി അങ്ങനെ ഒരു ബേക്കറിയെ കുറിച്ച് കേട്ടിട്ടുപോലും ഉണ്ടായിരുന്നില്ല. മൂന്ന് തലമുറകളോളം നീണ്ട മാർക്കറ്റിലെ മത്സരങ്ങളെ അതിജീവിച്ച് പോന്ന, കാര്യമായ മാറ്റങ്ങളൊന്നും വരുത്താത്ത ബാംഗളൂരുവിലെ ചെറിയ ബേക്കറികളിൽ ഒന്നായിരുന്നു അത്. കൗണ്ടറിൽ റസ്‌കുകളും, ബർഫിയും, ബിസ്കറ്റും നിറച്ച ഗ്ളാസ് ജാറുകൾ. ചുവരിൽ ഏതോ സർക്കാർ സ്ഥാപനത്തിന്റേതെന്ന് തോനിക്കുന്ന ഒരു കലണ്ടർ. കാര്യമായ കാറ്റൊന്നും തരാത്ത വിധം കറങ്ങിക്കൊണ്ടിരിക്കുന്ന പൊടിപിടിച്ച ഒരു സീലിംഗ് ഫാൻ. ഇതൊക്കെയാണ് അവിടെയുണ്ടായിരുന്നത്. കടയുടെ പിൻഭാഗത്തുള്ള ഇടുങ്ങിയ ഗോവണിപ്പടി ചെന്നെത്തുന്നത് ആറ് മേശകളുള്ള ഒരു മുറിയിലേക്കാണ്. അവിടെ റോഡിലേക്കു തുറക്കുന്ന ഒരു ജനലുണ്ട്. ആ മുറിയിലാകെ എണ്ണയിൽ വെറുക്കുന്ന ഉള്ളിയുടെയും, മറ്റെന്തൊക്കെയോ മസാലകളുടെയും ഗന്ധം നിറഞ്ഞ് നിൽക്കുന്നുണ്ടായിരുന്നു.", "ഷേണായി പറഞ്ഞ പോലെ, രോഹനും അഞ്ജലിയും ആ ലൊക്കേഷനിൽ എത്തിച്ചെർന്നു. ധാരണപ്രകാരം രോഹനാണ് ആദ്യം മുകളിലേക്കു പോയത്. അവൻ ജനലിനരികിലുള്ള മേശയിലിരുന്നു. ഒരു പഫ്സിനുള്ള ഓർഡർ നൽകി. അഞ്ജലി അഞ്ച് മിനിട്ടോളം റോഡ് സൈഡിൽ തന്നെ ഫോണിൽ ആരോടോ സംസാരിക്കുന്ന പോലെ അഭിനയിച്ച് കാത്ത് നിന്നു. അതിന് ശേഷം അവൾ നേരെ അകത്തേക് പോയി.", "അവിടെ അവരെ കൂടാതെ മറ്റൊരു മേശയിൽ മാത്രമേ ആളുണ്ടായിരുന്നുള്ളൂ.", "അവൾ അകത്തേക്ക് കടന്നപ്പോൾ അവിടെ ഇരുന്നിരുന്നയാൾ എഴുന്നേറ്റു. ഏകദേശം നാൽപ്പത്തഞ്ചു വയസ്സു തോന്നിക്കുന്ന, ഇടത്തരം ഉയരമുള്ള ഒരാൾ. ഇളം നീല നിറത്തിലുള്ള ഷർട്ടാണ് അയാൾ ധരിച്ചിരുന്നത്. അതിന്റെ കൈകൾ കൃത്യമായി രണ്ടുതവണ മടക്കിവെച്ചിരുന്നു. അയാളുടെ മുടി വശങ്ങളിൽ നരച്ചിട്ടുണ്ട്. ഭംഗിയായി വെട്ടിയൊതുക്കിയ ഹെയർസ്‌റ്റൈലായിരുന്നു അയാളുടേത്. ഫ്രെയിമില്ലാത്ത കണ്ണടയും സ്റ്റീൽ വാച്ചും ധരിച്ചിരുന്ന അയാളുടെ മുഖം, പോലീസിന്റെ രേഖകളിൽ വിശേഷിപ്പിക്കാറുള്ളതുപോലെ, പ്രത്യേകിച്ച് അടയാളങ്ങളൊന്നും എടുത്തുപറയാനില്ലാത്ത ഒന്നായിരുന്നു. അയാളുടെ മേശപ്പുറത്ത് കാപ്പി നിറച്ച രണ്ട് ഗ്ലാസുകളുണ്ടായിരുന്നു. അതിലൊന്ന് ഒഴിഞ്ഞ കസേരയ്ക്ക് മുന്നിലായിരുന്നു ഉണ്ടായിരുന്നത്.", "\"മാധവൻ സാറിന്റെ മോളല്ലേ?\" - അദ്ദേഹം പതുക്കെ ചോദിച്ചു.", "അതൊരു ചോദ്യമായിരുന്നില്ല. അവൾ പടികൾ കയറി വന്ന നിമിഷം തന്നെ അദ്ദേഹം അവളെ തിരിച്ചറിഞ്ഞിരുന്നു.", "അവൾ ഇരുന്നു. അവൾക്ക് പിന്നാലെ അദ്ദേഹവും ഇരുന്നു.", "\"ഞാൻ നിങ്ങൾക്കായി ഓർഡർ ചെയ്തിട്ടുണ്ട്,\" അദ്ദേഹം ഇംഗ്ലീഷിൽ പറഞ്ഞു. \"നല്ല കടുപ്പത്തിൽ, പഞ്ചസാര കുറച്ച്. ഇത് ശരിയായിരിക്കുമെന്ന് കരുതുന്നു.\"", "ഒരു ഗ്ളാസ് കാപ്പി അവരുടെ മുന്നിലേക്ക് എത്തി. അവൾ ആ ഗ്ലാസിലേക്ക് നോക്കി. കടും തടിയുടെ നിറമുള്ള കാപ്പി. അതിനു മുകളിൽ നേർത്ത പതയുടെ ഒരു പാളിയുമുണ്ടായിരുന്നു.", "\"ഞാൻ ഇത്ര കടുപ്പത്തിൽ കുടിക്കാറില്ല?\"-അവൾ പറഞ്ഞു.", "\"നിന്റെ അച്ഛൻ ഇതുപോലെയാണ് കുടിച്ചിരുന്നത്.\"", "അവൾ ആ ഗ്ലാസ്സിൽ തൊട്ടില്ല. അവൾ തൊടുമെന്ന് അയാൾ പ്രതീക്ഷിച്ചതുപോലുമില്ല.", "\"ജനലിനരികിലിരിക്കുന്ന നിങ്ങളുടെ സഹപ്രവർത്തകൻ..\" അയാൾ തുടർന്നു. \"വായിക്കുന്നതായി അഭിനയിക്കുന്നതിൽ ഒട്ടും സമർത്ഥനല്ല. നിങ്ങൾ വന്നതുമുതൽ അദ്ദേഹം ആ മാഗസിൻറെ ഒരേ പേജിൽത്തന്നെയാണ് നിൽക്കുന്നത്. സാരമില്ല. ഞാൻ നിങ്ങളോട് ഒറ്റയ്ക്ക് വരാൻ പറഞ്ഞിരുന്നു, എന്നാൽ നിങ്ങൾ വരില്ലെന്ന് പറഞ്ഞു. എന്താണോ ചെയ്യാൻ ഉദ്ദേശിക്കുന്നത് അത് തുറന്നു പറയുകയും, പിന്നീട് അത് പ്രവർത്തിയിൽ വരുത്തുകയും ചെയ്യുന്ന ആളുകളെയാണ് എനിക്കിഷ്ടം.\"", "“എങ്കിൽ നിങ്ങളുടെ പേര് പറയൂ.”- അഞ്ജലി പറഞ്ഞു", "“ഇല്ല.” - അയാൾ ഒരു നിമിഷം നിശബ്ദനായി.", "“എന്റെ പേര് നിങ്ങൾക്കറിയാം. എന്റെ അച്ഛന്റെ പേരും നിങ്ങൾക്കറിയാം. അദ്ദേഹം എങ്ങനെയാണ് കാപ്പി കുടിച്ചിരുന്നതെന്നും നിങ്ങൾക്കറിയാം.” - അഞ്‍ജലി തുടർന്നു.", "\"അതെ.\" അദ്ദേഹം മേശപ്പുറത്തിരുന്ന തന്റെ ഗ്ലാസ് അല്പം ഒന്ന് കറക്കി.", "\"ഒരാഴ്ച കഴിയുമ്പോഴേക്കും, ഞാൻ ആഗ്രഹിക്കുന്നതിലും അധികം കാര്യങ്ങൾ എന്നെക്കുറിച്ച് നിങ്ങൾക്ക് അറിയാൻ സാധിക്കും. എന്നാൽ ഇന്നല്ല. ഇന്ന് നിങ്ങൾ കേൾക്കുകയാണ് വേണ്ടത്. ഞാൻ സംസാരിക്കുമ്പോൾ, ആരെക്കുറിച്ചാണ് പറയുന്നതെന്ന് കണ്ടെത്താൻ ഒരു പേര് തിരയേണ്ട സാഹചര്യം ഇല്ലാതിരുന്നാൽ നിങ്ങൾക്ക് കൂടുതൽ ശ്രദ്ധയോടെ കേൾക്കാൻ സാധിക്കും.\"", "അവൾ ബാഗിൽ നിന്ന് തന്റെ നോട്ബുക്ക് എടുത്ത് മേശപ്പുറത്ത് വച്ച് അതിന്റെ മുകളിൽ പേനയും എടുത്ത് വച്ചു. അയാൾ അതിലേക്കൊന്ന് നോക്കി. എന്തോ കണ്ടെത്തിയ പോലെ ഒരു ചെറു ചിരിയോടെ തലയാട്ടി.", "അവൾ ഒട്ടും മുഖവുരയില്ലാതെ തന്റെ ആദ്യത്തെ ചോദ്യം ചോദിച്ചു. \"സംഭവം നടക്കുന്നതിന് നാല് ദിവസം മുമ്പ് ദുബായിലെ കാര്യത്തെക്കുറിച്ച് നിങ്ങൾക്ക് എങ്ങനെ അറിയാമായിരുന്നു?\"", "\"അറസ്റ്റുകളെക്കുറിച്ച് എനിക്കറിയില്ലായിരുന്നു. എന്നാൽ അറസ്റ്റുകൾ നടക്കുമെന്ന് എനിക്കറിയാമായിരുന്നു.\" - അയാൾ പറഞ്ഞു.", "\"അതൊരു മറുപടിയല്ല.\"", "\"ഇന്ന് ഞാൻ നിനക്ക് നൽകാൻ പോവുന്ന വിവരം ഇതാണ്\". യാതൊരുവിധ ശത്രുതാഭാവവുമില്ലാതെയാണ് അയാൾ അത് പറഞ്ഞത്. \"ഞാൻ എന്റെ ജീവിതത്തിലെ ഇരുപത് വർഷം ഓഡിറ്റ് ഡിപ്പാർട്മെന്റിലാണ് ചെലവഴിച്ചത്. മറ്റുള്ളവരുടെ പണമിടപാടുകൾ പരിശോധിക്കുക എന്നതായിരുന്നു എന്റെ ജോലി. പണം എപ്പോഴും ചില അടയാളങ്ങൾ അവശേഷിപ്പിക്കാറുണ്ട്, അഞ്ജലി. മിക്കവരും ഒരിക്കലും താഴേക്ക് നോക്കാറില്ല. എന്നാൽ എന്റെ ജീവിതം മുഴുവൻ ഞാൻ താഴേക്ക് നോക്കിയാണ് ചെലവഴിച്ചത്. ഒരു കൂട്ടം കാൽപ്പാടുകൾ വേഗത്തിൽ നീങ്ങാൻ തുടങ്ങുന്നുണ്ടെങ്കിൽ, അതിനെ എന്തോ ഒന്ന് പിന്തുടരുന്നുണ്ടെന്ന് അർത്ഥം.\"", "അവൾ തന്റെ നോട്ട്ബുക്കിൽ 'ഓഡിറ്റ്', '20 വർഷം' എന്നിങ്ങനെ എഴുതിവെച്ച് കാത്തിരുന്നു.", "\"നീ ഹേമാവതിയെ കണ്ടെത്തി\" അദ്ദേഹം പറഞ്ഞു. അതൊരു ചോദ്യമായിരുന്നില്ല.", "\"അതെങ്ങനെയാണ് നിങ്ങൾക്ക് അറിയാവുന്നത്?\"- അവൾ അത്ഭുതപ്പെട്ടു.", "\"കാരണം, നീ നിന്റെ അച്ഛന്റെ മകളാണ്. അദ്ദേഹം ആദ്യം കണ്ടെത്താൻ പോകുന്ന കാര്യവും ഇതുതന്നെയായിരിക്കും.\"", "അയാൾ പിന്നിലേക്ക് ചാഞ്ഞിരുന്നു. \"കാവേരി നാല് കയറ്റുമതി സ്ഥാപനങ്ങൾ വഴിയാണ് പണം കൈമാറ്റം ചെയ്തത്. ആ പട്ടിക നിന്റെ കൈവശമുണ്ടല്ലോ. അവർ ഗൾഫിലെ വാങ്ങുന്നവർക്ക് ഗ്രാനൈറ്റും കയറും സുഗന്ധവ്യഞ്ജനങ്ങളും വിറ്റതായി പേപ്പറുകളിൽ കാണിക്കും. എന്നാൽ വാസ്തവത്തിൽ അവർ ഒന്നും വിറ്റിരുന്നില്ല. എട്ടു ലക്ഷം രൂപ വിലമതിക്കുന്ന ഒരു കണ്ടെയ്‌നർ ഗ്രാനൈറ്റിന് എൺപത് ലക്ഷം രൂപയാണെന്ന് ഇൻവോയ്‌സുകളിൽ അവർ രേഖപ്പെടുത്തും. ഈ അധിക തുക സാധനങ്ങൾ വാങ്ങിയ വകയിൽ വിദേശത്തേക്ക് അയച്ചു എന്നാണ് കണക്കിൽ കാണുക. രേഖകൾ പ്രകാരം ഇത് പൂർണ്ണമായും നിയമപരവുമായിരുന്നു. എന്നാൽ ആ പണം ഒരിക്കലും ആരിലേക്കും തിരികെ വന്നില്ല. ഇതെല്ലാം സംഭവിക്കുന്നത് 2009-ലായിരുന്നു.\"", "“പിന്നെ ഇപ്പോൾ?” - അവളിൽ ആകാംക്ഷ ഉണർന്നു.", "“ഇപ്പോൾ ആർക്കും ഗ്രാനൈറ്റ് വേണ്ട. പകരം ഡിജിറ്റൽ ആസ്തികളും, കൺസൾട്ടൻസി ഫീസുകളും, നൂറുകണക്കിന് മറ്റ് കമ്പനികൾക്കൊപ്പം ഒരു ബിസിനസ് സെന്ററിലെ ഒരൊറ്റ നിലയിൽ പ്രവർത്തിക്കുന്ന 'ഫ്രീ-സോൺ' കമ്പനികളുമാണ് ഇപ്പോഴുള്ളത്. കൈമാറ്റം ചെയ്യപ്പെടുന്ന വസ്തുക്കൾ മാറി, പക്ഷേ രീതി മാറിയില്ല. ഘടന അതേപടി, ശീലങ്ങളും അതേപടി. ഡയറക്ടർമാരായി ഒപ്പിടുന്നതും അതേ കുടുംബങ്ങൾ തന്നെ. കാരണം, ഒരിക്കൽ പണം നൽകി വരുതിയിലാക്കിയ ഒരു കുടുംബത്തെ വീണ്ടും പണം നൽകി ഉപയോഗപ്പെടുത്താമല്ലോ.”", "“സിദ്ധരാജു ഗൗഡയും സന്തോഷ് ഗൗഡയും?” - അവളുടെ ചോദ്യം ഒട്ടും സമയമെടുക്കാതെ ആയിരുന്നു.", "അയാളുടെ മുഖത്ത് ആദ്യമായി ഒരു ചലനമുണ്ടായി. അത് വളരെ നേരിയതായിരുന്നതുകൊണ്ട് അഞ്ജലി വെറുതെ സങ്കല്പിച്ചതാവാനും വഴിയുണ്ട്. ഒരു നിമിഷത്തിന്റെ ചെറിയൊരു അംശനേരം, ആ നേരത്ത് താൻ ഇതിനകം പരിഹരിച്ച് കഴിഞ്ഞ ഒരു പ്രശ്നമായല്ല, തന്നെക്കാൾ മുമ്പേ ആ വഴിയിലെത്തിയ ഒരാളെപ്പോലെയാണ് അയാൾ അഞ്ജലിയെ നോക്കിയത്.", "\"നീ അപ്പോഴേക്കും കമ്പനി രജിസ്ട്രി പരിശോധിച്ചു, അല്ലേ?\" അയാൾ ചോദിച്ചു.", "\"ഇന്നലെ രാത്രി.\"", "\"നല്ലത്. അപ്പോൾ ഈ കേസിന്റെ ഒരു ചിത്രത്തെ കുറിച്ച് ഞാൻ പറയുന്നത് നുണയല്ലെന്ന് നിങ്ങൾക്ക് ഇതിനകം മനസ്സിലായിട്ടുണ്ടാകുമല്ലോ. 2008-ൽ കാവേരിയുടെ എക്‌സ്‌പോർട്ട് വിഭാഗം സെറ്റപ്പ് ചെയ്ത ആൾ തന്നെയാണ് ദുബായിലെ കമ്പനിയുടെ സ്ട്രക്ച്ചറും സെറ്റപ്പ് ചെയ്തിരുന്നത്. അദ്ദേഹം ഇക്കാര്യത്തിൽ വളരെ വിദഗ്ധനാണ്. പതിനേഴ് വർഷത്തെ പ്രവൃത്തിപരിചയമുണ്ട് ആ മനുഷ്യന്.\"", "\"ആരാണദ്ദേഹം?\"", "\"നിങ്ങൾ അദ്ദേഹത്തെ കണ്ടെത്തിക്കോളും.\"-അയാൾ പറഞ്ഞു.", "\"ഞാൻ നിങ്ങളോടാണ് ചോദിക്കുന്നത്.\"- അഞ്ജലി അല്പം ശബ്ദമുയർത്തിക്കൊണ്ട് ചോദിച്ചു.", "\"ഞാൻ നിന്നോട് അത് പറയില്ല.\" ഒരു കുട്ടിയോട് കാര്യങ്ങൾ വിശദീകരിച്ചുകൊടുക്കുന്നതുപോലെ, വളരെ ശാന്തമായാണ് അദ്ദേഹം അത് പറഞ്ഞത്.", "\"ഞാൻ അദ്ദേഹത്തിന്റെ പേര് വെളിപ്പെടുത്തിയാൽ, നിങ്ങൾ എന്റെ കഥ എഴുതും. നിങ്ങൾ പ്രസിദ്ധീകരിക്കുന്ന ഓരോ വരിയും അദ്ദേഹത്തിന്റെ വാദത്തിനെതിരെയുള്ള എന്റെ വാദമായിരിക്കും. മാത്രമല്ല, നമ്മളെ രണ്ടുപേരെക്കാളും മികച്ച അഭിഭാഷകരെ നിയോഗിക്കാനും അദ്ദേഹത്തിന് കഴിയും. എന്നാൽ, നിങ്ങൾ സ്വയം പരിശോധിച്ചും അന്വേഷിച്ചും അദ്ദേഹത്തെ കണ്ടെത്തുകയാണെങ്കിൽ, നിങ്ങൾക്ക് സ്വന്തമായി ഒരു റിപ്പോർട്ട് തയ്യാറാക്കാൻ സാധിക്കും. അത്തരത്തിലുള്ള റിപ്പോർട്ടുകൾക് മാത്രമേ നിലനിൽപ്പുള്ളൂ.\"", "ഷേണായി പറഞ്ഞ അതെ കാര്യമാണ് അയാളും പറയുന്നതെന്ന് അഞ്ജലിക്ക് തോന്നി. മാത്രമല്ല, അയാൾക് ഇക്കാര്യം പറയേണ്ടതിനായി തെരെഞ്ഞെടുത്ത ആളാണ് താനെന്ന് വിശ്വസിപ്പിച്ചുകൊണ്ട്, തന്നെ ഈ ഒരിടത്തേക് എത്തിക്കാൻ അയാൾക് കഴിഞ്ഞു എങ്കിൽ അയാൾ പറയേണ്ടതും കൃത്യമായി ഇതേ കാര്യം തന്നെ ആയിരുന്നു.", "\"നിങ്ങളുടെ പക്കൽ എന്തെങ്കിലും തെളിവുകളുണ്ടോ?\" - അഞ്ജലി ചോദിച്ചു.", "അയാൾ തന്റെ ഷർട്ടിന്റെ പോക്കറ്റിൽ നിന്ന് മടക്കിയ ഒരു കടലാസ് എടുത്ത്, രണ്ടുപേരുടെയും ഗ്ലാസുകൾക്കിടയിലുള്ള മേശപ്പുറത്ത് വെച്ചു.", "\"\"അവർ കൊല്ലാൻ പദ്ധതിയിട്ട ആൾ!\" - അയാൾ പറഞ്ഞു.", "\"പോലീസ് അദ്ദേഹത്തിന്റെ പേര് വെളിപ്പെടുത്തിയിട്ടില്ല. അവർ അത് വെളിപ്പെടുത്തുകയുമില്ല. ദുബായിലെ ബിസിനസ് ഗ്രൂപ്പുകൾക്ക് അദ്ദേഹത്തെക്കുറിച്ച് അറിയാം, എന്നാൽ അദ്ദേഹം ജീവനോടെയുണ്ടോ എന്ന് ഉറപ്പില്ലാത്തതിനാൽ അവർ ഇക്കാര്യത്തിൽ അതീവ ജാഗ്രത പാലിക്കുകയാണ്.\"", "അയാൾ ആ പേപ്പർ അവൾക് നേരെ നീക്കി വച്ചു. അഞ്ജലി അതെടുത്ത് നിവർത്തി. ഇഗ്ളീഷിൽ ടൈപ്പ് ചെയ്ത ഒരു പേപ്പറായിരുന്നു അത്. ഒരു പേര്, ഒരു വയസ്സ്, ഇന്നലെ രാത്രി അവൾ കണ്ടെത്തിയ ഫണ്ടിന്റെ പേര്, പിന്നെ 2014-ലെ ഒരു തീയതിയും.", "Nabeel Sayeed. 48. Founding partner. Joined the Hemavathi relationship 2014.", "\"ഇയാളിപ്പോഴും ജീവനോടെ ഉണ്ടോ?\"", "\"എനിക്കറിയില്ല. അറസ്റ്റിൻ്റെ തലേദിവസം രാത്രി മുതൽ അവനെ കാണാനില്ല. അവൻ മരിക്കാൻ ആഗ്രഹിച്ചവർ എല്ലാവരും കസ്റ്റഡിയിലില്ല. അവൻ ജീവിച്ചിരിപ്പുണ്ടെങ്കിൽ, അവൻ അവരിൽ നിന്നും പോലീസിൽ നിന്നും ഒളിച്ചിട്ടുണ്ടാവും\"", "അവൾ ആ പേര് തന്റെ നോട്ട്ബുക്കിൽ എഴുതുകയും, ആ കടലാസ് മടക്കി നോട്ട്ബുക്കിന്റെ പിൻഭാഗത്ത് വെക്കുകയും ചെയ്തു.", "തുടർന്ന്, ആ ബേക്കറിയുടെ പടികൾ കയറിയതുമുതൽ അവൾ മനസ്സിൽ സൂക്ഷിച്ചിരുന്ന ചോദ്യം അവൾ ചോദിച്ചു.", "“എന്റെ അച്ഛനെ നിങ്ങൾക്ക് അറിയാമായിരുന്നോ?”", "“കാവേരിയിലുള്ള എല്ലാവർക്കും മാധവൻ സാറിനെ അറിയാമായിരുന്നു.”- അയാൾ പുഞ്ചിരിച്ചുകൊണ്ട് പറഞ്ഞു.", "“അപ്പോൾ നിങ്ങൾ കാവേരിയിൽ ജോലി ചെയ്തിരുന്നല്ലേ?”", "“ഞാൻ അങ്ങനെ പറഞ്ഞില്ലല്ലോ.”- ആ മുഖം വീണ്ടും ഭാവരഹിതമായ വരൾച്ചയിലേക് മടങ്ങി.", "“കാവേരിയിലുള്ള എല്ലാവർക്കും അറിയാമായിരുന്നു എന്നാണല്ലോ നിങ്ങൾ പറഞ്ഞത്. നിങ്ങൾ അദ്ദേഹത്തെ ‘സാർ’ എന്നാണ് വിളിക്കുന്നത്. അദ്ദേഹം എങ്ങനെയാണ് കാപ്പി കുടിച്ചിരുന്നത് എന്ന് നിങ്ങൾക്ക് അറിയുകയും ചെയ്യാം.”", "അദ്ദേഹം നേരിയ തോതിൽ ഒന്ന് പുഞ്ചിരിച്ചു എന്ന് വരുത്തി. താൻ ബഹുമാനിക്കുന്ന ഒരു എതിരാളിയാൽ കുരുക്കിലായ ഒരാളുടെ പുഞ്ചിരിയായിരുന്നു അതെങ്ങ് അവൾക് തോന്നി. അതേസമയം, ആ കാര്യത്തിൽ തോൽവി സമ്മതിച്ചുകൊടുക്കാൻ അയാളും ഒട്ടും ഉദ്ദേശിക്കുന്നുണ്ടാവില്ലാവണം.", "\"പലരും അദ്ദേഹത്തെ 'സർ' എന്ന് വിളിച്ചിരുന്നു,\" അയാൾ പറഞ്ഞു. \"അദ്ദേഹം അത്തരമൊരു മനുഷ്യനായിരുന്നു.\"", "അത് കേട്ടതോടെ അച്ഛന്റെ മുഖം അഞ്ജലിയുടെ ഓർമ്മകളിൽ തെളിഞ്ഞു. ജനാലക്കരികിൽ ഇരിക്കുന്ന രോഹനെ അവൾ നോക്കി. തിരിച്ചറിയപ്പെട്ടിട്ടും ഒരപരിചിതനെപ്പോലെ അഭിനയിക്കുന്ന അവനെ അതവസാനിപ്പിക്കാൻ പറയണം എന്ന് തോന്നി. അപ്പോഴും, അയാൾ ആരാണെന്ന് സ്വയം വെളിപ്പെടുത്തിയില്ലെങ്കിലും ഉടനെ തന്നെ തനിക്കാത്ത കണ്ടുപിടിക്കാനാകുമെന്ന ഒരാത്മവിശ്വാസം അവളിൽ ഉണ്ടായി. അത് അയാൾക്കും മനസ്സിലായെന്ന് അവൾക് തോന്നി.", "\"നിങ്ങളുടെ അച്ഛൻ വീട്ടിൽ എന്താണ് സൂക്ഷിച്ചിരുന്നത്?\" - ആ നേർത്ത നിശബ്ദതയുടെ ഇടവേളയെ ഭേദിച്ചുകൊണ്ട് അയാൾ ചോദിച്ചു.", "അതൊരു അസാധാരണമായ ചോദ്യമായി അഞ്ജലിക് തോന്നിയില്ല. ചോദിക്കുമ്പോൾ അയാളുടെ നോട്ടം അവളുടെ മുഖത്തേക്കല്ലായിരുന്നു. അയാൾ അവളുടെ കാപ്പിയിലേക്കായിരുന്നു നോക്കിയിരുന്നത്. എന്നാൽ, ആ ചോദ്യം ചോദിക്കുമ്പോൾ അതുവരെ അയാളുടെ കൈകൾ ചലിക്കുന്നത് പോലെയായിരുന്നില്ല അപ്പോൾ എന്ന് അവൾ ശ്രദ്ധിച്ചു. അയാളുടെ കൈപ്പിടിയിൽ അയാൾക് മുന്നിലിരുന്ന ഗ്ലാസ് മുറുകുന്നതും അവളുടെ സൂക്ഷ്മമായ നോട്ടത്തിൽ അവൾ കണ്ടു.", "\"കുറെ പേപ്പറുകൾ\"- അവൾ പറഞ്ഞു. \"പിന്നെ കുറച്ച് പഴയ ബില്ലുകളും, ബാങ്ക് സ്റ്റേറ്റുമെന്റുകളും ഉണ്ടായിരുന്നു. കാവേരിയെ കുറിച്ച് അവിടെ ഒന്നും കണ്ടില്ല\"", "\"ഒന്നും തന്നെ കണ്ടില്ല?\" - അയാൾ സംശയത്തോടെ ചോദിച്ചു.", "\"ഇല്ല, എന്തെ?\"", "\"ഒന്നുമില്ല, സാധാരണ അകൗണ്ടന്റുമാർ പകർപ്പുകൾ സൂക്ഷിച്ചുവെയ്ക്കുന്ന ഒരു ശീലമുള്ളവരായിരിക്കും\" - അയാൾ ഒന്ന് മുകളിലേക്കു നോക്കി.", "\"ബുദ്ധിമാന്മാരായ അകൗണ്ടന്റുമാർ അങ്ങനെ ചെയ്യും, അദ്ദേഹം അത്തരമൊരാളായിരുന്നു.\"", "അയാൾ ആ കസേരയിൽ നിന്ന് എഴുന്നേറ്റ് തന്റെ പേഴ്‌സ് പുറത്തേക്കെടുത്തു. രണ്ട് കാപ്പികൾക്കുള്ള കൃത്യമായ തുക, ചില്ലറയായി അവിടുത്തെ വെയ്റ്ററെ വിളിച്ച് കൊടുത്തു.", "\"അഞ്ജലി, ഞാൻ നിങ്ങളെ ബന്ധപ്പെടാം,\" അയാൾ പറഞ്ഞു. \"ഈ നമ്പറിലേക്ക് വിളിക്കാൻ ശ്രമിക്കരുത്. അടുത്ത തവണ ഇതല്ല മറ്റൊരു നമ്പറിൽ നിന്നായിരിക്കും ഞാൻ കോണ്ടാക്ട് ചെയ്യുന്നത്.\"", "അതും പറഞ്ഞ് അയാൾ വാതിലിനെ ലക്ഷ്യമാക്കി നടന്നു. അവൾ സംസാരിക്കുന്നതിന് മുൻപേ അയാൾ പടികളിറങ്ങിക്കഴിഞ്ഞിരുന്നു.", "അവൾ അയാളെ വിളിച്ചു. അയാൾ തിരിഞ്ഞ് നോക്കിയപ്പോൾ അഞ്ജലി അയാൾക്കരികിലേക് ചെന്നു.", "\"എന്തുകൊണ്ടാണ് നിങ്ങൾ എന്നെ കോൺടാക്ട് ചെയ്തത്? ഇത് നിങ്ങൾക്ക് മറ്റേതൊരു ജേണലിസ്റ്റിനെക്കൊണ്ടും ചെയ്യിക്കാനാവുതാണല്ലോ.അതുമല്ലെങ്കിൽ ഏതെങ്കിലും മുഖ്യധാരാ പത്രങ്ങളെയോ, ചാനലിനെയോ അതുമല്ലെങ്കിൽ പോലീസിനെയോ സമീപിക്കാമായിരുന്നു.\" - അഞ്ജലി തന്റെ സംശയം അയാളോട് ചോദിച്ചു.", "ഒരു കൈ ആ പടികളുടെ കൈവരിയിൽ വച്ചുകൊണ്ട് അയാൾ നിന്നു. അയാൾ അവളുടെ മുഖത്തേക് നോക്കി. ആ നിമിഷം അയാളുടെ മുഖത്ത് മുൻകൂട്ടി തയ്യാറാക്കിയതോ കരുതലോടെ വരുത്തിയതോ ആയ ഭാവങ്ങളൊന്നും ഉണ്ടായിരുന്നില്ല. ആകെ അവൾക് കാണാനായത് നിസംഗമായ ഭാവം മാത്രമായിരുന്നു.", "അയാൾ ഒരു നെടുവീർപ്പിട്ടു.", "\"കാരണം, നിന്റെ അച്ഛനെ എന്തിനാണ് ഈ കേസിൽ കുടുക്കിയത് എന്ന് നബീൽ സയീദിന് അറിയാം. എന്നെപ്പോലെ തന്നെ അക്കാര്യം അറിയാൻ ആഗ്രഹിക്കുന്ന, ലോകത്തിലെ ഒരേയൊരാൾ നിങ്ങളാണ്.\"", "അതും പറഞ്ഞ് അയാൾ പടികളിറങ്ങി താഴേക്ക് പോയി. ബേക്കറിക്കുള്ളിലൂടെ നടന്ന് ആ തെരുവിലെ തിരക്കുകളിൽ അയാൾ അജ്ഞാതനായി തന്നെ മാഞ്ഞ് പോയി. രോഹൻ അവള്കരികിലേക്ക് വന്നപ്പോൾ ഒരു പതിഞ്ഞ ശബ്ദത്തിൽ മൊബൈൽ ഫോണിൽ നിന്നുള്ള ഒരു സംഗീതം അവൾക് ചുറ്റും വലയം ചെയ്തു.", "രോഹൻ അയാൾ ഇരുന്നിരുന്ന അതെ കസേരയിൽ വന്നിരുന്നു.", "\"അയാൾക് എന്നെ സംശയമുണ്ടായിരുന്നോ\"", "അഞ്ജലി ഒന്ന് ചിരിച്ചു - \"അയാൾക് മനസ്സിലായി\"", "\"ആ, എന്തായാലും ഞാൻ അയാളുടെ ഫോട്ടോ എടുത്തിട്ടുണ്ട്.\" - അവൻ തന്റെ ഫോൺ അവൾക് നേരെ തിരിച്ചു. ഗാലറിയിലെ ഫോട്ടോകൾ ഓപ്പൺ ചെയ്ത അവളെ കാണിച്ചു.", "\"മൂന്ന് ഫോട്ടോകളുണ്ട്. രണ്ടെണ്ണം അത്ര ക്ലാരിറ്റിയില്ല. പക്ഷെ ഇത് നന്നായി കിട്ടിയിട്ടുണ്ട്.\"", "അതൊരു നല്ല ചിത്രമായിരുന്നു. ഇളം നീല ഷർട്ട് ധരിച്ച ഒരാൾ. മുഖം ഒരു വശത്തേക്ക് അല്പം തിരിഞ്ഞിരിക്കുന്നു. കാപ്പി കുടിക്കുന്നതിനിടയിൽ തലയുയർത്തി, അവളുടെ അച്ഛൻ വീട്ടിൽ എന്താണ് സൂക്ഷിച്ചിരുന്നത് എന്ന് ചോദിക്കുന്ന നിമിഷത്തിലാണ് അയാൾ ക്യാമറയിൽ പതിഞ്ഞത്. ആ ഫോട്ടോയിൽ അയാളുടെ കണ്ണുകൾക്ക് മൂർച്ചയുണ്ടായിരുന്നു, ചുണ്ടുകളിൽ ക്ഷമയും. ബാംഗ്ലൂരിലെ ഗ്ലാസ് ഭിത്തികളുള്ള ഓഫീസുകളിൽ ഇരുന്ന്, ഫിനാൻഷ്യൽ മാഗസിൻ വായിച്ചുകൊണ്ടിരിക്കുന്ന, ഇളം നീല ഷർട്ട് ധരിച്ച പതിനായിരക്കണക്കിന് പുരുഷന്മാരിൽ ഒരാളെപ്പോലെയായിരുന്നു അയാളുടെ ആ ഫോട്ടോ കണ്ടപ്പോൾ അഞ്ജലിക്ക് തോന്നിയത്.", "അവൾ ആലോചിച്ചു. തനിക്ക് അയാളുടെ മുഖമേ അറിയില്ല. എന്നാൽ തന്റെ മുഖം ഏതാണെന്ന് അയാൾക് വ്യക്തമായി അറിയാം. ഞാൻ ഈ പടി കയറി വന്ന പാടെ അയാൾ എന്നെ തിരിച്ചറിഞ്ഞിരുന്നു. മാത്രമല്ല, താൻ കുട്ടിയായിരുന്ന കാലം മുതലേ അയാൾക് തന്റെ മുഖം പരിചിതമായിരുന്നു എന്നൊരു സംശയവും അവൾക് തോന്നിത്തുടങ്ങിയിരുന്നു.", "അവൾക് വേണ്ടി അയാൾ ഓർഡർ ചെയ്ത ആ കടുപ്പമുള്ള മധുരം കുറഞ്ഞ കാപ്പി അപ്പോഴും മേശപ്പുറത്ത് തന്നെ ചൂടെല്ലാം നഷ്ടപ്പെട്ട തണുത്തിരിപ്പുണ്ടായിരുന്നു. അവളത് തൊടുക പോലും ചെയ്തിരുന്നില്ല.", "അവൾ ആ ഗ്ളാസ് ഒന്ന് എടുത്ത് അതിലേക് നോക്കി. പിന്നെ എന്തോ ആലോചിച്ചുകൊണ്ട് ഒരൊറ്റ സിപ്പിൽ ആ കാപ്പി മുഴുവൻ കുടിച്ച് തീർത്തു."], "isNew": false}, {"label": "അദ്ധ്യായം 5", "title": "അദ്ധ്യായം 5", "paras": ["ഒരു ലാപ്ടോപ് സ്‌ക്രീനിൽ പോസ് ചെയ്ത് വച്ച ഒരു മുഖം കാണാം. എന്തോ പറയുന്നതിനിടയിൽ ഉറഞ്ഞ് പോയ പോലെയാണ് ആ മുഖം കാണുമ്പോൾ തോന്നുന്നത്. ഇരുണ്ട നിറം, ക്ളീൻ ഷേവ് ചെയ്ത കവിൾ, അല്പം തടിച്ച താടിയെല്ലുകൾ. മെറൂൺ നിറത്തിലുള്ള ഒരു സ്യൂട്ടാണ് അയാൾ ധരിച്ചിരിക്കുന്നത്. ഒരു മീറ്റിംഗിൽ നിന്ന് ഇറങ്ങി വന്ന പോലെ ടൈ അല്പം അയച്ചിട്ടുണ്ട്. അയാൾക് പുറകിൽ ഒരു നീല വെളിച്ചവും, 2019-ൽ ദുബായിൽ നടന്ന ഒരു ഫിൻടെക് കോൺഫറൻസിന്റെ ലോഗോയും കാണാം. വീഡിയോ നിൽക്കുന്ന ഫ്രയീം അയാൾ എന്തോ സംസാരിക്കുന്നതിനിടയിലുള്ളതാണ്. കണ്ണുകൾ ക്യാമറയ്ക്ക് അല്പം ഇടത്തേക്ക്, ക്യാമറയിൽ കാണാത്ത മറ്റൊരാളിലേക്ക് ഉറ്റുനോക്കുന്നു.", "നബീൽ സയീദ്.", "ആ മുറിയിൽ കേൾക്കാമായിരുന്നത് ലാപ്ടോപ്പ് ഫാനിന്റെ ശബ്ദവും, അതിനു താഴെയായി അടുക്കളയിലെ റഫ്രിജറേറ്റർ തണുപ്പിക്കുന്നതിനിടയിൽ ഉണ്ടാക്കുന്ന നേരിയ ശബ്ദവും മാത്രമായിരുന്നു. സമയം പുലർച്ചെ രണ്ടുമണി കഴിഞ്ഞു പത്തു മിനിറ്റ്. അഞ്ജലി ആ ക്ലിപ്പ് പതിനൊന്നു തവണ കണ്ടുകഴിഞ്ഞിരുന്നു.", "അവൾ വീണ്ടും 'പ്ലേ' ബട്ടൺ അമർത്തി.", "“- പിന്നെ മൂല്യത്തിന്റെ ഭാവിയും,” നിക്ഷേപകർ നിറഞ്ഞ മുറികളിൽ സംസാരിച്ച് ശീലമുള്ള ഒരാളുടേതായ, അനായാസവും അല്പം നാടകീയവുമായ ശൈലിയിൽ നബീൽ പറഞ്ഞു, “അത് പരിശോധിച്ചുറപ്പിക്കാവുന്ന വിശ്വാസമാണ്. ഒരു വ്യക്തിയിലുള്ള വിശ്വാസമല്ല. മറിച്ച്, രേഖകളിലുള്ള വിശ്വാസം. മനുഷ്യർ കള്ളം പറഞ്ഞേക്കാം. എന്നാൽ രേഖകളോ-”", "അദ്ദേഹം അല്പനേരം നിർത്തി, ഒന്ന് പുഞ്ചിരിച്ചു. അവൾക്ക് കേൾക്കാൻ കഴിയാത്ത എന്തോ ഒന്നിനെച്ചൊല്ലി സദസ്സ് പൊട്ടിച്ചിരിച്ചു.", "“റെക്കോഡുകൾ എല്ലാം ഓർമ്മിക്കുന്നു.”", "അവൾ അവിടെ അത് നിർത്തി. ഫ്രെയിമിന്റെ ഇടത്തെ അരികിൽ, മുൻനിരയിലുണ്ടായിരുന്ന ഒരാൾ മറ്റാരെക്കാളും മുമ്പേ കൈയടിക്കാൻ തുടങ്ങിയിരുന്നു. അയാളുടെ തോളും മുഖത്തിന്റെ വശവും മാത്രമേ കാണാനുണ്ടായിരുന്നുള്ളൂ. കൃതാവിൽ നരച്ച മുടി, കയ്യിൽ ഒരു വലിയ സ്വർണ്ണ വാച്ച്, കൈയടിക്കുന്നതിനിടയിൽ ഉയർന്നുനിൽക്കുന്ന കൈ.", "അവൾ ആ ഫ്രയിമിന്റെ ഒരു സ്ക്രീൻഷോട്ട് എടുത്തു.", "പുലർച്ചെ നാലുമണിയായപ്പോഴേക്കും, മുൻപ് പലരെയും രൂപപ്പെടുത്തിയെടുത്തതുപോലെ തന്നെ, പല കഷ്ണങ്ങളിൽ നിന്ന് അഞ്ജലി നബീൽ സയീദിനെയും കെട്ടിപ്പടുത്തു കഴിഞ്ഞിരുന്നു.", "ഹൈദരാബാദിൽ ജനനം. കൊമേഴ്‌സിൽ ബിരുദം, തുടർന്ന് ലണ്ടനിൽ ഫിനാൻസിൽ ബിരുദാനന്തര ബിരുദം. ബഹ്‌റൈനിലെ ഒരു ബാങ്കിൽ എട്ട് വർഷത്തെ സേവനം. പിന്നീട് 2013-ൽ ദുബായിലെത്തി. അവിടെ തുടങ്ങിയ ഒരു ചെറിയ കൺസൾട്ടൻസി സ്ഥാപനം വളർന്ന്, 2018-ഓടെ \"പരമ്പരാഗത മൂലധനവും ഡിജിറ്റൽ സമ്പദ്‌വ്യവസ്ഥയും തമ്മിലുള്ള ഒരു പാലം\" എന്ന് സ്വയം വിശേഷിപ്പിക്കുന്ന ഒരു നിക്ഷേപ സ്ഥാപനം ആയി മാറി. ഗൾഫ് ബിസിനസ് മാഗസിനുകളിൽ അഭിമുഖങ്ങൾ. ഒരു ചാരിറ്റി ഡിന്നർ. ഒര
